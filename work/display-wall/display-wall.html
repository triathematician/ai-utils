<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveLab MegaWall</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0b0e;
    --surface: #0f1116;
    --surface2: #161a22;
    --border: #1e2330;
    --border-bright: #2e3650;
    --accent: #4af0c8;
    --accent3: #f05c7b;
    --text: #e8ecf5;
    --text-dim: #5a6380;
    --text-dimmer: #2e3450;
    --group-gap: 5px;
    --cell-gap: 2px;
    --cell-radius: 3px;
    --half: 50vh;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    display: flex; flex-direction: column;
    user-select: none;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(74,240,200,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,240,200,0.012) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none; z-index: 0;
  }

  /* ════════════ TOP HALF ════════════ */
  #top-half {
    height: var(--half);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; z-index: 1;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }

  #topbar {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 7px;
  }
  .logo {
    font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 800;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); opacity: 0.7;
  }
  .dims { font-size: 9px; color: var(--text-dimmer); letter-spacing: 0.1em; }
  .sep  { font-size: 9px; color: var(--text-dimmer); opacity: 0.3; }

  #wall-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 8px 6px;
    box-shadow: 0 0 0 1px rgba(74,240,200,0.04), 0 16px 48px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.025);
  }

  #wall {
    display: flex; gap: var(--group-gap);
    cursor: crosshair; position: relative; align-items: flex-start;
  }

  .group { display: flex; flex-direction: column; }
  .group-label {
    font-size: 7px; letter-spacing: 0.15em; color: var(--text-dimmer);
    text-align: center; margin-bottom: 3px; text-transform: uppercase; height: 9px; line-height: 9px;
  }
  .group-bar { height: 3px; border-radius: 2px; margin-top: 5px; opacity: 0.4; }
  .rows { display: flex; flex-direction: column; gap: var(--cell-gap); }
  .row  { display: flex; gap: var(--cell-gap); }

  .cell {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--cell-radius);
    position: relative; overflow: hidden;
    transition: border-color 0.08s; flex-shrink: 0;
  }
  .cell:hover { border-color: var(--border-bright); }
  .cell.selected {
    background: rgba(74,240,200,0.10); border-color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(74,240,200,0.15);
  }
  .cell.has-image { border-color: var(--border-bright); }
  .cell.has-image.selected { border-color: var(--accent); }

  .cell-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; pointer-events: none; display: block;
  }
  .cell-id {
    position: absolute; bottom: 2px; right: 3px;
    font-size: 7px; color: var(--text-dimmer); pointer-events: none; line-height: 1;
  }
  .cell.has-image .cell-id { display: none; }

  #bottombar {
    display: flex; align-items: center; gap: 10px;
    margin-top: 7px; width: 100%;
  }
  #status { font-size: 9px; color: var(--text-dim); flex: 1; letter-spacing: 0.04em; }
  #status strong { color: var(--accent); }

  .btn {
    background: transparent; border: 1px solid var(--border-bright);
    color: var(--text-dim); font-family: 'JetBrains Mono', monospace;
    font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 3px; cursor: pointer; transition: all 0.12s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(74,240,200,0.05); }
  .btn.danger:hover { border-color: var(--accent3); color: var(--accent3); background: rgba(240,92,123,0.05); }

  #hints {
    display: flex; gap: 14px; margin-top: 5px; flex-wrap: wrap; justify-content: center;
  }
  .hint { display: flex; align-items: center; gap: 4px; font-size: 8px; color: var(--text-dimmer); letter-spacing: 0.04em; }
  kbd {
    background: var(--surface2); border: 1px solid var(--border-bright);
    border-radius: 2px; padding: 1px 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 7px; color: var(--text-dim);
  }

  /* ════════════ BOTTOM HALF ════════════ */
  #bot-half {
    height: var(--half);
    position: relative; z-index: 1; overflow: hidden;
  }

  #three-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block;
  }

  #preview-label {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 700;
    letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--text-dimmer); pointer-events: none;
  }

  /* ── Rubber band ── */
  #rubber-band {
    position: fixed; border: 1.5px solid var(--accent);
    background: rgba(74,240,200,0.06); pointer-events: none;
    display: none; z-index: 100; border-radius: 2px;
  }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 16px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--surface); border: 1px solid var(--accent);
    color: var(--accent); font-size: 10px; padding: 6px 16px; border-radius: 4px;
    letter-spacing: 0.07em; opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 300; box-shadow: 0 8px 28px rgba(0,0,0,0.6);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Context menu ── */
  #ctx-menu {
    position: fixed; background: var(--surface); border: 1px solid var(--border-bright);
    border-radius: 5px; padding: 3px 0; z-index: 400; display: none; min-width: 155px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.7);
  }
  #ctx-menu button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 10px;
    padding: 7px 13px; cursor: pointer; letter-spacing: 0.04em; transition: background 0.1s, color 0.1s;
  }
  #ctx-menu button:hover { background: rgba(74,240,200,0.07); color: var(--text); }
  #ctx-menu button.sep { border-top: 1px solid var(--border); margin-top: 3px; padding-top: 7px; }
  #ctx-menu button.del:hover { background: rgba(240,92,123,0.07); color: var(--accent3); }
</style>
</head>
<body>

<!-- ═══ TOP HALF ═══ -->
<div id="top-half">
  <div id="topbar">
    <span class="logo">LiveLab MegaWall</span>
    <span class="sep">·</span>
    <span class="dims">16 × 3 screens</span>
    <span class="sep">·</span>
    <span class="dims">(3×3)(3×3)(4×3)(3×3)(3×3)</span>
    <span class="sep">·</span>
    <span class="dims">16:9 per screen</span>
  </div>
  <div id="wall-wrap">
    <div id="wall"></div>
  </div>
  <div id="bottombar">
    <div id="status">Drag to select · Ctrl+V to paste image</div>
    <button class="btn" id="btn-desel">Deselect</button>
    <button class="btn danger" id="btn-clear">Clear All</button>
  </div>
  <div id="hints">
    <div class="hint"><span>Drag</span> — select</div>
    <div class="hint"><kbd>Ctrl+V</kbd> — paste</div>
    <div class="hint"><kbd>Ctrl+A</kbd> — all</div>
    <div class="hint"><kbd>Del</kbd> — clear sel.</div>
    <div class="hint"><kbd>Esc</kbd> — deselect</div>
    <div class="hint">Right-click — menu</div>
  </div>
</div>

<!-- ═══ BOTTOM HALF ═══ -->
<div id="bot-half">
  <canvas id="three-canvas"></canvas>
  <div id="preview-label">3D Preview — U-Shape Configuration</div>
</div>

<div id="rubber-band"></div>
<div id="toast"></div>

<div id="ctx-menu">
  <button id="ctx-paste">Paste Image (Ctrl+V)</button>
  <button id="ctx-file">Open from File…</button>
  <button id="ctx-desel2">Deselect All</button>
  <button class="sep del" id="ctx-del">Clear Images in Selection</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════════════
// WALL DEFINITION
// ══════════════════════════════════════════════════════════════════════════════
const GROUPS     = [{cols:3,rows:3},{cols:3,rows:3},{cols:4,rows:3},{cols:3,rows:3},{cols:3,rows:3}];
const TOTAL_COLS = GROUPS.reduce((s,g) => s + g.cols, 0); // 16
const TOTAL_ROWS = 3;
const ASPECT     = 16 / 9;
const GROUP_COLORS_HEX = ['#f97316','#eab308','#ef4444','#3b82f6','#22c55e'];

// ══════════════════════════════════════════════════════════════════════════════
// 2D CELL SIZE — uses top half height only
// ══════════════════════════════════════════════════════════════════════════════
const CHROME_V   = 90;
const CHROME_H_P = 36;

function computeCellSize() {
  const vw = window.innerWidth  - CHROME_H_P;
  const vh = window.innerHeight * 0.5 - CHROME_V;
  const GROUP_GAP = 5, CELL_GAP = 2, LABEL_H = 12;
  const gapW = GROUP_GAP * (GROUPS.length - 1) + CELL_GAP * (TOTAL_COLS - GROUPS.length);
  const gapH = LABEL_H + CELL_GAP * (TOTAL_ROWS - 1);
  const wFromW = (vw - gapW) / TOTAL_COLS;
  const wFromH = ((vh - gapH) / TOTAL_ROWS) * ASPECT;
  const cellW = Math.floor(Math.min(wFromW, wFromH));
  const cellH = Math.round(cellW / ASPECT);
  return { cellW, cellH };
}

// ══════════════════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════════════════
let cells    = [];
let selected = new Set();
let { cellW, cellH } = computeCellSize();

// ══════════════════════════════════════════════════════════════════════════════
// BUILD 2D GRID
// ══════════════════════════════════════════════════════════════════════════════
const wall = document.getElementById('wall');
let colOffset = 0;

GROUPS.forEach((g, gi) => {
  const groupEl = document.createElement('div');
  groupEl.className = 'group';

  const lbl = document.createElement('div');
  lbl.className = 'group-label';
  lbl.textContent = `G${gi+1}`;
  groupEl.appendChild(lbl);

  const rowsEl = document.createElement('div');
  rowsEl.className = 'rows';

  for (let r = 0; r < g.rows; r++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    for (let c = 0; c < g.cols; c++) {
      const col = colOffset + c;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = col;
      cell.style.width  = cellW + 'px';
      cell.style.height = cellH + 'px';
      const id = document.createElement('span');
      id.className = 'cell-id';
      id.textContent = `${col+1}·${r+1}`;
      cell.appendChild(id);
      rowEl.appendChild(cell);
      if (!cells[r]) cells[r] = [];
      cells[r][col] = { el: cell, img: null };
    }
    rowsEl.appendChild(rowEl);
  }

  groupEl.appendChild(rowsEl);

  const bar = document.createElement('div');
  bar.className = 'group-bar';
  bar.style.background = GROUP_COLORS_HEX[gi];
  groupEl.appendChild(bar);

  wall.appendChild(groupEl);
  colOffset += g.cols;
});

// ══════════════════════════════════════════════════════════════════════════════
// RESIZE
// ══════════════════════════════════════════════════════════════════════════════
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const s = computeCellSize();
    cellW = s.cellW; cellH = s.cellH;
    document.querySelectorAll('.cell').forEach(el => {
      el.style.width  = cellW + 'px';
      el.style.height = cellH + 'px';
    });
    onResize3D();
  }, 60);
});

// ══════════════════════════════════════════════════════════════════════════════
// SELECTION
// ══════════════════════════════════════════════════════════════════════════════
const key = (r,c) => `${r},${c}`;

function setSelected(keys) {
  selected.forEach(k => { const [r,c]=k.split(',').map(Number); cells[r]?.[c]?.el.classList.remove('selected'); });
  selected = new Set(keys);
  selected.forEach(k => { const [r,c]=k.split(',').map(Number); cells[r]?.[c]?.el.classList.add('selected'); });
  updateStatus();
}
const clearSel = () => setSelected([]);

function updateStatus() {
  const el = document.getElementById('status');
  if (!selected.size) el.innerHTML = 'Drag to select · <strong>Ctrl+V</strong> to paste image';
  else el.innerHTML = `<strong>${selected.size}</strong> screen${selected.size>1?'s':''} selected · <strong>Ctrl+V</strong> to paste`;
}

// ══════════════════════════════════════════════════════════════════════════════
// RUBBER-BAND
// ══════════════════════════════════════════════════════════════════════════════
let drag = null;
const rb = document.getElementById('rubber-band');

wall.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  drag = { sx: e.clientX, sy: e.clientY };
  clearSel();
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  const x=Math.min(drag.sx,e.clientX), y=Math.min(drag.sy,e.clientY);
  const w=Math.abs(e.clientX-drag.sx), h=Math.abs(e.clientY-drag.sy);
  if (w>3||h>3) {
    Object.assign(rb.style,{display:'block',left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
    const hits=[];
    for (let r=0;r<TOTAL_ROWS;r++) for(let c=0;c<TOTAL_COLS;c++) {
      if (!cells[r]?.[c]) continue;
      const rect=cells[r][c].el.getBoundingClientRect();
      if (rect.right>x&&rect.left<x+w&&rect.bottom>y&&rect.top<y+h) hits.push(key(r,c));
    }
    setSelected(hits);
  }
});
document.addEventListener('mouseup', e => {
  if (!drag) return;
  rb.style.display='none';
  if (Math.abs(e.clientX-drag.sx)<4 && Math.abs(e.clientY-drag.sy)<4) {
    const t=e.target.closest('.cell');
    if (t) {
      const k=key(+t.dataset.r,+t.dataset.c);
      if (e.shiftKey||e.ctrlKey) { const ns=new Set(selected); ns.has(k)?ns.delete(k):ns.add(k); setSelected([...ns]); }
      else setSelected([k]);
    } else clearSel();
  }
  drag=null;
});

// ══════════════════════════════════════════════════════════════════════════════
// IMAGE PASTE / APPLY
// ══════════════════════════════════════════════════════════════════════════════
document.addEventListener('paste', e => {
  if (!selected.size) { toast('Select screens first'); return; }
  const items=e.clipboardData?.items; if (!items) return;
  for (const item of items) if (item.type.startsWith('image/')) { applyToSelection(URL.createObjectURL(item.getAsFile())); return; }
  toast('No image in clipboard');
});

async function pasteFromClipboard() {
  if (!selected.size) { toast('Select screens first'); return; }
  try {
    const items=await navigator.clipboard.read();
    for (const item of items) { const t=item.types.find(t=>t.startsWith('image/')); if(t){applyToSelection(URL.createObjectURL(await item.getType(t)));return;} }
    toast('No image in clipboard');
  } catch { toast('Clipboard denied — use Ctrl+V'); }
}

function applyToSelection(url) {
  if (!selected.size) return;
  let minR=Infinity,maxR=-Infinity,minC=Infinity,maxC=-Infinity;
  selected.forEach(k=>{const [r,c]=k.split(',').map(Number);minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c);});
  const spanR=maxR-minR+1, spanC=maxC-minC+1;
  const img=new Image();
  img.onload=()=>{
    selected.forEach(k=>{
      const [r,c]=k.split(',').map(Number);
      const fx=(c-minC)/spanC, fy=(r-minR)/spanR, fw=1/spanC, fh=1/spanR;
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*fw); canvas.height=Math.round(img.height*fh);
      canvas.getContext('2d').drawImage(img,fx*img.width,fy*img.height,img.width*fw,img.height*fh,0,0,canvas.width,canvas.height);
      setCellImage(r,c,canvas.toDataURL());
    });
    toast(`Applied to ${selected.size} screen${selected.size>1?'s':''}`);
    scheduleTextureUpdate();
  };
  img.src=url;
}

function setCellImage(r, c, dataURL) {
  const cell=cells[r]?.[c]; if (!cell) return;
  cell.img=dataURL;
  cell.el.querySelector('.cell-img')?.remove();
  if (dataURL) {
    const imgEl=document.createElement('img'); imgEl.className='cell-img'; imgEl.src=dataURL;
    cell.el.insertBefore(imgEl,cell.el.firstChild); cell.el.classList.add('has-image');
  } else { cell.el.classList.remove('has-image'); }
}

function clearImages(keys) { keys.forEach(k=>{const[r,c]=k.split(',').map(Number);setCellImage(r,c,null);}); scheduleTextureUpdate(); }

// ══════════════════════════════════════════════════════════════════════════════
// KEYBOARD
// ══════════════════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key==='Escape') clearSel();
  if ((e.key==='Delete'||e.key==='Backspace')&&selected.size) { clearImages([...selected]); toast(`Cleared ${selected.size} screen${selected.size>1?'s':''}`); }
  if (e.ctrlKey&&e.key==='a') { e.preventDefault(); const all=[]; for(let r=0;r<TOTAL_ROWS;r++)for(let c=0;c<TOTAL_COLS;c++)all.push(key(r,c)); setSelected(all); }
});

// ══════════════════════════════════════════════════════════════════════════════
// TOOLBAR
// ══════════════════════════════════════════════════════════════════════════════
document.getElementById('btn-desel').addEventListener('click',clearSel);
document.getElementById('btn-clear').addEventListener('click',()=>{ for(let r=0;r<TOTAL_ROWS;r++)for(let c=0;c<TOTAL_COLS;c++)setCellImage(r,c,null); scheduleTextureUpdate(); toast('All images cleared'); });

// ══════════════════════════════════════════════════════════════════════════════
// CONTEXT MENU
// ══════════════════════════════════════════════════════════════════════════════
const ctxMenu=document.getElementById('ctx-menu');
wall.addEventListener('contextmenu',e=>{ e.preventDefault(); const t=e.target.closest('.cell'); if(t){const k=key(+t.dataset.r,+t.dataset.c);if(!selected.has(k))setSelected([k]);} const lx=Math.min(e.clientX,window.innerWidth-170),ly=Math.min(e.clientY,window.innerHeight-140); Object.assign(ctxMenu.style,{display:'block',left:lx+'px',top:ly+'px'}); });
const closeCtx=()=>{ctxMenu.style.display='none';};
document.addEventListener('click',closeCtx);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCtx();});
document.getElementById('ctx-paste').addEventListener('click',()=>{closeCtx();pasteFromClipboard();});
document.getElementById('ctx-desel2').addEventListener('click',()=>{closeCtx();clearSel();});
document.getElementById('ctx-del').addEventListener('click',()=>{ closeCtx(); if(!selected.size)return; clearImages([...selected]); toast(`Cleared ${selected.size} screen${selected.size>1?'s':''}`); });
document.getElementById('ctx-file').addEventListener('click',()=>{ closeCtx(); if(!selected.size){toast('Select screens first');return;} const inp=document.createElement('input'); inp.type='file';inp.accept='image/*'; inp.onchange=()=>{if(inp.files[0])applyToSelection(URL.createObjectURL(inp.files[0]));}; inp.click(); });

// ══════════════════════════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════════════════════════
let toastT;
function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }

// ══════════════════════════════════════════════════════════════════════════════
// THREE.JS 3D PREVIEW
// ══════════════════════════════════════════════════════════════════════════════
const botEl   = document.getElementById('bot-half');
const canvas3 = document.getElementById('three-canvas');

const renderer = new THREE.WebGLRenderer({ canvas: canvas3, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0a0b0e, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x0a0b0e, 20, 60);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 0.8, 11);
camera.lookAt(0, 1.2, 0);

function onResize3D() {
  const w = botEl.clientWidth, h = botEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
onResize3D();

// ── Lighting ──
const ambient = new THREE.AmbientLight(0x1a2035, 3);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(5, 10, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x4af0c8, 0.3);
fillLight.position.set(-8, 4, 6);
scene.add(fillLight);

const backLight = new THREE.DirectionalLight(0x7b5cf0, 0.25);
backLight.position.set(0, 6, -10);
scene.add(backLight);

// ── Floor ──
const floorGeo = new THREE.PlaneGeometry(60, 40);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x0d0f14, roughness: 0.95, metalness: 0.1 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.05;
floor.receiveShadow = true;
scene.add(floor);

// ── Grid lines on floor ──
const gridHelper = new THREE.GridHelper(40, 40, 0x1a2030, 0x111520);
gridHelper.position.y = 0;
scene.add(gridHelper);

// ══════════════════════════════════════════════════════════════════════════════
// PANEL GEOMETRY
// Each group is a panel. Aspect = cols/rows * (16/9 per screen).
// Panel width in world units = cols, height = rows * (9/16) * (1) → normalised so centre group ≈ 4 units wide
// ══════════════════════════════════════════════════════════════════════════════

// Screen unit: make centre panel (4 cols × 3 rows) about 5.6 units wide
const UNIT = 5.6 / 4;   // ≈ 1.4 world units per screen column
const SCREEN_H = UNIT * (9/16);  // height of one screen row in world units

// Panel gap in world units
const PANEL_GAP = 0.12;

// Bezel thickness
const BEZEL = 0.06;

// Pre-compute group panel sizes
const panelSizes = GROUPS.map(g => ({
  w: g.cols * UNIT + (g.cols - 1) * 0.01,
  h: g.rows * SCREEN_H + (g.rows - 1) * 0.01,
  cols: g.cols, rows: g.rows
}));

// ── U-shape placement via corner-chaining ─────────────────────────────────────
// Strategy:
//   1. Place centre panel (gi=2) flat, centred at origin, facing +Z.
//   2. Find its right corner. The next panel (gi=3) is at 22.5° angle from it —
//      its left corner coincides with gi=2's right corner.
//   3. Repeat for gi=4 at another 22.5° from gi=3.
//   4. Mirror for the left side (gi=1, gi=0).
//
// Each panel has:
//   position  = world XZ of its local origin (centre of face)
//   angle     = rotation.y (positive = rotated left/CCW when viewed from above)
//
// Convention: angle=0 means panel faces viewer (+Z direction).
// Panel local X runs left-to-right; its corners in world space:
//   rightCorner = position + rotate([ w/2, 0], -angle)
//   leftCorner  = position + rotate([-w/2, 0], -angle)

function rotXZ(x, z, a) {
  // rotate 2D point (x,z) by angle a around origin
  return { x: x * Math.cos(a) - z * Math.sin(a),
           z: x * Math.sin(a) + z * Math.cos(a) };
}

const KINK = 35 * Math.PI / 180; // angle between adjacent panels (35 then 70 total)

// ── Corner-chained U-shape placement ─────────────────────────────────────────
// Three.js rotation.y convention: positive = CCW from above.
// Panel at angle A: local X maps to world as:
//   world_x = px + lx*cos(A)
//   world_z = pz + lx*sin(A)
// Right corner (lx=+w/2): (px + w/2*cos(A), pz + w/2*sin(A))
// Left  corner (lx=-w/2): (px - w/2*cos(A), pz - w/2*sin(A))
//
// U opens toward viewer (+Z). Right panels: angle < 0 (CW from above, right side recedes).
// Left panels: angle > 0 (CCW from above, left side recedes).

const placements = new Array(5);

// Centre panel flat at origin
placements[2] = { x: 0, z: 0, angle: 0 };

// Walk RIGHT: gi=3, gi=4  (angle goes negative, z goes POSITIVE = toward camera)
{
  let prevX = 0, prevZ = 0, prevA = 0, prevW = panelSizes[2].w;
  [3, 4].forEach(gi => {
    const na = prevA - KINK;
    const pw = panelSizes[gi].w;
    // Right corner of previous panel
    const rcX = prevX + (prevW/2) * Math.cos(prevA);
    const rcZ = prevZ - (prevW/2) * Math.sin(prevA);  // note: minus to go toward camera
    // Left corner of new panel must equal that
    const nx = rcX + (pw/2) * Math.cos(na);
    const nz = rcZ - (pw/2) * Math.sin(na);
    placements[gi] = { x: nx, z: nz, angle: na };
    prevX = nx; prevZ = nz; prevA = na; prevW = pw;
  });
}

// Walk LEFT: gi=1, gi=0  (angle goes positive, z goes POSITIVE = toward camera)
{
  let prevX = 0, prevZ = 0, prevA = 0, prevW = panelSizes[2].w;
  [1, 0].forEach(gi => {
    const na = prevA + KINK;
    const pw = panelSizes[gi].w;
    // Left corner of previous panel
    const lcX = prevX - (prevW/2) * Math.cos(prevA);
    const lcZ = prevZ + (prevW/2) * Math.sin(prevA);  // note: plus to go toward camera
    // Right corner of new panel must equal that
    const nx = lcX - (pw/2) * Math.cos(na);
    const nz = lcZ + (pw/2) * Math.sin(na);
    placements[gi] = { x: nx, z: nz, angle: na };
    prevX = nx; prevZ = nz; prevA = na; prevW = pw;
  });
}

// Push whole assembly back slightly so it sits nicely in frame
const zShift = -1.5;
placements.forEach(p => { p.z += zShift; });

// ── Per-cell canvas textures ──
// textures[r][c] = THREE.CanvasTexture
const textures = [];

function makeCellCanvas(r, c) {
  const cvs = document.createElement('canvas');
  cvs.width  = 320; cvs.height = 180; // 16:9
  const ctx  = cvs.getContext('2d');
  // find group color for this col
  let gCol = 0; let cum = 0;
  for (let gi=0; gi<GROUPS.length; gi++) { cum += GROUPS[gi].cols; if (c < cum) { gCol = gi; break; } }
  const hexColor = GROUP_COLORS_HEX[gCol];
  ctx.fillStyle = '#161a22';
  ctx.fillRect(0,0,320,180);
  // subtle group tint border
  ctx.strokeStyle = hexColor;
  ctx.lineWidth = 6; ctx.globalAlpha = 0.25;
  ctx.strokeRect(3,3,314,174);
  ctx.globalAlpha = 1;
  return { cvs, ctx };
}

function buildTextures() {
  for (let r=0;r<TOTAL_ROWS;r++) {
    textures[r] = [];
    for (let c=0;c<TOTAL_COLS;c++) {
      const { cvs, ctx } = makeCellCanvas(r,c);
      const tex = new THREE.CanvasTexture(cvs);
      textures[r][c] = { canvas: cvs, ctx, tex };
    }
  }
}
buildTextures();

function updateCellTexture(r, c) {
  const entry = textures[r]?.[c]; if (!entry) return;
  const { cvs, ctx, tex } = entry;
  const cell = cells[r]?.[c];
  ctx.clearRect(0,0,320,180);
  if (cell?.img) {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img,0,0,320,180); tex.needsUpdate=true; };
    img.src = cell.img;
  } else {
    let gCol=0, cum=0;
    for (let gi=0;gi<GROUPS.length;gi++) { cum+=GROUPS[gi].cols; if(c<cum){gCol=gi;break;} }
    ctx.fillStyle='#161a22'; ctx.fillRect(0,0,320,180);
    ctx.strokeStyle=GROUP_COLORS_HEX[gCol]; ctx.lineWidth=6; ctx.globalAlpha=0.25;
    ctx.strokeRect(3,3,314,174); ctx.globalAlpha=1;
    tex.needsUpdate=true;
  }
}

let texUpdateTimer;
function scheduleTextureUpdate() {
  clearTimeout(texUpdateTimer);
  texUpdateTimer = setTimeout(()=>{
    for (let r=0;r<TOTAL_ROWS;r++) for(let c=0;c<TOTAL_COLS;c++) updateCellTexture(r,c);
  }, 80);
}

// ── Build 3D panel groups ──
const panelMeshes = [];

function buildPanels() {
  let colOffset = 0;
  GROUPS.forEach((g, gi) => {
    const { x: px, z: pz, angle } = placements[gi];
    panelMeshes[gi] = [];

    const groupPivot = new THREE.Group();
    scene.add(groupPivot);

    const totalW = g.cols * UNIT + (g.cols - 1) * 0.01;
    const totalH = g.rows * SCREEN_H + (g.rows - 1) * 0.01;
    const startX = -totalW / 2 + UNIT / 2;
    const startY =  totalH / 2 - SCREEN_H / 2;

    for (let r = 0; r < g.rows; r++) {
      panelMeshes[gi][r] = [];
      for (let c = 0; c < g.cols; c++) {
        const col = colOffset + c;

        const geo = new THREE.PlaneGeometry(UNIT - 0.02, SCREEN_H - 0.02);
        const mat = new THREE.MeshStandardMaterial({
          map: textures[r][col].tex,
          roughness: 0.15, metalness: 0.05,
          emissive: new THREE.Color(0x060810),
          emissiveIntensity: 0.4,
        });
        const mesh = new THREE.Mesh(geo, mat);
        const lx = startX + c * (UNIT + 0.01);
        const ly = startY - r * (SCREEN_H + 0.01);
        mesh.position.set(lx, ly, 0);
        groupPivot.add(mesh);

        // Bezel backing
        const bGeo = new THREE.PlaneGeometry(UNIT, SCREEN_H);
        const bMat = new THREE.MeshStandardMaterial({ color: 0x060810, roughness: 0.9 });
        const bezel = new THREE.Mesh(bGeo, bMat);
        bezel.position.set(lx, ly, -0.003);
        groupPivot.add(bezel);

        panelMeshes[gi][r][c] = mesh;
      }
    }

    // Housing slab
    const hwGeo = new THREE.BoxGeometry(totalW + BEZEL*2, totalH + BEZEL*2, 0.08);
    const hwMat = new THREE.MeshStandardMaterial({ color: 0x0a0d12, roughness: 0.8, metalness: 0.4 });
    const housing = new THREE.Mesh(hwGeo, hwMat);
    housing.position.set(0, 0, -0.06);
    housing.castShadow = true; housing.receiveShadow = true;
    groupPivot.add(housing);

    // Colour bar at bottom
    const barGeo = new THREE.BoxGeometry(totalW + BEZEL*2, 0.06, 0.09);
    const barMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(GROUP_COLORS_HEX[gi]),
      roughness: 0.5, metalness: 0.2,
      emissive: new THREE.Color(GROUP_COLORS_HEX[gi]),
      emissiveIntensity: 0.6,
    });
    const bar = new THREE.Mesh(barGeo, barMat);
    bar.position.set(0, -totalH/2 - BEZEL - 0.03, -0.055);
    groupPivot.add(bar);

    // Place pivot using corner-chained position and angle
    groupPivot.position.set(px, totalH / 2 + 0.05, pz);
    groupPivot.rotation.y = angle;

    colOffset += g.cols;
  });
}

buildPanels();

// ── Subtle atmospheric point lights ──
const ptColors = [0xf97316, 0xeab308, 0xef4444, 0x3b82f6, 0x22c55e];
GROUPS.forEach((g, gi) => {
  const { x: px, z: pz } = placements[gi];
  const pl = new THREE.PointLight(ptColors[gi], 0.5, 8);
  pl.position.set(px, 3.5, pz + 0.8);
  scene.add(pl);
});

// ── Animate ──
let frameId;
let time = 0;
function animate() {
  frameId = requestAnimationFrame(animate);
  time += 0.005;
  // Gentle camera sway
  camera.position.x = Math.sin(time * 0.3) * 0.4;
  camera.position.y = 3.5 + Math.sin(time * 0.2) * 0.15;
  camera.lookAt(0, 1.2, 0);
  renderer.render(scene, camera);
}
animate();

// Initial texture populate
scheduleTextureUpdate();

</script>
</body>
</html>
