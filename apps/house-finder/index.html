<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOUSE FINDER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121212; --fg: #ffb000; --accent: #ff0000;
  --dim: #7a5500; --muted: #3a2800; --border: #ffb000;
  --success: #00ff41; --warn: #ff6600;
  --font: 'VT323', 'Courier New', monospace;
  --font-size: 20px; --line-h: 1.4;
}
[data-theme="solar"] {
  --bg:#002b36; --fg:#839496; --accent:#b58900;
  --dim:#4a5456; --muted:#073642; --border:#839496;
  --success:#859900; --warn:#cb4b16; --font:'Fira Code',monospace;
}
[data-theme="monk"] {
  --bg:#f5f5f5; --fg:#2a2a2a; --accent:#000000;
  --dim:#888; --muted:#e0e0e0; --border:#2a2a2a;
  --success:#1a6600; --warn:#aa4400; --font:'Source Code Pro',monospace;
}
[data-theme="space"] {
  --bg:#0a0a1a; --fg:#a0c0ff; --accent:#00ffff;
  --dim:#304060; --muted:#0f0f2a; --border:#304080;
  --success:#00ffaa; --warn:#ff6060; --font:'Fira Code',monospace;
}
[data-theme="synth"] {
  --bg:#1a0033; --fg:#ff00ff; --accent:#00ffff;
  --dim:#660066; --muted:#2a0044; --border:#ff00ff;
  --success:#00ff88; --warn:#ffaa00; --font:'Fira Code',monospace;
}
[data-theme="dos"] {
  --bg:#0000aa; --fg:#aaaaaa; --accent:#ffffff;
  --dim:#5555ff; --muted:#0000cc; --border:#aaaaaa;
  --success:#55ff55; --warn:#ffff55; --font:'VT323',monospace;
}
[data-theme="notebook"] {
  --bg:#fafaf2; --fg:#1a1a2e; --accent:#c0392b;
  --dim:#8a8a9a; --muted:#eeeede; --border:#90a8d4;
  --success:#2e7d32; --warn:#e65100; --font:'Source Code Pro',monospace;
}
[data-theme="winter"] {
  --bg:#0d1b2a; --fg:#d8eaf4; --accent:#7ec8e3;
  --dim:#5a7f94; --muted:#1a2f40; --border:#3d6b8c;
  --success:#4ecdc4; --warn:#f4a261; --font:'Fira Code',monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--font-size);
  line-height: var(--line-h); overflow: hidden;
}
::selection { background: var(--fg); color: var(--bg); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--muted); }
::-webkit-scrollbar-thumb { background: var(--dim); }
#app { display: grid; grid-template-rows: 28vh 62vh 10vh; height: 100vh; width: 100vw; }
#top-row { border-bottom: 1px solid var(--border); padding: 10px 12px; overflow-y: auto; }
#main-row { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
#main-panel { border-right: 1px solid var(--border); padding: 10px 12px; overflow-y: auto; }
#side-panel { padding: 10px 12px; overflow-y: auto; }
.row-header {
  color: var(--accent); font-size: 0.8em; letter-spacing: 2px;
  margin-bottom: 4px; border-bottom: 1px solid var(--muted); padding-bottom: 4px;
}
#console-row {
  background: var(--muted); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 8px;
}
#console-prompt { color: var(--accent); white-space: nowrap; }
#console-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--fg); font-family: var(--font); font-size: var(--font-size);
  caret-color: var(--accent);
}
#console-status { color: var(--dim); font-size: 0.8em; min-width: 180px; text-align: right; white-space: nowrap; }
.summary-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
.metric { border: 1px solid var(--muted); padding: 6px 8px; }
.metric-label { color: var(--dim); font-size: 0.7em; letter-spacing: 1px; }
.metric-value { color: var(--accent); font-size: 1.1em; }
.section-title { color: var(--accent); margin: 8px 0 2px; letter-spacing: 1px; font-size: 0.8em; }
.line { padding: 2px 0; border-bottom: 1px solid var(--muted); }
.line:last-child { border-bottom: none; }
.dim { color: var(--dim); font-size: 0.85em; }
.warn { color: var(--warn); }
.ok { color: var(--success); }
.house-row { padding: 3px 0; border-bottom: 1px solid var(--muted); cursor: pointer; }
.house-row:hover { background: var(--muted); }
.house-row:last-child { border-bottom: none; }
.house-num { color: var(--dim); display: inline-block; width: 3ch; }
.house-visited { display: inline-block; width: 2ch; cursor: pointer; }
.house-visited.is-visited { color: var(--success); }
.house-visited.not-visited { color: var(--dim); }
.house-addr { color: var(--fg); display: inline-block; }
.house-score { color: var(--success); display: inline-block; min-width: 8ch; text-align: right; float: right; }
.house-price { color: var(--accent); display: inline-block; min-width: 10ch; float: right; }
.prio-row { padding: 2px 0; border-bottom: 1px solid var(--muted); }
.prio-row:last-child { border-bottom: none; }
.prio-name { color: var(--fg); }
.prio-weight { color: var(--dim); font-size: 0.85em; }
.badge-exceeds { color: var(--success); }
.badge-meets { color: var(--success); }
.badge-partial { color: var(--warn); }
.badge-no { color: var(--dim); }
.badge-problematic { color: var(--accent); }
#help-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 150;
  align-items: center; justify-content: center;
}
#help-overlay.visible { display: flex; }
.overlay-box {
  background: var(--bg); border: 1px solid var(--border);
  padding: 16px 20px; min-width: 640px; max-width: min(96vw,1100px);
  font-family: var(--font); color: var(--fg); max-height: 90vh; overflow-y: auto;
}
.overlay-box.table-mode { max-width: min(98vw,1600px); }
#help-title { color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; }
#help-body { white-space: pre-wrap; line-height: 1.8; max-height: 70vh; overflow-y: auto; }
#help-close { color: var(--dim); font-size: 0.82em; cursor: pointer; display: block; margin-top: 8px; }
/* sortable table in overlay */
.ht-wrap { overflow-x: auto; }
table.ht { border-collapse: collapse; width: 100%; font-size: 0.85em; }
table.ht th {
  color: var(--accent); border-bottom: 1px solid var(--border);
  padding: 4px 8px; text-align: left; cursor: pointer; white-space: nowrap;
  user-select: none;
}
table.ht th:hover { color: var(--fg); }
table.ht td { padding: 3px 8px; border-bottom: 1px solid var(--muted); vertical-align: top; white-space: nowrap; }
table.ht tr:hover td { background: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div id="top-row">
    <div class="row-header">◈ HOUSE FINDER — SNAPSHOT</div>
    <div class="summary-grid">
      <div class="metric"><div class="metric-label">HOUSES</div><div class="metric-value" id="m-houses">0</div></div>
      <div class="metric"><div class="metric-label">ARCHIVED</div><div class="metric-value" id="m-archived">0</div></div>
      <div class="metric"><div class="metric-label">PRIORITIES</div><div class="metric-value" id="m-prios">0</div></div>
      <div class="metric"><div class="metric-label">TOP SCORE</div><div class="metric-value" id="m-top">—</div></div>
      <div class="metric"><div class="metric-label">AVG SCORE</div><div class="metric-value" id="m-avg">—</div></div>
      <div class="metric"><div class="metric-label">PRICE RANGE</div><div class="metric-value" id="m-price">—</div></div>
      <div class="metric"><div class="metric-label">SQFT RANGE</div><div class="metric-value" id="m-sqft">—</div></div>
    </div>
    <div class="section-title">TOP RANKED</div>
    <div id="top-list" class="dim">No houses yet. Add one with /add.</div>
  </div>
  <div id="main-row">
    <div id="main-panel">
      <div class="row-header">◈ HOUSES</div>
      <div id="house-list" class="dim">No houses yet. Add one with /add.</div>
    </div>
    <div id="side-panel">
      <div class="row-header">◈ PRIORITIES</div>
      <div id="prio-list" class="dim">No priorities yet. Add with /prio add name [weight].</div>
    </div>
  </div>
  <div id="console-row">
    <span id="console-prompt">HOUSE&gt;</span>
    <input type="text" id="console-input" autocomplete="off" spellcheck="false">
    <span id="console-status">READY</span>
  </div>
</div>

<div id="help-overlay">
  <div class="overlay-box">
    <div id="help-title"></div>
    <div id="help-body"></div>
    <span id="help-close">[ESC] CLOSE</span>
  </div>
</div>

<script>
const STORAGE_KEY = 'house_finder_db';
const EXPORT_SLUG = 'house-finder';
const THEMES = ['legacy','solar','monk','space','synth','dos','notebook','winter'];

// ── DB SCHEMA ──────────────────────────────────────────────────────────────
// db.houses   : [{ id, address, price, sqft, mls, link, notes, scores: {prioId: 0..4}, visits: [dateStr,...], archived, tier }]
// db.priorities : [{ id, name, weight }]  weight default 1
// scores: 0=problematic, 1=no, 2=partial, 3=meets, 4=exceeds
// tier: 'S'|'A'|'B'|'C'|'D'|'E'|null (null = unassigned, shown as "-")
// ──────────────────────────────────────────────────────────────────────────

const TIERS = ['S', 'A', 'B', 'C', 'D', 'E'];
const TIER_COLOR = { S: '#ffd700', A: 'var(--success)', B: 'var(--fg)', C: 'var(--warn)', D: 'var(--warn)', E: 'var(--accent)' };

function visibleHouses() { return db.houses.filter(h => !h.archived); }
// resolve a /command reference against the visible (non-archived) list only —
// by id if it matches a visible house, else by position in that list. Keeping
// this scoped to visibleHouses() avoids an archived house's id colliding with
// the on-screen position number of a different, currently-visible house.
function resolveHouseRef(nStr) {
  const n = Number(nStr);
  const visible = visibleHouses();
  return visible.find(x => x.id === n) || visible[n - 1];
}
// resolve by persistent id against ALL houses, including archived ones —
// for commands (like /unarchive) whose target is never in the visible list
function resolveAnyHouseById(nStr) {
  return db.houses.find(x => x.id === Number(nStr));
}

// rating scale: 0=Problematic 1=No 2=Partial 3=Meets 4=Exceeds (unrated defaults to No)
const RATING_MAX = 4;
const RATING_DEFAULT = 1;
// once a house has ratings on at least this many priorities, treat it as fully scored
// and backfill the rest with the default rating, so distribution counts stay consistent
const SCORE_BACKFILL_THRESHOLD = 2;

// count of priorities explicitly rated on a house (vs. defaulted)
function explicitScoreCount(house) {
  return house.scores ? Object.keys(house.scores).length : 0;
}
function isHouseScored(house) {
  return explicitScoreCount(house) > 0;
}
// once explicitScoreCount crosses SCORE_BACKFILL_THRESHOLD, write the default
// rating into every remaining unrated priority so nothing is silently missing
function backfillHouseScores(house, priorities) {
  if (explicitScoreCount(house) < SCORE_BACKFILL_THRESHOLD) return;
  if (!house.scores) house.scores = {};
  priorities.forEach(p => {
    if (!(p.id in house.scores)) house.scores[p.id] = RATING_DEFAULT;
  });
}

let db = loadDB();
saveDB();
let overlayMode = null; // 'help' | 'table' | 'house' | 'prio'
let tableSort = { col: 'score', dir: -1 };
let viewHouseId = null;
let editFieldsOpen = false;

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const p = raw ? JSON.parse(raw) : {};
    p.houses = Array.isArray(p.houses) ? p.houses : [];
    p.priorities = Array.isArray(p.priorities) ? p.priorities : [];
    p.backlog = Array.isArray(p.backlog) ? p.backlog : [];
    p.backlogArchive = Array.isArray(p.backlogArchive) ? p.backlogArchive : [];
    // migrate old 3-point scale (0=no,1=partial,2=meets) to 5-point scale (0=problematic..4=exceeds)
    if (p.ratingScaleVersion !== 2) {
      p.houses.forEach(h => {
        if (h.scores) Object.keys(h.scores).forEach(k => { h.scores[k] += 1; });
      });
      p.ratingScaleVersion = 2;
    }
    p.houses.forEach(h => { if (!Array.isArray(h.visits)) h.visits = []; });
    p.houses.forEach(h => { if (h.archived == null) h.archived = false; });
    p.houses.forEach(h => { if (h.tier === undefined) h.tier = null; });
    p.houses.forEach(h => backfillHouseScores(h, p.priorities));
    return p;
  } catch { return { houses: [], priorities: [], backlog: [], backlogArchive: [] }; }
}
function saveDB() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
function nextId(arr) { return arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1; }
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtPrice(n) {
  if (n == null || n === '') return '—';
  const v = Number(n);
  if (isNaN(v)) return String(n);
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  if (v >= 1000) return '$' + Math.round(v).toLocaleString();
  return '$' + v;
}
function fmtSqft(n) { return (n != null && n !== '') ? Number(n).toLocaleString() + ' sf' : '—'; }
function calcPpsf(h) {
  const price = Number(h.price), sqft = Number(h.sqft);
  return (price > 0 && sqft > 0) ? price / sqft : null;
}
function fmtPpsf(v) { return v != null ? '$' + Math.round(v) : '—'; }
function scoreLabel(v) {
  if (v === 4) return '<span class="badge-exceeds">★</span>';
  if (v === 3) return '<span class="badge-meets">●</span>';
  if (v === 2) return '<span class="badge-partial">◐</span>';
  if (v === 0) return '<span class="badge-problematic">✕</span>';
  return '<span class="badge-no">○</span>';
}
function scoreLabelText(v) {
  if (v === 4) return 'EXCEEDS';
  if (v === 3) return 'MEETS';
  if (v === 2) return 'PARTIAL';
  if (v === 0) return 'PROBLEMATIC';
  return 'NO';
}

// weighted score 0–100
function calcScore(house) {
  if (!db.priorities.length) return null;
  let num = 0, den = 0;
  db.priorities.forEach(p => {
    const w = Number(p.weight) || 1;
    const s = house.scores?.[p.id] ?? RATING_DEFAULT;
    num += s * w;
    den += RATING_MAX * w;
  });
  return den ? Math.round((num / den) * 100) : 0;
}

// score to show in list/table views: null (displayed as "—") until the house has been rated on anything
function displayScore(house) {
  return isHouseScored(house) ? calcScore(house) : null;
}

function statusMsg(msg) {
  document.getElementById('console-status').textContent = msg;
  setTimeout(updateStatus, 3000);
}
function updateStatus() {
  document.getElementById('console-status').textContent = `${db.houses.length} HOUSE${db.houses.length === 1 ? '' : 'S'} · ${db.priorities.length} PRIO${db.priorities.length === 1 ? '' : 'S'}`;
}
function downloadBlob(content, filename, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function applyTheme(name) {
  if (!name) {
    const cur = db.theme || 'legacy';
    const others = THEMES.filter(t => t !== cur);
    name = others[Math.floor(Math.random() * others.length)];
  }
  if (!THEMES.includes(name)) { statusMsg('Unknown theme: ' + name); return; }
  document.documentElement.dataset.theme = name === 'legacy' ? '' : name;
  db.theme = name;
  saveDB();
  statusMsg('Theme: ' + name.toUpperCase());
}

// ── RENDER ────────────────────────────────────────────────────────────────
function renderAll() {
  renderSnapshot();
  renderHouseList();
  renderPrioList();
  updateStatus();
}

function renderSnapshot() {
  const houses = visibleHouses();
  document.getElementById('m-houses').textContent = houses.length;
  document.getElementById('m-archived').textContent = db.houses.length - houses.length;
  document.getElementById('m-prios').textContent = db.priorities.length;
  const scores = houses.map(h => displayScore(h)).filter(s => s !== null);
  if (scores.length) {
    document.getElementById('m-top').textContent = Math.max(...scores);
    const nonZero = scores.filter(s => s > 0);
    document.getElementById('m-avg').textContent = nonZero.length ? Math.round(nonZero.reduce((a,b)=>a+b,0)/nonZero.length) : '—';
  } else {
    document.getElementById('m-top').textContent = '—';
    document.getElementById('m-avg').textContent = '—';
  }
  const prices = houses.map(h => Number(h.price)).filter(v => !isNaN(v) && v > 0);
  if (prices.length) {
    document.getElementById('m-price').textContent = fmtPrice(Math.min(...prices)) + '–' + fmtPrice(Math.max(...prices));
  } else {
    document.getElementById('m-price').textContent = '—';
  }
  const sqfts = houses.map(h => Number(h.sqft)).filter(v => !isNaN(v) && v > 0);
  if (sqfts.length) {
    document.getElementById('m-sqft').textContent = Math.min(...sqfts).toLocaleString() + '–' + Math.max(...sqfts).toLocaleString() + ' sf';
  } else {
    document.getElementById('m-sqft').textContent = '—';
  }

  // top 6 by score (unscored houses sink to the bottom)
  const sorted = [...houses].map(h => ({ h, sort: isHouseScored(h) ? calcScore(h) : -1, disp: displayScore(h) })).sort((a,b) => b.sort - a.sort).slice(0, 6);
  const el = document.getElementById('top-list');
  if (!sorted.length) { el.innerHTML = '<span class="dim">No houses yet. Add one with /add.</span>'; return; }
  el.innerHTML = sorted.map(({ h, disp }, i) =>
    `<div class="house-row" data-id="${h.id}">
      <span class="house-num">${i+1}.</span>
      <span class="house-score">${disp !== null ? disp : '—'}</span>
      <span class="house-price">${fmtPrice(h.price)}</span>
      <span class="house-addr">${escHtml(h.address || '(no address)')}</span>
    </div>`
  ).join('');
  el.querySelectorAll('.house-row').forEach(row =>
    row.addEventListener('click', () => openHouseView(Number(row.dataset.id)))
  );
}

function renderHouseList() {
  const el = document.getElementById('house-list');
  const houses = visibleHouses();
  if (!houses.length) {
    el.innerHTML = db.houses.length
      ? '<span class="dim">All houses are archived. See /archive list.</span>'
      : '<span class="dim">No houses yet. Add one with /add.</span>';
    return;
  }
  el.innerHTML = houses.map((h, i) => {
    const s = displayScore(h);
    const visited = (h.visits || []).length > 0;
    return `<div class="house-row" data-id="${h.id}">
      <span class="house-num">${i+1}.</span>
      <span class="house-visited ${visited ? 'is-visited' : 'not-visited'}" data-hid="${h.id}" title="${visited ? (h.visits.length + ' visit' + (h.visits.length===1?'':'s') + ' — click to clear') : 'Not visited — click to mark visited today'}">${visited ? '☑' : '☐'}</span>
      <span class="house-score">${s !== null ? s : '—'}</span>
      <span class="house-price">${fmtPrice(h.price)}</span>
      <span class="house-addr">${escHtml(h.address || '(no address)')}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.house-row').forEach(row =>
    row.addEventListener('click', () => openHouseView(Number(row.dataset.id)))
  );
  el.querySelectorAll('.house-visited').forEach(el =>
    el.addEventListener('click', e => { e.stopPropagation(); toggleVisited(Number(el.dataset.hid)); })
  );
}

function toggleVisited(hid) {
  const h = db.houses.find(x => x.id === hid);
  if (!h) return;
  if (!Array.isArray(h.visits)) h.visits = [];
  if (h.visits.length) {
    h.visits = [];
    statusMsg(`Cleared visits for house #${h.id}`);
  } else {
    h.visits.push(new Date().toISOString().slice(0, 10));
    statusMsg(`Marked house #${h.id} visited today`);
  }
  saveDB(); renderAll();
  if (overlayMode === 'house' && viewHouseId === hid) renderHouseOverlay(h);
}

// counts of explicit ratings (0..4) for a priority, excluding houses never scored on it
function scoreDistribution(pId) {
  const counts = [0, 0, 0, 0, 0];
  let total = 0;
  db.houses.forEach(h => {
    if (h.scores && Object.prototype.hasOwnProperty.call(h.scores, pId)) {
      counts[h.scores[pId]]++;
      total++;
    }
  });
  return { counts, total };
}

function renderPrioList() {
  const el = document.getElementById('prio-list');
  if (!db.priorities.length) { el.innerHTML = '<span class="dim">No priorities yet. Add with /prio add name [weight].</span>'; return; }
  const symbols = ['✕', '○', '◐', '●', '★'];
  const classes = ['badge-problematic', 'badge-no', 'badge-partial', 'badge-meets', 'badge-exceeds'];
  el.innerHTML = db.priorities.map((p, i) => {
    const { counts, total } = scoreDistribution(p.id);
    const dist = total
      ? counts.map((c, idx) => `<span class="${classes[idx]}">${symbols[idx]}${c}</span>`).join(' ') + ` <span class="dim">(${total} scored)</span>`
      : `<span class="dim">not yet scored</span>`;
    return `<div class="prio-row">
      <span class="house-num">${i+1}.</span>
      <span class="prio-name">${escHtml(p.name)}</span>
      <span class="prio-weight"> (w=${Number(p.weight)||1})</span>
      <div class="prio-dist" style="font-size:0.8em;margin-top:2px;">${dist}</div>
    </div>`;
  }).join('');
}

// ── OVERLAY ───────────────────────────────────────────────────────────────
function openOverlay(title, bodyHtml) {
  document.getElementById('help-title').textContent = title;
  document.getElementById('help-body').innerHTML = bodyHtml;
  const box = document.querySelector('.overlay-box');
  box.classList.remove('table-mode');
  document.getElementById('help-overlay').classList.add('visible');
}
function closeOverlay() {
  document.getElementById('help-overlay').classList.remove('visible');
  overlayMode = null;
  viewHouseId = null;
}

function openHouseView(id) {
  const h = db.houses.find(x => x.id === id);
  if (!h) return;
  overlayMode = 'house';
  viewHouseId = id;
  editFieldsOpen = false;
  renderHouseOverlay(h);
}

function renderHouseOverlay(h) {

  let html = '';

    html += `<div style="border:1px solid var(--accent);color:var(--accent);padding:4px 8px;margin-bottom:8px;font-size:0.85em;">⚠ ARCHIVED — see NOTES below for reason</div>`;
  }
  html += `<div style="margin-bottom:8px;">`;
  html += `<div style="color:var(--accent);font-size:1.1em;">${escHtml(h.address || '(no address)')}</div>`;
  html += `<div><span class="dim">MLS:</span> ${escHtml(h.mls||'—')}  <span class="dim">Price:</span> ${fmtPrice(h.price)}  <span class="dim">Sqft:</span> ${fmtSqft(h.sqft)}</div>`;
  if (h.link) html += `<div><span class="dim">Link:</span> <a href="${escHtml(h.link)}" target="_blank" style="color:var(--success);">${escHtml(h.link)}</a></div>`;
  html += `<div><span class="dim">Score:</span> <span style="color:var(--success);">${score !== null ? score : '—'}</span>` +
    `  <span class="dim">Tier:</span> <span class="tier-cycle" data-hid="${h.id}" title="Click to change tier" style="cursor:pointer;user-select:none;font-weight:bold;color:${TIER_COLOR[h.tier] || 'var(--dim)'};">${h.tier || '-'}</span></div>`;
  html += `</div>`;

  // inline edit form (collapsed by default)
  html += `<div style="margin-bottom:10px;border:1px solid var(--muted);padding:8px;">`;
  html += `<div id="edit-toggle-${h.id}" style="color:var(--accent);font-size:0.8em;cursor:pointer;user-select:none;">${editFieldsOpen ? '▾' : '▸'} EDIT FIELDS</div>`;
  html += `<div id="edit-fields-body-${h.id}" style="${editFieldsOpen ? 'margin-top:6px;' : 'display:none;'}">`;
  const fields = ['address','price','sqft','mls','link'];
  fields.forEach(f => {
    html += `<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;">
      <label style="color:var(--dim);font-size:0.75em;min-width:7ch;text-transform:uppercase;">${f}</label>
      <input id="edit-${f}-${h.id}" type="text" value="${escHtml(h[f]||'')}"
        style="flex:1;background:var(--muted);border:1px solid var(--dim);color:var(--fg);font-family:var(--font);font-size:0.85em;padding:2px 6px;outline:none;"
        data-field="${f}" data-hid="${h.id}">
    </div>`;
  });
  html += `<div style="margin-top:6px;">
    <button id="edit-save-${h.id}" data-hid="${h.id}"
      style="background:var(--muted);border:1px solid var(--border);color:var(--fg);font-family:var(--font);font-size:0.85em;padding:2px 10px;cursor:pointer;">SAVE</button>
  </div></div></div>`;

  if (db.priorities.length) {
    html += `<div class="section-title" style="font-size:0.9em;">PRIORITY SCORES</div>`;
    html += `<table style="border-collapse:collapse;width:100%;font-size:0.85em;margin-bottom:8px;">`;
    html += `<tr><th style="text-align:left;color:var(--dim);padding:2px 6px;">PRIORITY</th><th style="text-align:left;color:var(--dim);padding:2px 6px;">WEIGHT</th><th style="text-align:left;color:var(--dim);padding:2px 6px;">RATING</th></tr>`;
    db.priorities.forEach(p => {
      const v = h.scores?.[p.id] ?? RATING_DEFAULT;
      html += `<tr>
        <td style="padding:2px 6px;">${escHtml(p.name)}</td>
        <td style="padding:2px 6px;color:var(--dim);">${Number(p.weight)||1}</td>
        <td style="padding:2px 6px;cursor:pointer;user-select:none;" class="score-cycle" data-hid="${h.id}" data-pid="${p.id}" title="Click to change rating">${scoreLabel(v)} ${scoreLabelText(v)}</td>

    });
    html += `</table>`;
  }

  const visits = Array.isArray(h.visits) ? [...h.visits].sort() : [];
  html += `<div class="section-title" style="font-size:0.9em;">VISITS</div>`;
  if (visits.length) {

      `<div style="display:flex;align-items:center;gap:8px;padding:1px 0;">
        <span style="color:var(--fg);font-size:0.85em;">${escHtml(d)}</span>
        <span class="visit-remove" data-hid="${h.id}" data-date="${escHtml(d)}" style="color:var(--accent);cursor:pointer;font-size:0.8em;" title="Remove this visit">[x]</span>
      </div>`
    ).join('') + `</div>`;

  html += `<div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;">
    <input id="visit-date-${h.id}" type="date" value="${new Date().toISOString().slice(0,10)}"
      style="background:var(--muted);border:1px solid var(--dim);color:var(--fg);font-family:var(--font);font-size:0.85em;padding:2px 6px;outline:none;">

  html += `<div style="color:var(--fg);font-size:0.85em;white-space:pre-wrap;">${escHtml(h.notes || '(no notes)')} </div>`;

    html += `<button id="unarchive-btn-${h.id}" data-hid="${h.id}"
      style="background:var(--muted);border:1px solid var(--border);color:var(--fg);font-family:var(--font);font-size:0.85em;padding:2px 10px;cursor:pointer;">UNARCHIVE</button>`;
  } else {
    html += `<div style="display:flex;gap:6px;align-items:center;">
      <input id="archive-reason-${h.id}" type="text" placeholder="reason for archiving (required)"

      <button id="archive-btn-${h.id}" data-hid="${h.id}"
        style="background:var(--muted);border:1px solid var(--accent);color:var(--accent);font-family:var(--font);font-size:0.85em;padding:2px 10px;cursor:pointer;">ARCHIVE</button>
    </div>`;
  }
  html += `</div>`;

  openOverlay(`◈ HOUSE #${h.id}`, html);
  // wire up save button
  setTimeout(() => {
    const editToggle = document.getElementById(`edit-toggle-${h.id}`);
    if (editToggle) {
      editToggle.addEventListener('click', () => {
        editFieldsOpen = !editFieldsOpen;
        renderHouseOverlay(h);
      });
    }
    const saveBtn = document.getElementById(`edit-save-${h.id}`);
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        const hid = Number(saveBtn.dataset.hid);
        const house = db.houses.find(x => x.id === hid);
        if (!house) return;
        ['address','price','sqft','mls','link'].forEach(f => {
          const inp = document.getElementById(`edit-${f}-${hid}`);
          if (inp) house[f] = inp.value;
        });
        saveDB(); renderAll();
        renderHouseOverlay(house);
        statusMsg(`Updated house #${house.id}`);
      });
    }
    document.querySelectorAll('.score-cycle').forEach(cell => {
      cell.addEventListener('click', () => cycleScore(Number(cell.dataset.hid), Number(cell.dataset.pid)));
    });
    const tierCycle = document.querySelector('.tier-cycle');
    if (tierCycle) tierCycle.addEventListener('click', () => cycleTier(Number(tierCycle.dataset.hid)));
    const addVisitBtn = document.getElementById(`visit-add-${h.id}`);
    if (addVisitBtn) {
      addVisitBtn.addEventListener('click', () => {
        const hid = Number(addVisitBtn.dataset.hid);
        const dateInp = document.getElementById(`visit-date-${hid}`);
        addVisit(hid, dateInp ? dateInp.value : '');
      });
    }
    document.querySelectorAll('.visit-remove').forEach(el => {
      el.addEventListener('click', () => removeVisit(Number(el.dataset.hid), el.dataset.date));
    });
    const archiveBtn = document.getElementById(`archive-btn-${h.id}`);
    if (archiveBtn) {
      archiveBtn.addEventListener('click', () => {
        const hid = Number(archiveBtn.dataset.hid);
        const reasonInp = document.getElementById(`archive-reason-${hid}`);
        archiveHouse(hid, reasonInp ? reasonInp.value : '');
      });
    }
    const unarchiveBtn = document.getElementById(`unarchive-btn-${h.id}`);
    if (unarchiveBtn) {
      unarchiveBtn.addEventListener('click', () => unarchiveHouse(Number(unarchiveBtn.dataset.hid)));
    }
  }, 0);
}

function addVisit(hid, date) {
  const house = db.houses.find(x => x.id === hid);
  if (!house) return;
  const d = (date || '').trim() || new Date().toISOString().slice(0, 10);
  if (!Array.isArray(house.visits)) house.visits = [];
  if (house.visits.includes(d)) { statusMsg(`Visit on ${d} already recorded`); return; }
  house.visits.push(d);
  saveDB(); renderAll();
  if (overlayMode === 'house' && viewHouseId === hid) renderHouseOverlay(house);
  statusMsg(`Added visit on ${d} for house #${house.id}`);
}

function removeVisit(hid, date) {
  const house = db.houses.find(x => x.id === hid);
  if (!house || !Array.isArray(house.visits)) return;
  house.visits = house.visits.filter(d => d !== date);
  saveDB(); renderAll();
  if (overlayMode === 'house' && viewHouseId === hid) renderHouseOverlay(house);
  statusMsg(`Removed visit on ${date} for house #${house.id}`);
}

function cycleScore(hid, pid) {
  const house = db.houses.find(x => x.id === hid);
  if (!house) return;
  if (!house.scores) house.scores = {};
  const cur = house.scores[pid] ?? RATING_DEFAULT;
  house.scores[pid] = (cur + 1) % (RATING_MAX + 1);
  backfillHouseScores(house, db.priorities);
  saveDB(); renderAll();
  if (overlayMode === 'house' && viewHouseId === hid) renderHouseOverlay(house);
}

// cycles null (unassigned) -> S -> A -> B -> C -> D -> E -> null
function cycleTier(hid) {
  const house = db.houses.find(x => x.id === hid);
  if (!house) return;
  const idx = TIERS.indexOf(house.tier);
  const nextIdx = idx + 1;
  house.tier = nextIdx < TIERS.length ? TIERS[nextIdx] : null;
  saveDB(); renderAll();
  if (overlayMode === 'house' && viewHouseId === hid) renderHouseOverlay(house);
}

function openTableView(sortCol) {
  if (sortCol) {
    if (tableSort.col === sortCol) tableSort.dir *= -1;
    else { tableSort.col = sortCol; tableSort.dir = -1; }
  }
  overlayMode = 'table';
  const prios = db.priorities;
  const houses = visibleHouses().map(h => ({
    ...h,
    _score: isHouseScored(h) ? (calcScore(h) ?? -1) : -1,
    _dispScore: displayScore(h),
    _ppsf: calcPpsf(h)
  }));

  // sort
  houses.sort((a, b) => {
    let va, vb;
    if (tableSort.col === 'score') { va = a._score; vb = b._score; }
    else if (tableSort.col === 'price') { va = Number(a.price)||0; vb = Number(b.price)||0; }
    else if (tableSort.col === 'sqft') { va = Number(a.sqft)||0; vb = Number(b.sqft)||0; }
    else if (tableSort.col === 'ppsf') { va = a._ppsf ?? -1; vb = b._ppsf ?? -1; }
    else if (tableSort.col === 'addr') { va = (a.address||'').toLowerCase(); vb = (b.address||'').toLowerCase(); }
    else if (tableSort.col === 'mls') { va = (a.mls||'').toLowerCase(); vb = (b.mls||'').toLowerCase(); }
    else { va = a._score; vb = b._score; }
    if (va < vb) return tableSort.dir;
    if (va > vb) return -tableSort.dir;
    return 0;
  });

  const arrow = (col) => tableSort.col === col ? (tableSort.dir === -1 ? ' ▼' : ' ▲') : '';

  let html = `<div class="ht-wrap"><table class="ht">`;
  html += `<thead><tr>
    <th data-col="addr">ADDRESS${arrow('addr')}</th>
    <th data-col="price">PRICE${arrow('price')}</th>
    <th data-col="sqft">SQFT${arrow('sqft')}</th>
    <th data-col="ppsf">$/SQFT${arrow('ppsf')}</th>
    <th data-col="mls">MLS#${arrow('mls')}</th>
    <th data-col="score">SCORE${arrow('score')}</th>`;
  prios.forEach(p => { html += `<th title="${escHtml(p.name)} (w=${Number(p.weight)||1})">${escHtml(p.name.length > 8 ? p.name.slice(0,8)+'…' : p.name)}</th>`; });
  html += `<th>✎</th></tr></thead><tbody>`;

  if (!houses.length) {
    html += `<tr><td colspan="${6 + prios.length + 1}" style="color:var(--dim);">No houses yet.</td></tr>`;
  }
  houses.forEach(h => {
    html += `<tr>
      <td><a href="#" style="color:var(--fg);" data-house="${h.id}">${escHtml(h.address||'—')}</a></td>
      <td>${fmtPrice(h.price)}</td>
      <td>${fmtSqft(h.sqft)}</td>
      <td>${fmtPpsf(h._ppsf)}</td>
      <td>${escHtml(h.mls||'—')}</td>
      <td style="color:var(--success);">${h._dispScore !== null ? h._dispScore : '—'}</td>`;
    prios.forEach(p => {
      const v = h.scores?.[p.id] ?? RATING_DEFAULT;
      html += `<td>${scoreLabel(v)} ${scoreLabelText(v)}</td>`;
    });
    html += `<td style="text-align:center;">${h.notes ? `<span title="${escHtml(h.notes)}" style="cursor:default;">✎</span>` : ''}</td>`;    html += `</tr>`;  });
  html += `</tbody></table></div>`;
  openOverlay('◈ HOUSE TABLE', html);
  document.querySelector('.overlay-box').classList.add('table-mode');

  // attach sort listeners after render
  setTimeout(() => {
    document.querySelectorAll('table.ht th[data-col]').forEach(th =>
      th.addEventListener('click', () => openTableView(th.dataset.col))
    );
    document.querySelectorAll('a[data-house]').forEach(a =>
      a.addEventListener('click', e => { e.preventDefault(); openHouseView(Number(a.dataset.house)); })
    );
  }, 0);
}

// ── COMMANDS ──────────────────────────────────────────────────────────────
function handleConsoleCmd(raw) {
  const lower = raw.trimStart().toLowerCase();
  const parts = raw.trim().split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const rest = raw.trim().slice(cmd.length).trim();

  if (cmd === '/help') return showHelp();
  if (cmd === '/theme') return applyTheme(parts[1] || '');
  if (cmd === '/table') return openTableView(parts[1] || '');
  if (cmd === '/tiers') return openTiersOverlay();
  if (cmd === '/add') return cmdAdd(rest);
  if (cmd === '/paste') return openPasteOverlay();
  if (cmd === '/update') return cmdUpdate(parts[1], parts[2], rest.slice((parts[1]||'').length).trim().slice((parts[2]||'').length).trim());
  if (cmd === '/delete') return cmdDelete(parts[1]);
  if (cmd === '/view') return cmdView(parts[1]);
  if (cmd === '/note') return cmdNote(parts[1], rest.slice((parts[1]||'').length).trim());
  if (cmd === '/score') return cmdScore(parts[1], parts[2], parts[3]);
  if (cmd === '/visit') return cmdVisit(parts[1], parts[2]);
  if (cmd === '/archive') return cmdArchive(parts[1], rest.slice((parts[1]||'').length).trim());
  if (cmd === '/unarchive') return cmdUnarchive(parts[1]);
  if (cmd === '/prio') return cmdPrio(rest);
  if (cmd === '/export') return cmdExport(parts[1] || 'json');
  if (cmd === '/import') return cmdImport();
  if (cmd === '/backlog') return handleBacklog(rest);

  statusMsg('Unknown command: ' + cmd + ' — /help for list');
}

function cmdAdd(rest) {
  const fields = rest.split('|').map(s => s.trim());
  addHouse({ address: fields[0], price: fields[1], sqft: fields[2], mls: fields[3], link: fields[4] });
}

function addHouse({ address, price, sqft, mls, link }) {
  const h = {
    id: nextId(db.houses),
    address: address || '',
    price: price || '',
    sqft: sqft || '',
    mls: mls || '',
    link: link || '',
    notes: '',
    scores: {},
    visits: [],
    archived: false,
    tier: null
  };
  db.houses.push(h);
  saveDB();
  renderAll();
  statusMsg(`Added house #${h.id}: ${h.address || '(no address)'}`);
  return h;
}

function archiveHouse(hid, reason) {
  const h = db.houses.find(x => x.id === hid);
  if (!h) return;
  const trimmed = (reason || '').trim();
  if (!trimmed) { statusMsg('Archiving requires a reason — usage: /archive <n> <reason>'); return; }
  h.archived = true;
  h.notes = (h.notes ? h.notes + '\n' : '') + `ARCHIVED (${new Date().toISOString().slice(0,10)}): ${trimmed}`;
  saveDB(); renderAll();
  closeOverlay();
  statusMsg(`Archived house #${h.id}`);
}

function unarchiveHouse(hid) {
  const h = db.houses.find(x => x.id === hid);
  if (!h) return;
  h.archived = false;
  h.notes = (h.notes ? h.notes + '\n' : '') + `UNARCHIVED (${new Date().toISOString().slice(0,10)})`;
  saveDB(); renderAll();
  if (overlayMode === 'house' && viewHouseId === hid) renderHouseOverlay(h);
  statusMsg(`Unarchived house #${h.id}`);
}

function cmdArchive(nStr, reason) {
  if ((nStr || '').toLowerCase() === 'list') return openArchivedListOverlay();
  const h = resolveHouseRef(nStr);
  if (!h) { statusMsg('House not found: ' + nStr); return; }
  archiveHouse(h.id, reason);
}

function cmdUnarchive(nStr) {
  const h = resolveAnyHouseById(nStr);
  if (!h) { statusMsg('House not found — use its #id from /archive list: ' + nStr); return; }
  unarchiveHouse(h.id);
}

  overlayMode = 'help';
  const archived = db.houses.filter(h => h.archived);
  const html = `<div style="white-space:normal;">` + (

        </div>`).join('')
      : `<span class="dim">No archived houses.</span>`
  ) + `</div>`;
  openOverlay('◈ ARCHIVED HOUSES', html);
  setTimeout(() => {
    document.querySelectorAll('.archived-house-link').forEach(a =>

    const inTier = houses.filter(h => (h.tier || null) === t);
    const label = t || '-';

    html += `<div style="width:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.5em;font-weight:bold;color:${color};border-right:1px solid var(--muted);background:var(--muted);">${label}</div>`;
    html += `<div class="tier-dropzone" data-tier="${t || ''}" style="flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:6px;align-content:flex-start;min-height:100px;">`;
    if (!inTier.length) {
      html += `<span class="dim" style="font-size:0.8em;align-self:center;">(none)</span>`;
    } else {
      inTier.forEach(h => {
        const s = displayScore(h);
        html += `<div class="tier-house-box" draggable="true" data-hid="${h.id}" title="${escHtml(h.address || '(no address)')}"
          style="width:100px;height:100px;border:1px solid var(--border);background:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:0.72em;line-height:1.35;padding:4px;cursor:grab;overflow:hidden;">
          <div style="font-weight:bold;">${escHtml(h.address || '(no address)')}</div>
          <div class="dim" style="margin-top:3px;">${fmtPrice(h.price)}</div>
          <div class="dim">Score: ${s !== null ? s : '—'}</div>
        </div>`;
      });
    }
    html += `</div></div>`;
  });
  html += `</div>`;
  openOverlay('◈ TIER LIST', html);
  setTimeout(() => {
    document.querySelectorAll('.tier-house-box').forEach(box => {
      box.addEventListener('click', () => openHouseView(Number(box.dataset.hid)));
      box.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', box.dataset.hid);
        e.dataTransfer.effectAllowed = 'move';
      });
    });
    document.querySelectorAll('.tier-dropzone').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zone.style.background = 'var(--dim)';
      });
      zone.addEventListener('dragleave', () => { zone.style.background = ''; });
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.style.background = '';
        const hid = Number(e.dataTransfer.getData('text/plain'));
        const house = db.houses.find(x => x.id === hid);
        if (!house) return;
        house.tier = zone.dataset.tier || null;
        saveDB(); renderAll();
        openTiersOverlay();
      });
    });
  }, 0);
}

// heuristic extraction of address/price/sqft/mls/link from pasted listing text
function parseListingText(text) {
  const result = { address: '', price: '', sqft: '', mls: '', link: '' };
  const linkMatch = text.match(/https?:\/\/[^\s)"'<>]+/);
  if (linkMatch) result.link = linkMatch[0];

  const priceMatch = text.match(/\$\s?[\d,]{3,}(?:\.\d{2})?/);
  if (priceMatch) result.price = priceMatch[0].replace(/[^\d.]/g, '');

  const sqftMatch = text.match(/([\d,]{3,6})\s*(?:sq\.?\s*ft\.?|sqft|square\s+feet)/i);
  if (sqftMatch) result.sqft = sqftMatch[1].replace(/,/g, '');

  const mlsMatch = text.match(/MLS\s*#?\s*:?\s*([A-Za-z0-9\-]{4,})/i);
  if (mlsMatch) result.mls = mlsMatch[1];

  const addrLine = text.split('\n').map(l => l.trim()).find(l => /^\d{1,6}\s+\S/.test(l) && !/^\$/.test(l));
  if (addrLine) result.address = addrLine;

  return result;
}

function openPasteOverlay() {
  overlayMode = 'help';
  const html = `
    <div style="color:var(--dim);font-size:0.85em;margin-bottom:8px;">
      Paste text copied from a listing page (Zillow, Redfin, etc.) below, then click PARSE.
      Review and edit the extracted fields before adding.
    </div>
    <textarea id="paste-input" rows="6" spellcheck="false"
      style="width:100%;background:var(--muted);border:1px solid var(--dim);color:var(--fg);font-family:var(--font);font-size:0.85em;padding:6px;outline:none;resize:vertical;"></textarea>
    <div style="margin-top:6px;">
      <button id="paste-parse-btn"
        style="background:var(--muted);border:1px solid var(--border);color:var(--fg);font-family:var(--font);font-size:0.85em;padding:2px 10px;cursor:pointer;">PARSE</button>
    </div>
    <div id="paste-fields"></div>
  `;
  openOverlay('◈ PASTE LISTING', html);
  setTimeout(() => {
    document.getElementById('paste-parse-btn').addEventListener('click', () => {
      const text = document.getElementById('paste-input').value;
      renderPasteFields(parseListingText(text));
    });
  }, 0);
}

function renderPasteFields(parsed) {
  const container = document.getElementById('paste-fields');
  if (!container) return;
  const fields = ['address', 'price', 'sqft', 'mls', 'link'];
  let html = `<div style="margin-top:10px;border-top:1px solid var(--muted);padding-top:8px;">`;
  fields.forEach(f => {
    html += `<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;">
      <label style="color:var(--dim);font-size:0.75em;min-width:7ch;text-transform:uppercase;">${f}</label>
      <input id="paste-field-${f}" type="text" value="${escHtml(parsed[f] || '')}"
        style="flex:1;background:var(--muted);border:1px solid var(--dim);color:var(--fg);font-family:var(--font);font-size:0.85em;padding:2px 6px;outline:none;">
    </div>`;
  });
  html += `<div style="margin-top:6px;">
    <button id="paste-add-btn"
      style="background:var(--muted);border:1px solid var(--border);color:var(--fg);font-family:var(--font);font-size:0.85em;padding:2px 10px;cursor:pointer;">ADD HOUSE</button>
  </div></div>`;
  container.innerHTML = html;
  document.getElementById('paste-add-btn').addEventListener('click', () => {
    const values = {};
    fields.forEach(f => { values[f] = document.getElementById(`paste-field-${f}`).value; });
    const h = addHouse(values);
    closeOverlay();
    statusMsg(`Added house #${h.id} from pasted listing`);
  });
}

function cmdUpdate(nStr, field, value) {
  const h = resolveHouseRef(nStr);
  if (!h) { statusMsg('House not found: ' + nStr); return; }
  const f = (field || '').toLowerCase();
  const allowed = ['address','price','sqft','mls','link'];
  if (!allowed.includes(f)) { statusMsg('Field must be one of: ' + allowed.join(', ')); return; }
  h[f] = value;
  saveDB();
  renderAll();
  if (overlayMode === 'house' && viewHouseId === h.id) renderHouseOverlay(h);
  statusMsg(`Updated house #${h.id} ${f}`);
}

function cmdDelete(nStr) {
  const h = resolveHouseRef(nStr);
  if (!h) { statusMsg('House not found: ' + nStr); return; }
  const realIdx = db.houses.findIndex(x => x.id === h.id);
  db.houses.splice(realIdx, 1);
  saveDB();
  renderAll();
  closeOverlay();
  statusMsg(`Deleted house #${h.id}`);
}

function cmdView(nStr) {
  const h = resolveHouseRef(nStr);
  if (!h) { statusMsg('House not found: ' + nStr); return; }
  openHouseView(h.id);
}

function cmdNote(nStr, text) {
  const h = resolveHouseRef(nStr);
  if (!h) { statusMsg('House not found: ' + nStr); return; }
  if (!text) { statusMsg('Usage: /note <n> <text>'); return; }
  h.notes = (h.notes ? h.notes + '\n' : '') + text;
  saveDB();
  if (overlayMode === 'house' && viewHouseId === h.id) renderHouseOverlay(h);
  statusMsg(`Note added to house #${h.id}`);
}

function cmdVisit(nStr, arg) {
  const h = resolveHouseRef(nStr);
  if (!h) { statusMsg('House not found: ' + nStr); return; }
  if (!Array.isArray(h.visits)) h.visits = [];
  const a = (arg || '').toLowerCase();
  if (a === 'clear') {
    h.visits = [];
    saveDB(); renderAll();
    if (overlayMode === 'house' && viewHouseId === h.id) renderHouseOverlay(h);
    statusMsg(`Cleared visits for house #${h.id}`);
    return;
  }
  if (a.startsWith('remove:')) {
    const d = arg.slice('remove:'.length);
    removeVisit(h.id, d);
    return;
  }
  addVisit(h.id, arg);
}

function cmdScore(hStr, pStr, rating) {
  if (!hStr) { statusMsg('Usage: /score <houseN> <prioN> problematic|no|partial|meets|exceeds'); return; }
  const h = resolveHouseRef(hStr);
  if (!h) { statusMsg('House not found: ' + hStr); return; }
  if ((pStr || '').toLowerCase() === 'clear') {
    h.scores = {};
    saveDB(); renderAll();
    if (overlayMode === 'house' && viewHouseId === h.id) renderHouseOverlay(h);
    statusMsg(`Cleared scores for house #${h.id}`);
    return;
  }
  const p = db.priorities.find(x => x.id === Number(pStr)) || db.priorities[Number(pStr) - 1];
  if (!p) { statusMsg('Priority not found: ' + pStr); return; }
  const rLower = (rating || '').toLowerCase();
  let val;
  if (rLower === 'exceeds' || rLower === 'e' || rLower === '4') val = 4;
  else if (rLower === 'meets' || rLower === 'm' || rLower === '3') val = 3;
  else if (rLower === 'partial' || rLower === 'p' || rLower === '2') val = 2;
  else if (rLower === 'no' || rLower === 'n' || rLower === '1') val = 1;
  else if (rLower === 'problematic' || rLower === 'prob' || rLower === '0') val = 0;
  else { statusMsg('Rating must be: problematic, no, partial, meets, or exceeds'); return; }
  if (!h.scores) h.scores = {};
  h.scores[p.id] = val;
  backfillHouseScores(h, db.priorities);
  saveDB(); renderAll();
  if (overlayMode === 'house' && viewHouseId === h.id) renderHouseOverlay(h);
  if (overlayMode === 'table') openTableView();
  statusMsg(`Scored house #${h.id} on "${p.name}": ${scoreLabelText(val)}`);
}

function cmdPrio(rest) {
  const parts = rest.split(/\s+/);
  const sub = (parts[0] || '').toLowerCase();
  if (sub === 'add') {
    const weight = Number(parts[parts.length - 1]);
    const hasWeight = !isNaN(weight) && weight > 0 && parts.length > 2;
    const nameParts = hasWeight ? parts.slice(1, -1) : parts.slice(1);
    const name = nameParts.join(' ');
    if (!name) { statusMsg('Usage: /prio add name [weight]'); return; }
    const p = { id: nextId(db.priorities), name, weight: hasWeight ? weight : 1 };
    db.priorities.push(p);
    saveDB(); renderAll();
    statusMsg(`Priority #${p.id} added: ${name} (w=${p.weight})`);
  } else if (sub === 'weight') {
    const p = db.priorities.find(x => x.id === Number(parts[1])) || db.priorities[Number(parts[1]) - 1];
    if (!p) { statusMsg('Priority not found: ' + parts[1]); return; }
    const w = Number(parts[2]);
    if (isNaN(w) || w <= 0) { statusMsg('Weight must be a positive number'); return; }
    p.weight = w;
    saveDB(); renderAll();
    statusMsg(`Updated priority #${p.id} weight to ${w}`);
  } else if (sub === 'delete') {
    const idx = db.priorities.findIndex(x => x.id === Number(parts[1]));
    const idxByPos = Number(parts[1]) - 1;
    const ri = idx >= 0 ? idx : (idxByPos >= 0 && idxByPos < db.priorities.length ? idxByPos : -1);
    if (ri < 0) { statusMsg('Priority not found: ' + parts[1]); return; }
    const removed = db.priorities.splice(ri, 1)[0];
    // remove scores for this priority from all houses
    db.houses.forEach(h => { if (h.scores) delete h.scores[removed.id]; });
    saveDB(); renderAll();
    statusMsg(`Deleted priority #${removed.id}: ${removed.name}`);
  } else if (sub === 'list') {
    if (!db.priorities.length) { statusMsg('No priorities yet.'); return; }
    openPrioListOverlay();
  } else {
    statusMsg('Usage: /prio add|weight|delete|list');
  }
}

function openPrioListOverlay() {
  overlayMode = 'prio';
  const html = `<div style="white-space:normal;">` +
    `<div style="color:var(--dim);font-size:0.8em;margin-bottom:6px;">Click ▲ / ▼ to adjust weight.</div>` +
    db.priorities.map((p, i) => `
      <div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--muted);">
        <span style="color:var(--dim);width:3ch;display:inline-block;">${i+1}.</span>
        <span style="flex:1;">${escHtml(p.name)}</span>
        <span style="color:var(--dim);font-size:0.8em;">weight</span>
        <span class="prio-w-dec" data-pid="${p.id}" style="cursor:pointer;color:var(--accent);padding:0 4px;user-select:none;">▼</span>
        <span style="min-width:2ch;text-align:center;">${Number(p.weight)||1}</span>
        <span class="prio-w-inc" data-pid="${p.id}" style="cursor:pointer;color:var(--accent);padding:0 4px;user-select:none;">▲</span>
      </div>`
    ).join('') + `</div>`;
  openOverlay('◈ PRIORITIES', html);
  setTimeout(() => {
    document.querySelectorAll('.prio-w-inc').forEach(el => el.addEventListener('click', () => adjustPrioWeight(Number(el.dataset.pid), 1)));
    document.querySelectorAll('.prio-w-dec').forEach(el => el.addEventListener('click', () => adjustPrioWeight(Number(el.dataset.pid), -1)));
  }, 0);
}

function adjustPrioWeight(pid, delta) {
  const p = db.priorities.find(x => x.id === pid);
  if (!p) return;
  const cur = Number(p.weight) || 1;
  p.weight = Math.max(1, cur + delta);
  saveDB(); renderAll();
  if (overlayMode === 'prio') openPrioListOverlay();
}

function cmdExport(fmt) {
  const slug = EXPORT_SLUG + '-' + new Date().toISOString().slice(0,10);
  if (fmt === 'txt') {
    const lines = ['HOUSE FINDER EXPORT', '===================', ''];
    lines.push('PRIORITIES:');
    db.priorities.forEach((p,i) => lines.push(`  ${i+1}. ${p.name} (weight=${Number(p.weight)||1})`));
    lines.push('');
    lines.push('HOUSES:');
    db.houses.forEach(h => {
      const s = displayScore(h);
      lines.push(`  #${h.id} ${h.address||'(no address)'}  Price:${fmtPrice(h.price)}  Sqft:${fmtSqft(h.sqft)}  MLS:${h.mls||'—'}  Score:${s !== null ? s : '—'}`);
      if (h.link) lines.push(`    Link: ${h.link}`);
      db.priorities.forEach(p => {
        const v = h.scores?.[p.id] ?? RATING_DEFAULT;
        lines.push(`    ${p.name}: ${scoreLabelText(v)}`);
      });
      if (h.notes) lines.push(`    Notes: ${h.notes}`);
    });
    downloadBlob(lines.join('\n'), slug + '.txt', 'text/plain');
  } else {
    downloadBlob(JSON.stringify(db, null, 2), slug + '.json', 'application/json');
  }
  statusMsg('Exported: ' + slug);
}

function cmdImport() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.addEventListener('change', () => {
    const f = inp.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!Array.isArray(parsed.houses) || !Array.isArray(parsed.priorities))
          throw new Error('Invalid format');
        db = parsed;
        db.backlog = Array.isArray(db.backlog) ? db.backlog : [];
        db.backlogArchive = Array.isArray(db.backlogArchive) ? db.backlogArchive : [];
        saveDB(); renderAll();
        statusMsg('Imported: ' + f.name);
      } catch (err) { statusMsg('Import error: ' + err.message); }
    };
    reader.readAsText(f);
  });
  inp.click();
}

// ── BACKLOG ────────────────────────────────────────────────────────────────
function handleBacklog(arg) {
  const parts = (arg || '').trim().split(/\s+/);
  const sub = parts[0].toLowerCase();

  if (sub === 'list' || sub === '') {
    if (!arg.trim() || sub === 'list') {
      overlayMode = 'help';
      const title = document.getElementById('help-title');
      const body = document.getElementById('help-body');
      title.textContent = 'BACKLOG';
      body.innerHTML = (!db.backlog.length ? '<span class="dim">Backlog is empty.</span>' :
        db.backlog.map((b, i) => {
          const bracket = b.done ? '<span style="color:var(--success);">[x]</span>' : '<span style="color:var(--dim);">[ ]</span>';
          return `<div style="padding:2px 0"><span data-backlog-idx="${i}" style="cursor:pointer;user-select:none;color:var(--accent)">${bracket}</span> ${i + 1}. ${escHtml(b.text)}</div>`;
        }).join('')) + '<div style="margin-top:8px;border-top:1px solid var(--muted);padding-top:6px"><span class="backlog-copy-btn" style="cursor:pointer;color:var(--dim);font-size:0.82em;">[C] COPY TO CLIPBOARD</span></div>';
      document.getElementById('help-overlay').classList.add('visible');
      body.querySelectorAll('[data-backlog-idx]').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.backlogIdx, 10);
          db.backlog[idx].done = !db.backlog[idx].done;
          saveDB(); handleBacklog('list');
        });
      });
      const copyBtn = body.querySelector('.backlog-copy-btn');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          const txt = '# BACKLOG — ' + new Date().toISOString().slice(0,10) + '\n\n'
            + db.backlog.map(b => `- ${b.done ? '[x]' : '[ ]'} ${b.text}`).join('\n') + '\n';
          navigator.clipboard.writeText(txt).then(() => statusMsg('Backlog copied to clipboard.'));
        });
      }
      return;
    }
  }
  if (sub === 'done') {
    const n = parseInt(parts[1], 10);
    if (!db.backlog.length) { statusMsg('Backlog is empty.'); return; }
    const item = db.backlog[n - 1];
    if (!item) { statusMsg(`No backlog item #${n}.`); return; }
    item.done = !item.done;
    saveDB(); handleBacklog('list');
    statusMsg(`Backlog #${n} marked ${item.done ? 'done' : 'open'}.`);
    return;
  }
  if (sub === 'delete') {
    const n = parseInt(parts[1], 10);
    const item = db.backlog[n - 1];
    if (!item) { statusMsg(`No backlog item #${n}.`); return; }
    db.backlog.splice(n - 1, 1);
    saveDB(); statusMsg(`Deleted backlog #${n}.`);
    return;
  }
  if (sub === 'archive') {
    if ((parts[1] || '').toLowerCase() === 'list') {
      if (!db.backlogArchive.length) { statusMsg('No archived batches.'); return; }
      overlayMode = 'help';
      openOverlay('BACKLOG ARCHIVE', '<pre style="white-space:pre;">' +
        db.backlogArchive.flatMap(batch => [
          `── ${batch.date} ──`,
          ...batch.items.map(b => `  ${b.done ? '[x]' : '[ ]'} ${b.text}`)
        ]).join('\n') + '</pre>');
      return;
    }
    const done = db.backlog.filter(b => b.done);
    if (!done.length) { statusMsg('No done items to archive.'); return; }
    db.backlog = db.backlog.filter(b => !b.done);
    db.backlogArchive.push({ date: new Date().toISOString().slice(0,10), items: done });
    saveDB(); statusMsg(`Archived ${done.length} done item${done.length === 1 ? '' : 's'}.`);
    return;
  }
  if (sub === 'export') {
    if (!db.backlog.length) { statusMsg('Backlog is empty.'); return; }
    const dt = new Date().toISOString().slice(0,10);
    const txt = '# BACKLOG — ' + dt + '\n\n' + db.backlog.map(b => `- ${b.done ? '[x]' : '[ ]'} ${b.text}`).join('\n') + '\n';
    downloadBlob(txt, `backlog-${dt}.txt`, 'text/plain');
    statusMsg(`Exported ${db.backlog.length} backlog item${db.backlog.length === 1 ? '' : 's'}.`);
    return;
  }
  // default: add item
  if (!arg.trim()) { statusMsg('Usage: /backlog [text] | list | done N | delete N | archive | export'); return; }
  db.backlog.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), text: arg.trim(), done: false, createdAt: new Date().toISOString() });
  saveDB(); statusMsg(`Backlog item added: ${arg.trim()}`);
}

// ── INPUT ─────────────────────────────────────────────────────────────────
const input = document.getElementById('console-input');
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const cmd = input.value.trim();
    input.value = '';
    if (cmd) handleConsoleCmd(cmd);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeOverlay();
});
document.getElementById('help-close').addEventListener('click', closeOverlay);

// ── BOOT ──────────────────────────────────────────────────────────────────
if (db.theme) applyTheme(db.theme);
renderAll();
