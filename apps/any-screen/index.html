<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANY SCREEN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0e;
      --surface: #0f1116;
      --surface2: #161a22;
      --border: #1e2330;
      --border-bright: #2e3650;
      --accent: #4af0c8;
      --accent2: #8bc8ff;
      --accent3: #f05c7b;
      --text: #e8ecf5;
      --text-dim: #5a6380;
      --text-dimmer: #2e3450;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(74,240,200,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,240,200,0.012) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    #topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 8px 12px;
      flex-wrap: wrap;
    }
    .logo { font-family: 'Syne', sans-serif; font-size: 14px; letter-spacing: 0.12em; color: var(--accent); }
    .meta { color: var(--text-dim); font-size: 10px; letter-spacing: 0.08em; }
    .btn, select, input {
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      color: var(--text);
      font-family: inherit;
      font-size: 10px;
      border-radius: 4px;
      padding: 4px 7px;
    }
    .btn { text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; }
    .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn.danger:hover:not(:disabled) { border-color: var(--accent3); color: var(--accent3); }
    .field { display: flex; align-items: center; gap: 4px; font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .field input { width: 66px; }
    .field input[type="checkbox"] { width: auto; padding: 0; margin: 0; flex: 0 0 auto; }
    .divider { width: 1px; height: 24px; background: var(--border); }

    #layout {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      transition: grid-template-columns 0.15s ease;
    }
    #layout.left-collapsed {
      grid-template-columns: 0px 1fr 320px;
    }
    #layout.left-collapsed .panel:not(.right) {
      overflow: hidden;
      padding: 0;
      border: none;
      min-width: 0;
    }
    .panel {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: auto;
      padding: 10px;
    }
    .panel.right {
      border-right: none;
      border-left: 1px solid var(--border);
    }
    .sec { margin-bottom: 14px; }
    .sec h3 {
      color: var(--accent2);
      font-size: 10px;
      margin-bottom: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .region-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow: auto;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: 4px;
      padding: 6px;
      margin-bottom: 8px;
    }
    .region-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }
    .region-item-name {
      font-size: 10px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .region-empty {
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.06em;
    }
    .region-color {
      width: 28px;
      height: 20px;
      padding: 0;
      border: 1px solid var(--border-bright);
      border-radius: 3px;
      background: transparent;
      cursor: pointer;
    }
    .region-delete {
      border: 1px solid transparent;
      background: transparent;
      color: var(--accent3);
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      padding: 0 2px;
    }
    .region-delete:hover {
      border-color: var(--accent3);
      border-radius: 3px;
    }
    .row { display: flex; gap: 6px; margin-bottom: 6px; }
    .row > * { flex: 1; }
    .panel:not(.right) .row input[type="number"] {
      width: calc(100% - 30px);
      min-width: 0;
    }
    .panel input[type="number"]::-webkit-inner-spin-button,
    .panel input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      color: var(--text);
      font-family: inherit;
      font-size: 10px;
      padding: 8px;
      border-radius: 4px;
    }
    #generator-hint {
      min-height: 0;
      height: auto;
      resize: vertical;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #canvas-wrap {
      position: relative;
      overflow: auto;
      background: #090b10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas-shell {
      position: relative;
      margin: 14px;
      background: #0f131c;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    #design {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border-bright);
      background: #0a1117;
      display: block;
    }
    .screen-outline { fill: none; stroke: rgba(139,200,255,0.25); stroke-width: 1; }
    .region-box { fill: rgba(139,200,255,0.05); stroke: rgba(139,200,255,0.85); stroke-dasharray: 8 6; stroke-width: 2; }
    .region-label { fill: rgba(139,200,255,0.95); font-size: 36px; font-family: 'JetBrains Mono', monospace; }
    .primitive { pointer-events: auto; cursor: pointer; }
    .placeholder { fill: rgba(74,240,200,0.09); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 12 8; }
    .placeholder-text { fill: var(--accent); font-size: 32px; font-family: 'JetBrains Mono', monospace; }
    .selected { filter: drop-shadow(0 0 8px rgba(74,240,200,0.65)); }
    #status { color: var(--text-dim); font-size: 10px; letter-spacing: 0.06em; margin-top: 8px; }
    .export-options {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .export-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .export-option input[type="checkbox"] {
      width: auto;
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
    }

    @media (max-width: 1200px) {
      #layout { grid-template-columns: 260px 1fr; }
      .panel.right { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <button class="btn" id="toggle-left" title="Toggle panel">&#9776;</button>
    <span class="logo">ANY SCREEN</span>
    <span class="meta">wall + template designer</span>
    <div class="divider"></div>
    <button class="btn" id="toggle-preview" title="Toggle preview mode">Preview</button>
    <div class="divider"></div>
    <label class="field"><input type="checkbox" id="show-regions" checked> Regions</label>
    <div class="divider"></div>
    <label class="field">Rows <input id="wall-rows" type="number" min="1" value="2"></label>
    <label class="field">Cols <input id="wall-cols" type="number" min="1" value="4"></label>
    <button class="btn" id="apply-wall">Apply Wall</button>
    <button class="btn danger" id="clear-wall">Clear Wall</button>
    <div class="divider"></div>
    <label class="field">Preset
      <select id="wall-preset-list">
        <option value="">No presets saved</option>
      </select>
    </label>
    <button class="btn" id="save-wall-preset">Save Preset</button>
    <button class="btn" id="load-wall-preset">Load Preset</button>
    <button class="btn danger" id="delete-wall-preset">Delete Preset</button>
    <span class="meta" id="wall-meta"></span>
  </div>

  <div id="layout" class="left-collapsed">
    <aside class="panel">
      <div class="sec">
        <h3>Add Region</h3>
        <div class="row" style="gap:6px;align-items:center">
          <input id="region-name" placeholder="Name (e.g. LEFT)" style="flex:1">
          <input id="region-color" type="color" value="#8bc8ff" title="Region color" style="width:28px;height:28px;padding:2px;border-radius:4px;cursor:pointer;flex-shrink:0">
        </div>
        <div class="row" style="gap:4px">
          <label style="display:flex;flex-direction:column;flex:1;font-size:10px;gap:2px">Row<input id="region-row" type="number" min="1" value="1" style="-moz-appearance:textfield;appearance:textfield;width:100%"></label>
          <label style="display:flex;flex-direction:column;flex:1;font-size:10px;gap:2px">Col<input id="region-col" type="number" min="1" value="1" style="-moz-appearance:textfield;appearance:textfield;width:100%"></label>
          <label style="display:flex;flex-direction:column;flex:1;font-size:10px;gap:2px">Rows<input id="region-rows" type="number" min="1" value="1" style="-moz-appearance:textfield;appearance:textfield;width:100%"></label>
          <label style="display:flex;flex-direction:column;flex:1;font-size:10px;gap:2px">Cols<input id="region-cols" type="number" min="1" value="1" style="-moz-appearance:textfield;appearance:textfield;width:100%"></label>
        </div>
        <button class="btn" id="add-region">Add Region</button>
        <h3 style="margin-top:10px">Regions</h3>
        <div id="region-list" class="region-list"></div>
      </div>

      <div class="sec">
        <h3>Add Primitive</h3>
        <div class="row"><select id="primitive-type">
          <option value="rectangle">Rectangle</option>
          <option value="round-rectangle">Round Rectangle</option>
          <option value="line">Line</option>
          <option value="ellipse">Ellipse</option>
          <option value="textbox">Textbox</option>
        </select></div>
        <div class="row">
          <input id="item-x" type="number" value="120" placeholder="X">
          <input id="item-y" type="number" value="120" placeholder="Y">
        </div>
        <div class="row">
          <input id="item-w" type="number" value="960" placeholder="W">
          <input id="item-h" type="number" value="540" placeholder="H">
        </div>
        <div class="row"><input id="item-text" placeholder="Text / label"></div>
        <div class="row">
          <button class="btn" id="add-primitive">Add Primitive</button>
          <button class="btn" id="add-placeholder" title="Add a placeholder box at the X/Y/W/H position set above">Add Placeholder</button>
        </div>
      </div>

      <div class="sec">
        <h3>Media + Sources</h3>
        <div class="row"><input id="asset-file" type="file" accept="image/*,.svg" title="Load image/SVG into selected placeholder" disabled></div>
        <div class="row"><input id="asset-folder" type="file" webkitdirectory accept="image/*,.svg" title="Auto-assign images from a folder to placeholders in order" style="display:none"><button class="btn" id="asset-folder-btn" onclick="document.getElementById('asset-folder').click()">Assign folder to placeholders</button></div>
        <div class="row" style="gap:4px;align-items:center">
          <input id="share-name" placeholder="Share source name" style="flex:1" title="Name of the screen-share source to assign to the selected placeholder" disabled>
          <button class="btn" id="assign-share" title="Tag the selected placeholder with this share source name (used in export)" disabled>Assign</button>
        </div>
      </div>

      <div class="sec">
        <h3>Selection</h3>
        <button class="btn danger" id="delete-selected">Delete Selected</button>
        <div id="status">No selection</div>
      </div>
    </aside>

    <main id="canvas-wrap">
      <div id="canvas-shell">
        <svg id="design" viewBox="0 0 7680 2160" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </main>

    <aside class="panel right">
      <div class="sec">
        <h3>Templates</h3>
        <div class="row"><input id="template-name" placeholder="Template name"></div>
        <div class="row">
          <button class="btn" id="save-template">Save</button>
          <button class="btn" id="apply-template">Apply</button>
          <button class="btn danger" id="delete-template">Delete</button>
        </div>
        <div class="row"><select id="template-list"></select></div>
      </div>

      <div class="sec">
        <h3>Generators</h3>
        <div class="row"><select id="generator">
          <option value="border-grid">Border + Grid</option>
          <option value="focus-detail">Focus + Detail</option>
          <option value="mosaic">Mosaic</option>
          <option value="random">Random</option>
          <option value="pip">Picture-in-Picture</option>
          <option value="spotlight">Spotlight</option>
          <option value="staggered">Staggered</option>
        </select></div>
        <div class="row"><textarea id="generator-hint" rows="3" placeholder="title=TITLE, inset=20, gap=F"></textarea></div>
        <button class="btn" id="run-generator">Generate Layout</button>
      </div>

      <div class="sec">
        <h3>Export Commands</h3>
        <div class="row export-options">
          <label class="export-option"><input id="include-wall-config" type="checkbox"> Include wall config</label>
          <label class="export-option"><input id="include-placeholders" type="checkbox" checked> Include placeholders</label>
        </div>
        <div class="row"><textarea id="export-prefix" rows="3" placeholder="Optional instructions to prepend to export output"></textarea></div>
        <button class="btn" id="export-cmds">Refresh Export</button>
        <textarea id="export-output" spellcheck="false"></textarea>
      </div>
    </aside>
  </div>

  <script>
    const SCREEN_W = 1920;
    const SCREEN_H = 1080;
    const IMAGE_FIT = 'zoom'; // 'zoom' = center-crop (xMidYMid slice), 'fit' = scale to fit (xMidYMid meet)
    const STORAGE_KEY = 'any_screen_templates_v1';
    const WALL_PRESETS_KEY = 'any_screen_wall_presets_v1';
    const EXPORT_PREFIX_KEY = 'any_screen_export_prefix_v1';
    const DEFAULT_WALL_PRESET_NAME = 'Split-4x3';

    const state = {
      wall: { rows: 2, cols: 4 },
      wallName: 'Wall',
      regions: [],
      items: [],
      selectedId: null,
      previewMode: false,
      templates: {},
      wallPresets: {}
    };

    const $ = (id) => document.getElementById(id);
    const svg = $('design');

    function nextId(prefix) {
      return `${prefix}_${Math.random().toString(36).slice(2, 9)}`;
    }

    function clampZ(value) {
      const n = Math.round(clampNum(value, 1));
      return Math.max(1, Math.min(20, n));
    }

    function nextZ(base = 0) {
      if (!state.items.length) return base || 1;
      const maxZ = state.items.reduce((max, item) => Math.max(max, clampZ(item.z)), 0);
      return clampZ(Math.max(base || 1, maxZ + 1));
    }

    function wallWidth() { return state.wall.cols * SCREEN_W; }
    function wallHeight() { return state.wall.rows * SCREEN_H; }

    function updateWallMeta() {
      $('wall-meta').textContent = `${state.wall.rows}x${state.wall.cols} screens · ${wallWidth()}x${wallHeight()} px`;
    }

    function fitCanvasShell() {
      const wrap = $('canvas-wrap');
      const shell = $('canvas-shell');
      const availableW = Math.max(220, wrap.clientWidth - 28);
      const availableH = Math.max(180, wrap.clientHeight - 28);
      const aspect = wallWidth() / wallHeight();

      let targetW = availableW;
      let targetH = targetW / aspect;
      if (targetH > availableH) {
        targetH = availableH;
        targetW = targetH * aspect;
      }

      shell.style.width = `${Math.max(220, Math.floor(targetW))}px`;
      shell.style.height = `${Math.max(180, Math.floor(targetH))}px`;
    }

    function parseGeneratorHint(text) {
      const result = {};
      (text || '').split(',').forEach((entry) => {
        const part = entry.trim();
        if (!part) return;
        const eq = part.indexOf('=');
        if (eq < 0) return;
        const key = part.slice(0, eq).trim();
        const raw = part.slice(eq + 1).trim();
        if (!key) return;
        if (/^-?\d+$/.test(raw)) {
          result[key] = parseInt(raw, 10);
          return;
        }
        if (/^(T|F)$/i.test(raw)) {
          result[key] = raw.toUpperCase() === 'T';
          return;
        }
        result[key] = raw;
      });
      return result;
    }

    function getGeneratorDefaultHint(type) {
      if (type === 'border-grid') return 'title=TITLE, color=#4af0c8, titleSize=42, inset=30, width=15, gap=F';
      if (type === 'focus-detail') {
        const d = Math.min(state.wall.rows || 1, state.wall.cols || 1);
        return `title=FOCUS, focusRows=${d}, focusCols=${d}, detailCount=3, inset=40, split=V`;
      }
      if (type === 'mosaic') return 'inset=60';
      if (type === 'pip') return `focalCount=1, pipCount=3, inset=40, pipSize=0.25, corner=bot-right`;
      if (type === 'spotlight') return 'detailCount=4, inset=40, split=V';
      if (type === 'random') {
        const wallCount = (state.wall.rows || 2) * (state.wall.cols || 4);
        return `count=${Math.ceil(wallCount / 3)}, inset=40, subdivide=F, fill=F`;
      }
      if (type === 'staggered') {
        const wallCols = state.wall.cols || 4;
        const wallCount = (state.wall.rows || 2) * wallCols;
        return `title=STACK, count=${wallCount}, cols=${wallCols}, inset=100, offset=130`;
      }
      return '';
    }

    function updateGeneratorHint() {
      const type = $('generator').value;
      $('generator-hint').value = getGeneratorDefaultHint(type);
    }

    function itemBounds(item) {
      if (item.type === 'line') {
        const x1 = item.x;
        const y1 = item.y;
        const x2 = item.x + item.w;
        const y2 = item.y + item.h;
        return { minX: Math.min(x1, x2), minY: Math.min(y1, y2), maxX: Math.max(x1, x2), maxY: Math.max(y1, y2) };
      }
      if (item.type === 'ellipse') {
        const rx = Math.abs(item.w) / 2;
        const ry = Math.abs(item.h) / 2;
        const cx = item.x + item.w / 2;
        const cy = item.y + item.h / 2;
        return { minX: cx - rx, minY: cy - ry, maxX: cx + rx, maxY: cy + ry };
      }
      return {
        minX: Math.min(item.x, item.x + (item.w || 0)),
        minY: Math.min(item.y, item.y + (item.h || 0)),
        maxX: Math.max(item.x, item.x + (item.w || 0)),
        maxY: Math.max(item.y, item.y + (item.h || 0))
      };
    }

    function applySceneViewBox() {
      let minX = 0;
      let minY = 0;
      let maxX = wallWidth();
      let maxY = wallHeight();

      state.items.forEach((item) => {
        const b = itemBounds(item);
        minX = Math.min(minX, b.minX);
        minY = Math.min(minY, b.minY);
        maxX = Math.max(maxX, b.maxX);
        maxY = Math.max(maxY, b.maxY);
      });

      const pad = 16;
      const x = Math.floor(minX - pad);
      const y = Math.floor(minY - pad);
      const w = Math.max(100, Math.ceil(maxX - minX + pad * 2));
      const h = Math.max(100, Math.ceil(maxY - minY + pad * 2));
      svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
    }

    function clampNum(value, fallback = 0) {
      const num = Number(value);
      return Number.isFinite(num) ? num : fallback;
    }

    function parseFormNum(id, fallback = 0) {
      return clampNum($(id).value, fallback);
    }

    function hexToRgba(hex, alpha = 1) {
      const raw = (hex || '').toString().trim();
      const cleaned = raw.startsWith('#') ? raw.slice(1) : raw;
      let full = cleaned;
      if (/^[0-9a-fA-F]{3}$/.test(cleaned)) {
        full = cleaned.split('').map((ch) => ch + ch).join('');
      }
      if (!/^[0-9a-fA-F]{6}$/.test(full)) {
        return `rgba(139,200,255,${alpha})`;
      }
      const r = parseInt(full.slice(0, 2), 16);
      const g = parseInt(full.slice(2, 4), 16);
      const b = parseInt(full.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function clearSvg() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
    }

    function renderGrid() {
      for (let r = 0; r < state.wall.rows; r++) {
        for (let c = 0; c < state.wall.cols; c++) {
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', c * SCREEN_W);
          rect.setAttribute('y', r * SCREEN_H);
          rect.setAttribute('width', SCREEN_W);
          rect.setAttribute('height', SCREEN_H);
          rect.setAttribute('class', 'screen-outline');
          svg.appendChild(rect);

          const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          label.setAttribute('x', c * SCREEN_W + 24);
          label.setAttribute('y', r * SCREEN_H + 42);
          label.setAttribute('fill', 'rgba(232,236,245,0.30)');
          label.setAttribute('font-size', '32');
          label.textContent = `(${r + 1},${c + 1})`;
          svg.appendChild(label);
        }
      }
    }

    function withinWall(x, y, w = 0, h = 0) {
      return x >= 0 && y >= 0 && x + w <= wallWidth() && y + h <= wallHeight();
    }

    function addRegion() {
      const name = $('region-name').value.trim() || `REGION_${state.regions.length + 1}`;
      const row = Math.max(1, parseFormNum('region-row', 1));
      const col = Math.max(1, parseFormNum('region-col', 1));
      const rows = Math.max(1, parseFormNum('region-rows', 1));
      const cols = Math.max(1, parseFormNum('region-cols', 1));
      const color = $('region-color').value || '#8bc8ff';
      if (row + rows - 1 > state.wall.rows || col + cols - 1 > state.wall.cols) {
        setStatus('Region exceeds wall bounds');
        return;
      }
      state.regions.push({ name, row, col, rows, cols, color });
      setStatus(`Region ${name} added`);
      render();
    }

    function addPrimitive() {
      const type = $('primitive-type').value;
      const x = parseFormNum('item-x', 0);
      const y = parseFormNum('item-y', 0);
      const w = parseFormNum('item-w', 300);
      const h = parseFormNum('item-h', 180);
      const text = $('item-text').value.trim();
      if (!withinWall(x, y, Math.max(0, w), Math.max(0, h))) {
        setStatus('Primitive exceeds wall bounds');
        return;
      }
      state.items.push({ id: nextId('it'), type, x, y, w, h, text, stroke: '#8bc8ff', fill: 'none', z: nextZ() });
      setStatus(`${type} added`);
      render();
    }

    function addPlaceholder() {
      const x = parseFormNum('item-x', 0);
      const y = parseFormNum('item-y', 0);
      const w = parseFormNum('item-w', SCREEN_W);
      const h = parseFormNum('item-h', SCREEN_H);
      if (!withinWall(x, y, w, h)) {
        setStatus('Placeholder exceeds wall bounds');
        return;
      }
      state.items.push({ id: nextId('ph'), type: 'placeholder', x, y, w, h, text: `SHARE_${state.items.filter(i => i.type === 'placeholder').length + 1}`, share: '', z: nextZ() });
      setStatus('Placeholder added');

    function assignShareToSelection() {
      const item = state.items.find(i => i.id === state.selectedId && i.type === 'placeholder');
      if (!item) {
        setStatus('Select a placeholder first');
        return;
      }
      const name = $('share-name').value.trim();
      if (!name) {
        setStatus('Enter a share source name');
        return;
      }
      item.share = name;
      setStatus(`Share assigned: ${name}`);
      render();
    }

    function assignFolderToPlaceholders(files) {
      const images = Array.from(files)
        .filter(f => f.type.startsWith('image/') || f.name.toLowerCase().endsWith('.svg'))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      const placeholders = state.items
        .filter(i => i.type === 'placeholder')
        .sort((a, b) => a.y - b.y || a.x - b.x);
      if (!placeholders.length) { setStatus('No placeholders on canvas'); return; }
      if (!images.length) { setStatus('No images found in folder'); return; }
      let count = 0;
      const load = (idx) => {
        if (idx >= images.length || idx >= placeholders.length) {
          setStatus(`${count} image${count !== 1 ? 's' : ''} assigned to placeholders`);
          render();
          return;
        }
        const ph = placeholders[idx];
        const file = images[idx];
        const reader = new FileReader();
        reader.onload = () => {
          const isSvg = file.type === 'image/svg+xml' || file.name.toLowerCase().endsWith('.svg');
          state.items.push({ id: nextId('asset'), type: isSvg ? 'svg' : 'image', x: ph.x, y: ph.y, w: ph.w, h: ph.h, src: reader.result, label: file.name, z: ph.z + 1 });
          count++;
          load(idx + 1);
        };
        reader.readAsDataURL(file);
      };
      load(0);
    }

    function readAsset(file) {
      if (!file) return;
      const placeholder = state.items.find(i => i.id === state.selectedId && i.type === 'placeholder');
      if (!placeholder) { setStatus('Select a placeholder first'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const url = reader.result;
        const isSvg = file.type === 'image/svg+xml' || file.name.toLowerCase().endsWith('.svg');
        state.items.push({
          id: nextId('asset'),
          type: isSvg ? 'svg' : 'image',
          x: placeholder.x,
          y: placeholder.y,
          w: placeholder.w,
          h: placeholder.h,
          src: url,
          label: file.name,
          z: placeholder.z + 1
        });
        setStatus(`${isSvg ? 'SVG' : 'Image'} added`);
        render();
      };
      reader.readAsDataURL(file);
    }

    function drawRegion(region) {
      const x = (region.col - 1) * SCREEN_W;
      const y = (region.row - 1) * SCREEN_H;
      const w = region.cols * SCREEN_W;
      const h = region.rows * SCREEN_H;
      const color = region.color || '#8bc8ff';
      const box = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      box.setAttribute('x', x);
      box.setAttribute('y', y);
      box.setAttribute('width', w);
      box.setAttribute('height', h);
      box.setAttribute('fill', hexToRgba(color, 0.07));
      box.setAttribute('stroke', hexToRgba(color, 0.92));
      box.setAttribute('stroke-dasharray', '8 6');
      box.setAttribute('stroke-width', '2');
      svg.appendChild(box);
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', x + 24);
      label.setAttribute('y', y + 46);
      label.setAttribute('fill', hexToRgba(color, 0.98));
      label.setAttribute('font-size', '36');
      label.setAttribute('font-family', 'JetBrains Mono, monospace');
      label.textContent = region.name;
      svg.appendChild(label);
    }

    function renderRegionList() {
      const list = $('region-list');

        const empty = document.createElement('div');
        empty.className = 'region-empty';
        empty.textContent = 'No regions yet';

      state.regions.forEach((region, index) => {

        color.value = region.color || '#8bc8ff';
        color.title = `Set color for ${region.name}`;
        color.addEventListener('input', () => {
          state.regions[index].color = color.value;
          setStatus(`Region color updated: ${region.name}`);
          render();
        });

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'region-delete';
        remove.textContent = '[x]';

    function selectable(el, item) {
      el.classList.add('primitive');
      if (state.selectedId === item.id) el.classList.add('selected');
      el.dataset.id = item.id;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        state.selectedId = item.id;
        setStatus('Selected');

      return el;
    }

    function drawItem(item) {
      const ns = 'http://www.w3.org/2000/svg';
      let el;
      if (item.type === 'rectangle') {
        el = document.createElementNS(ns, 'rect');
        el.setAttribute('x', item.x); el.setAttribute('y', item.y);
        el.setAttribute('width', item.w); el.setAttribute('height', item.h);
        el.setAttribute('fill', item.fill || 'none'); el.setAttribute('stroke', item.stroke || '#8bc8ff'); el.setAttribute('stroke-width', item.strokeWidth || '8');
        svg.appendChild(selectable(el, item));
      } else if (item.type === 'round-rectangle') {
        el = document.createElementNS(ns, 'rect');
        el.setAttribute('x', item.x); el.setAttribute('y', item.y);
        el.setAttribute('width', item.w); el.setAttribute('height', item.h);
        el.setAttribute('rx', Math.min(item.w, item.h) * 0.12); el.setAttribute('ry', Math.min(item.w, item.h) * 0.12);
        el.setAttribute('fill', item.fill || 'none'); el.setAttribute('stroke', item.stroke || '#8bc8ff'); el.setAttribute('stroke-width', item.strokeWidth || '8');
        svg.appendChild(selectable(el, item));
      } else if (item.type === 'line') {
        el = document.createElementNS(ns, 'line');
        el.setAttribute('x1', item.x); el.setAttribute('y1', item.y);
        el.setAttribute('x2', item.x + item.w); el.setAttribute('y2', item.y + item.h);
        el.setAttribute('stroke', item.stroke || '#8bc8ff'); el.setAttribute('stroke-width', item.strokeWidth || '10');
        svg.appendChild(selectable(el, item));
      } else if (item.type === 'ellipse') {
        el = document.createElementNS(ns, 'ellipse');
        el.setAttribute('cx', item.x + item.w / 2); el.setAttribute('cy', item.y + item.h / 2);
        el.setAttribute('rx', Math.abs(item.w) / 2); el.setAttribute('ry', Math.abs(item.h) / 2);
        el.setAttribute('fill', item.fill || 'none'); el.setAttribute('stroke', item.stroke || '#8bc8ff'); el.setAttribute('stroke-width', item.strokeWidth || '8');
        svg.appendChild(selectable(el, item));
      } else if (item.type === 'textbox') {
        const box = document.createElementNS(ns, 'rect');
        box.setAttribute('x', item.x); box.setAttribute('y', item.y);
        box.setAttribute('width', item.w); box.setAttribute('height', item.h);
        box.setAttribute('fill', item.fill || 'rgba(11,20,30,0.5)'); box.setAttribute('stroke', item.stroke || '#8bc8ff'); box.setAttribute('stroke-width', item.strokeWidth || '6');
        svg.appendChild(selectable(box, item));
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', item.x + item.w / 2); text.setAttribute('y', item.y + item.h / 2);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('fill', item.textColor || '#d3e9ff'); text.setAttribute('font-size', item.fontSize || Math.max(26, Math.min(58, item.h * 0.38)));
        text.textContent = item.text || 'TEXT';
        svg.appendChild(selectable(text, item));
      } else if (item.type === 'image' || item.type === 'svg') {
        el = document.createElementNS(ns, 'image');
        el.setAttribute('href', item.src);
        el.setAttribute('x', item.x); el.setAttribute('y', item.y);
        el.setAttribute('width', item.w); el.setAttribute('height', item.h);
        el.setAttribute('preserveAspectRatio', IMAGE_FIT === 'zoom' ? 'xMidYMid slice' : 'xMidYMid meet');
        svg.appendChild(selectable(el, item));
      } else if (item.type === 'placeholder') {
        el = document.createElementNS(ns, 'rect');
        el.setAttribute('x', item.x); el.setAttribute('y', item.y);
        el.setAttribute('width', item.w); el.setAttribute('height', item.h);
        el.setAttribute('class', 'placeholder');
        svg.appendChild(selectable(el, item));
        const label = document.createElementNS(ns, 'text');
        label.setAttribute('x', item.x + 16); label.setAttribute('y', item.y + 46);
        label.setAttribute('class', 'placeholder-text');
        label.textContent = item.share ? `${item.text} ← ${item.share}` : `${item.text} (drop share)`;
        svg.appendChild(selectable(label, item));
      }
    }

    function exportCommands() {
      const lines = [];
      const includeWallConfig = $('include-wall-config')?.checked;
      const includePlaceholders = $('include-placeholders')?.checked ?? true;
      if (includeWallConfig) {
        lines.push(`add wall rows=${state.wall.rows} cols=${state.wall.cols} screen=1920x1080`);
        state.regions.forEach(r => lines.push(`add region name="${r.name}" row=${r.row} col=${r.col} rows=${r.rows} cols=${r.cols} color="${r.color || '#8bc8ff'}"`));
      }
      state.items.forEach(i => {
        const zPart = ` z=${clampZ(i.z)}`;
        if (i.type === 'rectangle') {
          lines.push(`add rectangle (${i.x},${i.y},${i.w},${i.h}) fillColor=${i.stroke || 'none'} strokeWidth=${i.strokeWidth || 8}${zPart}`);
        }
        if (i.type === 'round-rectangle') {
          lines.push(`add roundRectangle (${i.x},${i.y},${i.w},${i.h}) fillColor=${i.stroke || 'none'} width=${i.strokeWidth || 8}${zPart}`);
        }
        if (i.type === 'line') lines.push(`add line (${i.x},${i.y},${i.x + i.w},${i.y + i.h}) stroke=${i.stroke || 'none'} width=${i.strokeWidth || 10}${zPart}`);
        if (i.type === 'ellipse') lines.push(`add ellipse (${i.x + i.w / 2},${i.y + i.h / 2},${Math.abs(i.w / 2)},${Math.abs(i.h / 2)}) stroke=${i.stroke || 'none'} fill=${i.fill || 'none'} width=${i.strokeWidth || 8}${zPart}`);
        if (i.type === 'textbox') lines.push(`add textbox (${i.x},${i.y},${i.w},${i.h}) text="${(i.text || '').replace(/"/g, '\\"')}" fillColor=${i.fill || '#000000'} size=${i.fontSize || Math.max(26, Math.min(58, i.h * 0.38))} fontColor=${i.textColor || '#d3e9ff'}${zPart}`);
        if (i.type === 'image') lines.push(`add image (${i.x},${i.y},${i.w},${i.h}) source="${i.label || 'image'}"${zPart}`);
        if (i.type === 'svg') lines.push(`add svg (${i.x},${i.y},${i.w},${i.h}) source="${i.label || 'vector.svg'}"${zPart}`);
        if (i.type === 'placeholder' && includePlaceholders) {
          const sharePart = i.share ? ` share="${i.share}"` : '';
          lines.push(`reserve placeholder area (${i.x},${i.y},${i.w},${i.h}) name="${i.text}"${sharePart}${zPart}`);
        }
      });
      const prefix = ($('export-prefix')?.value || '').trim();
      $('export-output').value = prefix ? `${prefix}\n\n${lines.join('\n')}` : lines.join('\n');
    }

    function generatorBorderGrid(options) {
      const inset = Math.max(1, Number.isFinite(options.inset) ? options.inset : 30);
      const borderWidth = Math.max(1, Number.isFinite(options.width) ? options.width : 15);
      const titleSize = Math.max(12, Number.isFinite(options.titleSize) ? options.titleSize : 42);
      const gap = options.gap === true;
      const titleOption = typeof options.title === 'string' ? options.title.trim() : '';
      const wildcardTitle = titleOption === '*';
      const colorOption = typeof options.color === 'string' ? options.color.trim() : '';
      const defaultBorderColor = '#ffffff';
      const rows = Math.max(1, state.wall.rows);
      const cols = Math.max(1, state.wall.cols);
      const firstRegionColor = state.regions[0]?.color ? state.regions[0].color.trim() : '';

      function splitPipe(value) {
        return (value || '').split('|').map((part) => part.trim());
      }

      function getRegionBounds(region) {
        return {
          x: (region.col - 1) * SCREEN_W,
          y: (region.row - 1) * SCREEN_H,
          w: region.cols * SCREEN_W,
          h: region.rows * SCREEN_H
        };
      }

      function overlaps(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function drawBorderBlock(bounds, blockTitle, borderColor) {
        const borderX = bounds.x + inset;
        const borderY = bounds.y + inset;
        const borderW = Math.max(1, bounds.w - inset * 2);
        const borderH = Math.max(1, bounds.h - inset * 2);

        state.items.push({
          id: nextId('g'),
          type: 'rectangle',
          x: Math.round(borderX),
          y: Math.round(borderY),
          w: Math.round(borderW),
          h: Math.round(borderH),
          stroke: borderColor,
          fill: 'none',
          strokeWidth: borderWidth,
          z: 2
        });

        if (!blockTitle) return;

        const titleH = Math.max(56, Math.round(titleSize * 1.8));
        const titleW = Math.max(220, Math.min(Math.round(bounds.w * 0.72), blockTitle.length * 28 + 80));
        state.items.push({
          id: nextId('ttl'),
          type: 'textbox',
          x: Math.round(bounds.x + (bounds.w - titleW) / 2),
          y: Math.round(borderY - titleH / 2),
          w: Math.round(titleW),
          h: Math.round(titleH),
          text: blockTitle,
          fill: '#000000',
          stroke: '#000000',
          strokeWidth: 2,
          textColor: borderColor,
          fontSize: Math.round(titleSize),
          z: 3
        });
      }

      state.items = [];

      const explicitTitleParts = splitPipe(titleOption).filter((part) => part.length > 0);
      const titleParts = wildcardTitle ? [] : explicitTitleParts;
      const colorParts = splitPipe(colorOption);
      const multiTitle = titleParts.length > 1;
      const placeholderBlocks = [];

      if ((multiTitle || wildcardTitle) && state.regions.length) {
        const candidates = state.regions
          .map((region) => ({ region, bounds: getRegionBounds(region) }))
          .sort((a, b) => a.bounds.x - b.bounds.x || a.bounds.y - b.bounds.y);

        const accepted = [];
        candidates.forEach((candidate) => {
          if (accepted.some((prev) => overlaps(prev.bounds, candidate.bounds))) return;
          accepted.push(candidate);
        });

        const resolvedTitles = wildcardTitle
          ? accepted.map((entry, idx) => entry.region?.name || `REGION_${idx + 1}`)
          : titleParts;
        const usable = Math.min(resolvedTitles.length, accepted.length);
        for (let i = 0; i < usable; i++) {
          const blockTitle = resolvedTitles[i];
          const regionColor = accepted[i].region?.color ? accepted[i].region.color.trim() : '';
          const blockColor = colorParts[i] || regionColor || defaultBorderColor;
          drawBorderBlock(accepted[i].bounds, blockTitle, blockColor);
          placeholderBlocks.push({
            bounds: accepted[i].bounds,
            rows: accepted[i].region.rows,
            cols: accepted[i].region.cols,
            rowStart: accepted[i].region.row,
            colStart: accepted[i].region.col
          });
        }
      }

      if (!state.items.length) {
        const fallbackTitle = wildcardTitle ? (state.wallName || 'Wall') : (titleParts[0] || titleOption);
        const fallbackColor = colorParts[0] || firstRegionColor || defaultBorderColor;
        drawBorderBlock({ x: 0, y: 0, w: wallWidth(), h: wallHeight() }, fallbackTitle, fallbackColor);
        placeholderBlocks.push({
          bounds: { x: 0, y: 0, w: wallWidth(), h: wallHeight() },
          rows,
          cols,
          rowStart: 1,
          colStart: 1
        });
      }

      if (gap) {
        const perScreenInset = inset * 2;
        const cellW = Math.max(20, SCREEN_W - perScreenInset * 2);
        const cellH = Math.max(20, SCREEN_H - perScreenInset * 2);
        placeholderBlocks.forEach((block) => {
          for (let r = 0; r < block.rows; r++) {
            for (let c = 0; c < block.cols; c++) {
              const sx = block.bounds.x + c * SCREEN_W;
              const sy = block.bounds.y + r * SCREEN_H;
              state.items.push({
                id: nextId('ph'),
                type: 'placeholder',
                x: Math.round(sx + perScreenInset),
                y: Math.round(sy + perScreenInset),
                w: Math.round(cellW),
                h: Math.round(cellH),
                text: `GRID_${block.rowStart + r}_${block.colStart + c}`,
                share: '',
                z: 1
              });
            }
          }
        });
        return;
      }

      placeholderBlocks.forEach((block) => {
        const blockBorderX = block.bounds.x + inset;
        const blockBorderY = block.bounds.y + inset;
        const blockBorderW = Math.max(1, block.bounds.w - inset * 2);
        const blockBorderH = Math.max(1, block.bounds.h - inset * 2);
        const x0 = blockBorderX + inset;
        const y0 = blockBorderY + inset;
        const innerW = Math.max(1, blockBorderW - inset * 2);
        const innerH = Math.max(1, blockBorderH - inset * 2);
        const xStep = innerW / block.cols;
        const yStep = innerH / block.rows;
        for (let r = 0; r < block.rows; r++) {
          for (let c = 0; c < block.cols; c++) {
            const left = Math.round(x0 + c * xStep);
            const top = Math.round(y0 + r * yStep);
            const right = Math.round(x0 + (c + 1) * xStep);
            const bottom = Math.round(y0 + (r + 1) * yStep);
            state.items.push({
              id: nextId('ph'),
              type: 'placeholder',
              x: left,
              y: top,
              w: Math.max(1, right - left),
              h: Math.max(1, bottom - top),
              text: `GRID_${block.rowStart + r}_${block.colStart + c}`,
              share: '',
              z: 1
            });
          }
        }
      });
    }

    function getFocusBlock(rows, cols, focusCells, horizontal) {
      let best = { blockRows: 1, blockCols: 1, area: Number.MAX_SAFE_INTEGER, score: Number.MAX_SAFE_INTEGER };
      for (let blockRows = 1; blockRows <= rows; blockRows++) {
        for (let blockCols = 1; blockCols <= cols; blockCols++) {
          const area = blockRows * blockCols;
          if (area < focusCells) continue;
          const aspect = blockCols / blockRows;
          const orientationPenalty = horizontal ? Math.max(0, 1 - aspect) : Math.max(0, aspect - 1);
          const waste = area - focusCells;
          const score = waste * 100 + orientationPenalty * 10 + Math.abs(Math.log(aspect || 1));
          if (score < best.score || (score === best.score && area < best.area)) {
            best = { blockRows, blockCols, area, score };
          }
        }
      }
      return best;
    }

    function generatorRandom(options) {
      const subdivide = options.subdivide === true;
      const fill = options.fill === true;
      const rows = Math.max(1, state.wall.rows) * (subdivide ? 2 : 1);
      const cols = Math.max(1, state.wall.cols) * (subdivide ? 2 : 1);
      const cellW = subdivide ? SCREEN_W / 2 : SCREEN_W;
      const cellH = subdivide ? SCREEN_H / 2 : SCREEN_H;
      const N = Math.min(rows, cols);
      const inset = Math.max(0, Number.isFinite(options.inset) ? options.inset : 40);

      // count may be a pipe-delimited string like "2|4|20" specifying per-size targets
      // sizes go from N×N down to 1×1; extra pipe values are ignored, missing ones default to 0
      const rawCount = options.count;
      const targets = [];
      let count;
      let enforceFeasibility = true;
      if (typeof rawCount === 'string' && rawCount.includes('|')) {
        enforceFeasibility = false;
        const parts = rawCount.split('|').map(s => Math.max(0, parseInt(s, 10) || 0));
        for (let i = 0; i < N; i++) {
          targets.push({ k: N - i, target: parts[i] ?? 0 });
        }
        count = parts.reduce((a, b) => a + b, 0);
      } else {
        count = Math.max(1, Number.isFinite(rawCount) ? rawCount : Math.ceil(rows * cols / 3));
        let usedCount = 0;
        for (let k = N; k >= 2; k--) {
          const t = Math.max(0, Math.round(count / (N * k)));
          targets.push({ k, target: t });
          usedCount += t;
        }
        targets.push({ k: 1, target: Math.max(0, count - usedCount) });
      }

      const occupied = new Set();
      const key = (r, c) => r * 10000 + c;

      function canPlace(r, c, k) {
        if (r + k > rows || c + k > cols) return false;
        for (let dr = 0; dr < k; dr++)
          for (let dc = 0; dc < k; dc++)
            if (occupied.has(key(r + dr, c + dc))) return false;
        return true;
      }

      function mark(r, c, k) {
        for (let dr = 0; dr < k; dr++)
          for (let dc = 0; dc < k; dc++)
            occupied.add(key(r + dr, c + dc));
      }

      state.items = [];
      let n = 0;

      const totalCells = rows * cols;

      for (const { k, target } of targets) {
        for (let t = 0; t < target; t++) {
          // Skip if placing k×k would leave fewer free cells than remaining items needed
          if (enforceFeasibility) {
            const remainingNeeded = count - n - 1;
            if (totalCells - occupied.size - k * k < remainingNeeded) break;
          }
          const positions = [];
          for (let r = 0; r <= rows - k; r++)
            for (let c = 0; c <= cols - k; c++)
              if (canPlace(r, c, k)) positions.push([r, c]);
          if (!positions.length) break;
          const [r, c] = positions[Math.floor(Math.random() * positions.length)];
          mark(r, c, k);
          state.items.push({
            id: nextId('ph'), type: 'placeholder',
            x: Math.round(c * cellW + inset),
            y: Math.round(r * cellH + inset),
            w: Math.round(k * cellW - inset * 2),
            h: Math.round(k * cellH - inset * 2),
            text: `RAND_${++n}`, share: '', z: 1
          });
        }
      }

      // Fill any remaining slots (missed when large blocks were skipped, or fill=T) with 1×1s
      while (n < count || fill) {
        const positions = [];
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++)
            if (canPlace(r, c, 1)) positions.push([r, c]);
        if (!positions.length) break;
        const [r, c] = positions[Math.floor(Math.random() * positions.length)];
        mark(r, c, 1);
        state.items.push({
          id: nextId('ph'), type: 'placeholder',
          x: Math.round(c * cellW + inset),
          y: Math.round(r * cellH + inset),
          w: Math.round(cellW - inset * 2),
          h: Math.round(cellH - inset * 2),
          text: `RAND_${++n}`, share: '', z: 1
        });
      }
    }

    function generatorPip(options) {
      const inset = Math.max(0, Number.isFinite(options.inset) ? options.inset : 40);
      const pipCount = Math.max(1, Number.isFinite(options.pipCount) ? options.pipCount : 3);
      const pipSize = Math.min(0.5, Math.max(0.1, Number.isFinite(options.pipSize) ? options.pipSize : 0.25));
      const corner = typeof options.corner === 'string' ? options.corner.trim() : 'bot-right';
      const aspect = SCREEN_W / SCREEN_H;

      state.items = [];

      const focalCount = Math.max(1, Number.isFinite(options.focalCount) ? options.focalCount : 1);
      const wW = wallWidth(), wH = wallHeight();

      // Evenly space focal views; auto-orient along the longer wall axis
      const horizontal = wW >= wH;
      const focalBoxW = horizontal ? Math.round(wW / focalCount) : wW;
      const focalBoxH = horizontal ? wH : Math.round(wH / focalCount);

      // Each focal is 16:9, centered in its box with inset margin
      let fW = focalBoxW - 2 * inset, fH = Math.round(fW / aspect);
      if (fH > focalBoxH - 2 * inset) { fH = focalBoxH - 2 * inset; fW = Math.round(fH * aspect); }

      for (let fi = 0; fi < focalCount; fi++) {
        const boxX = horizontal ? fi * focalBoxW : 0;
        const boxY = horizontal ? 0 : fi * focalBoxH;
        const fx = boxX + Math.round((focalBoxW - fW) / 2);
        const fy = boxY + Math.round((focalBoxH - fH) / 2);
        state.items.push({ id: nextId('ph'), type: 'placeholder', x: fx, y: fy, w: fW, h: fH, text: focalCount > 1 ? `FOCAL_${fi + 1}` : 'FOCAL', share: '', z: 1 });
      }

      // PiP anchor: single focal → relative to that focal's bounds; multiple → relative to full wall
      const pipAnchorX = focalCount === 1 ? Math.round((wW - fW) / 2) : 0;
      const pipAnchorY = focalCount === 1 ? Math.round((wH - fH) / 2) : 0;
      const pipAnchorW = focalCount === 1 ? fW : wW;
      const pipAnchorH = focalCount === 1 ? fH : wH;

      // PiP size: pipSize fraction of anchor height, maintaining aspect ratio
      const pipH = Math.round(pipAnchorH * pipSize);
      const pipW = Math.round(pipH * aspect);

      const useBottom = /bot|bottom/i.test(corner);
      const useTop    = /top/i.test(corner);
      const useRight  = /right/i.test(corner);
      const useLeft   = /left/i.test(corner);
      const stackH = useBottom || useTop;

      if (stackH) {
        const totalW = pipCount * pipW + (pipCount - 1) * inset;
        let startX;
        if (useLeft) startX = pipAnchorX + inset;
        else if (useRight) startX = pipAnchorX + pipAnchorW - totalW - inset;
        else startX = pipAnchorX + Math.round((pipAnchorW - totalW) / 2);
        const py = useTop ? pipAnchorY + inset : pipAnchorY + pipAnchorH - pipH - inset;
        for (let i = 0; i < pipCount; i++) {
          const px = startX + i * (pipW + inset);
          if (withinWall(px, py, pipW, pipH)) {
            state.items.push({ id: nextId('ph'), type: 'placeholder', x: px, y: py, w: pipW, h: pipH, text: `PIP_${i + 1}`, share: '', z: 2 });
          }
        }
      } else {
        const totalH = pipCount * pipH + (pipCount - 1) * inset;
        let startY;
        if (useTop) startY = pipAnchorY + inset;
        else if (useBottom) startY = pipAnchorY + pipAnchorH - totalH - inset;
        else startY = pipAnchorY + Math.round((pipAnchorH - totalH) / 2);
        const px = useLeft ? pipAnchorX + inset : pipAnchorX + pipAnchorW - pipW - inset;
        for (let i = 0; i < pipCount; i++) {
          const py = startY + i * (pipH + inset);
          if (withinWall(px, py, pipW, pipH)) {
            state.items.push({ id: nextId('ph'), type: 'placeholder', x: px, y: py, w: pipW, h: pipH, text: `PIP_${i + 1}`, share: '', z: 2 });
          }
        }
      }
    }

    function generatorSpotlight(options) {
      const inset = Math.max(0, Number.isFinite(options.inset) ? options.inset : 40);
      const detailCount = Math.max(1, Number.isFinite(options.detailCount) ? options.detailCount : 4);
      const splitOpt = typeof options.split === 'string' && options.split.trim() ? options.split.trim().toUpperCase() : 'V';
      const aspect = SCREEN_W / SCREEN_H;

      state.items = [];

      if (splitOpt === 'V') {
        const dHfromHeight = (wallHeight() - inset * (detailCount + 1)) / detailCount;
        let dW = dHfromHeight * aspect;
        let fW = wallWidth() - 3 * inset - dW;
        if (dW > fW / 2) {
          dW = (wallWidth() - 3 * inset) / 3;
          fW = wallWidth() - 3 * inset - dW;
        }
        let fH = fW / aspect;
        if (fH > wallHeight() - 2 * inset) {
          fH = wallHeight() - 2 * inset;
          fW = fH * aspect;
          dW = Math.min(dW, fW / 2);
        }
        const dH = Math.round(dW / aspect);
        // Center the focus+gap+details block horizontally
        const totalW = Math.round(fW) + inset + Math.round(dW);
        const startX = Math.round((wallWidth() - totalW) / 2);
        const fy = Math.round((wallHeight() - fH) / 2);
        const fx = startX;
        const dx = startX + Math.round(fW) + inset;
        // Center the thumbnail column vertically
        const totalThumbH = detailCount * dH + (detailCount - 1) * inset;
        const thumbStartY = Math.round((wallHeight() - totalThumbH) / 2);
        if (withinWall(fx, fy, Math.round(fW), Math.round(fH))) {
          state.items.push({ id: nextId('ph'), type: 'placeholder', x: fx, y: fy, w: Math.round(fW), h: Math.round(fH), text: 'SPOTLIGHT', share: '', z: 1 });
        }
        for (let i = 0; i < detailCount; i++) {
          const dy = thumbStartY + i * (dH + inset);
          if (withinWall(dx, dy, Math.round(dW), dH)) {
            state.items.push({ id: nextId('ph'), type: 'placeholder', x: dx, y: dy, w: Math.round(dW), h: dH, text: `THUMB_${i + 1}`, share: '', z: 1 });
          }
        }
      } else if (splitOpt === 'H') {
        const dWfromWidth = (wallWidth() - inset * (detailCount + 1)) / detailCount;
        let dH = dWfromWidth / aspect;
        let fH = wallHeight() - 3 * inset - dH;
        if (dH > fH / 2) {
          dH = (wallHeight() - 3 * inset) / 3;
          fH = wallHeight() - 3 * inset - dH;
        }
        let fW = fH * aspect;
        if (fW > wallWidth() - 2 * inset) {
          fW = wallWidth() - 2 * inset;
          fH = fW / aspect;
          dH = Math.min(dH, fH / 2);
        }
        const dW = Math.round(dH * aspect);
        // Center the focus+gap+details block vertically
        const totalH = Math.round(fH) + inset + Math.round(dH);
        const startY = Math.round((wallHeight() - totalH) / 2);
        const fx = Math.round((wallWidth() - fW) / 2);
        const fy = startY;
        const dy = startY + Math.round(fH) + inset;
        // Center the thumbnail row horizontally
        const totalThumbW = detailCount * dW + (detailCount - 1) * inset;
        const thumbStartX = Math.round((wallWidth() - totalThumbW) / 2);
        if (withinWall(fx, fy, Math.round(fW), Math.round(fH))) {
          state.items.push({ id: nextId('ph'), type: 'placeholder', x: fx, y: fy, w: Math.round(fW), h: Math.round(fH), text: 'SPOTLIGHT', share: '', z: 1 });
        }
        for (let i = 0; i < detailCount; i++) {
          const dx = thumbStartX + i * (dW + inset);
          if (withinWall(dx, dy, dW, Math.round(dH))) {
            state.items.push({ id: nextId('ph'), type: 'placeholder', x: dx, y: dy, w: dW, h: Math.round(dH), text: `THUMB_${i + 1}`, share: '', z: 1 });
          }
        }
      }
    }

    function generatorMosaic(options) {
      const inset = Math.max(0, Number.isFinite(options.inset) ? options.inset : 60);
      const rows = Math.max(1, state.wall.rows);
      const cols = Math.max(1, state.wall.cols);
      state.items = [];
      let n = 1;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          state.items.push({
            id: nextId('ph'),
            type: 'placeholder',
            x: Math.round(c * SCREEN_W + inset),
            y: Math.round(r * SCREEN_H + inset),
            w: Math.round(SCREEN_W - inset * 2),
            h: Math.round(SCREEN_H - inset * 2),
            text: `FEED_${n++}`,
            share: '',
            z: 1
          });
        }
      }
    }

    function generatorFocusDetail(options) {
      const inset = Math.max(0, Number.isFinite(options.inset) ? options.inset : 40);
      const rows = Math.max(1, state.wall.rows);
      const cols = Math.max(1, state.wall.cols);
      const detailCount = Math.max(0, Number.isFinite(options.detailCount) ? options.detailCount : 3);
      const title = typeof options.title === 'string' ? options.title.trim() : '';
      const splitOpt = typeof options.split === 'string' && options.split.trim() ? options.split.trim().toUpperCase() : 'V';
      const aspect = SCREEN_W / SCREEN_H;
      const defaultFocusDim = Math.min(rows, cols);
      const focusRows = Math.max(1, Math.min(rows, Number.isFinite(options.focusRows) ? options.focusRows : defaultFocusDim));
      const focusCols = Math.max(1, Math.min(cols, Number.isFinite(options.focusCols) ? options.focusCols : defaultFocusDim));

      state.items = [];

      if (splitOpt === 'V') {
        // Focus: vertically centered, at col 0
        const focusRowOffset = Math.floor((rows - focusRows) / 2);
        const fx = inset, fy = Math.round(focusRowOffset * SCREEN_H + inset);
        const fw = Math.round(focusCols * SCREEN_W - inset * 2);
        const fh = Math.round(focusRows * SCREEN_H - inset * 2);
        if (withinWall(fx, fy, fw, fh)) {
          state.items.push({ id: nextId('ph'), type: 'placeholder', x: fx, y: fy, w: fw, h: fh, text: 'FOCUS_MAIN', share: '', z: 1 });
        }
        // Details: wrap top-to-bottom in columns to the right, each natural screen size
        const dw = Math.round(SCREEN_W - inset * 2);
        const dh = Math.round(SCREEN_H - inset * 2);
        for (let i = 0; i < detailCount; i++) {
          const dcol = Math.floor(i / focusRows);
          const drow = i % focusRows;
          const x = Math.round((focusCols + dcol) * SCREEN_W + inset);
          const y = Math.round((focusRowOffset + drow) * SCREEN_H + inset);
          if (!withinWall(x, y, dw, dh)) break;
          state.items.push({ id: nextId('ph'), type: 'placeholder', x, y, w: dw, h: dh, text: `DETAIL_${i + 1}`, share: '', z: 1 });
        }
      } else if (splitOpt === 'H') {
        // Focus: horizontally centered
        const colOffset = Math.floor((cols - focusCols) / 2);
        const fx = Math.round(colOffset * SCREEN_W + inset);
        const fw = Math.round(focusCols * SCREEN_W - inset * 2);
        const fh = Math.round(focusRows * SCREEN_H - inset * 2);
        if (withinWall(fx, inset, fw, fh)) {
          state.items.push({ id: nextId('ph'), type: 'placeholder', x: fx, y: inset, w: fw, h: fh, text: 'FOCUS_MAIN', share: '', z: 1 });
        }
        // Details: wrap left-to-right in rows below focus, each natural screen size
        const dw = Math.round(SCREEN_W - inset * 2);
        const dh = Math.round(SCREEN_H - inset * 2);
        for (let i = 0; i < detailCount; i++) {
          const drow = Math.floor(i / focusCols);
          const dcol = i % focusCols;
          const x = Math.round((colOffset + dcol) * SCREEN_W + inset);
          const y = Math.round((focusRows + drow) * SCREEN_H + inset);
          if (!withinWall(x, y, dw, dh)) break;
          state.items.push({ id: nextId('ph'), type: 'placeholder', x, y, w: dw, h: dh, text: `DETAIL_${i + 1}`, share: '', z: 1 });
        }
      }

      if (title) {
        state.items.push({
          id: nextId('ttl'),
          type: 'textbox',
          x: Math.round(inset),
          y: Math.round(inset),
          w: Math.round(Math.min(Math.max(300, title.length * 24), wallWidth() * 0.5)),
          h: 74,
          text: title,
          fill: '#000000',
          stroke: '#8bc8ff',
          strokeWidth: 2,
          textColor: '#d3e9ff',
          fontSize: 30,
          z: 20
        });
      }
    }

    function generatorStaggered(options) {
      const count = Math.max(1, Number.isFinite(options.count) ? options.count : state.wall.rows * state.wall.cols);
      const cols = Math.max(1, Math.min(state.wall.cols, Number.isFinite(options.cols) ? options.cols : 4));
      const inset = Math.max(0, Number.isFinite(options.inset) ? options.inset : 100);
      const offset = Math.max(0, Number.isFinite(options.offset) ? options.offset : 130);
      const title = typeof options.title === 'string' ? options.title.trim() : '';

      state.items = [];
      const slotW = wallWidth() / cols;
      const aspect = SCREEN_W / SCREEN_H;
      const maxW = slotW - inset * 2;
      const maxH = wallHeight() - offset;
      const itemH = Math.max(40, Math.round(Math.min(maxW / aspect, maxH)));
      const itemW = Math.max(60, Math.round(Math.min(maxW, itemH * aspect)));
      const rowsNeeded = Math.max(1, Math.ceil(count / cols));
      let placed = 0;
      for (let col = 0; col < cols && placed < count; col++) {
        const colStartY = (col % 2 === 0) ? offset : 0;
        for (let row = 0; row < rowsNeeded && placed < count; row++) {
          const x = Math.round(col * slotW + (slotW - itemW) / 2);
          const y = Math.round(colStartY + row * (itemH + inset));
          const rw = Math.round(itemW);
          const rh = Math.round(itemH);
          if (withinWall(x, y, rw, rh)) {
            placed++;
            state.items.push({ id: nextId('ph'), type: 'placeholder', x, y, w: rw, h: rh, text: `STAG_${placed}`, share: '', z: 1 });
          }
        }
      }

      if (title) {
        state.items.push({
          id: nextId('ttl'),
          type: 'textbox',
          x: Math.round(inset),
          y: Math.round(Math.max(0, inset * 0.3)),
          w: Math.round(Math.min(Math.max(260, title.length * 24), wallWidth() * 0.45)),
          h: 70,
          text: title,
          fill: '#000000',
          stroke: '#8bc8ff',
          strokeWidth: 2,
          textColor: '#d3e9ff',
          fontSize: 28,
          z: 20
        });
      }
    }

    function runGenerator() {
      const type = $('generator').value;
      const options = parseGeneratorHint($('generator-hint').value);
      if (type === 'border-grid') generatorBorderGrid(options);
      if (type === 'focus-detail') generatorFocusDetail(options);
      if (type === 'mosaic') generatorMosaic(options);
      if (type === 'random') generatorRandom(options);
      if (type === 'pip') generatorPip(options);
      if (type === 'spotlight') generatorSpotlight(options);
      if (type === 'staggered') generatorStaggered(options);
      state.selectedId = null;
      setStatus(`Generator applied: ${type}`);
      render();
    }

    function clearWall() {
      state.regions = [];
      state.items = [];
      state.selectedId = null;
      setStatus('Wall cleared');
      render();
    }

    function removeSelected() {
      if (!state.selectedId) {
        setStatus('Nothing selected');
        return;
      }
      state.items = state.items.filter(i => i.id !== state.selectedId);
      state.selectedId = null;
      setStatus('Selected item deleted');
      render();
    }

    function applyWall() {
      state.wall.rows = Math.max(1, parseFormNum('wall-rows', 1));
      state.wall.cols = Math.max(1, parseFormNum('wall-cols', 1));
      state.wallName = `${state.wall.rows}x${state.wall.cols}`;
      state.regions = [];
      state.items = [];
      state.selectedId = null;
      setStatus('Wall updated and cleared');
      updateGeneratorHint();
      render();
    }

    function renderPreview() {
      const ns = 'http://www.w3.org/2000/svg';
      const wW = wallWidth(), wH = wallHeight();

      // Wall outline
      const outline = document.createElementNS(ns, 'rect');
      outline.setAttribute('x', 0); outline.setAttribute('y', 0);
      outline.setAttribute('width', wW); outline.setAttribute('height', wH);
      outline.setAttribute('fill', 'none');
      outline.setAttribute('stroke', 'rgba(200,210,220,0.35)');
      outline.setAttribute('stroke-width', '8');
      svg.appendChild(outline);

      // Non-overlapping regions (greedy first-fit)
      const placed = [];
      state.regions.forEach(region => {
        const rx = (region.col - 1) * SCREEN_W, ry = (region.row - 1) * SCREEN_H;
        const rw = region.cols * SCREEN_W, rh = region.rows * SCREEN_H;
        const overlaps = placed.some(p => rx < p.x + p.w && rx + rw > p.x && ry < p.y + p.h && ry + rh > p.y);
        if (!overlaps) {
          placed.push({ x: rx, y: ry, w: rw, h: rh });
          const el = document.createElementNS(ns, 'rect');
          el.setAttribute('x', rx); el.setAttribute('y', ry);
          el.setAttribute('width', rw); el.setAttribute('height', rh);
          el.setAttribute('fill', 'none');
          el.setAttribute('stroke', 'rgba(200,210,220,0.4)');
          el.setAttribute('stroke-dasharray', '24 16');
          el.setAttribute('stroke-width', '5');
          svg.appendChild(el);
        }
      });

      const previewTypes = new Set(['image', 'svg', 'rectangle', 'round-rectangle', 'line', 'ellipse', 'textbox']);
      state.items
        .slice()
        .sort((a, b) => clampZ(a.z) - clampZ(b.z))
        .filter(i => previewTypes.has(i.type))
        .forEach(drawItem);
    }

    function render() {
      updateWallMeta();
      fitCanvasShell();
      renderRegionList();
      applySceneViewBox();
      clearSvg();
      if (state.previewMode) {
        renderPreview();
        return;
      }
      renderGrid();
      if ($('show-regions').checked) state.regions.forEach(drawRegion);
      state.items
        .slice()
        .sort((a, b) => clampZ(a.z) - clampZ(b.z))
        .forEach(drawItem);
      exportCommands();
    }

    function wire() {
      $('apply-wall').addEventListener('click', applyWall);
      $('clear-wall').addEventListener('click', clearWall);
      $('save-wall-preset').addEventListener('click', saveWallPreset);
      $('load-wall-preset').addEventListener('click', loadWallPreset);
      $('delete-wall-preset').addEventListener('click', deleteWallPreset);
      $('wall-preset-list').addEventListener('change', loadWallPreset);
      $('add-region').addEventListener('click', addRegion);
      $('add-primitive').addEventListener('click', addPrimitive);
      $('add-placeholder').addEventListener('click', addPlaceholder);
      $('assign-share').addEventListener('click', assignShareToSelection);
      $('delete-selected').addEventListener('click', removeSelected);
      $('asset-file').addEventListener('change', (e) => readAsset(e.target.files[0]));
      $('asset-folder').addEventListener('change', (e) => { assignFolderToPlaceholders(e.target.files); e.target.value = ''; });

      $('save-template').addEventListener('click', saveTemplate);
      $('apply-template').addEventListener('click', applyTemplate);
      $('delete-template').addEventListener('click', deleteTemplate);

      $('run-generator').addEventListener('click', runGenerator);
      $('export-cmds').addEventListener('click', exportCommands);
      $('include-wall-config').addEventListener('change', exportCommands);
      $('include-placeholders').addEventListener('change', exportCommands);
      $('export-prefix').addEventListener('input', () => {
        saveExportPrefix();
        exportCommands();
      });
      $('generator').addEventListener('change', updateGeneratorHint);

      $('toggle-left').addEventListener('click', () => {
        $('layout').classList.toggle('left-collapsed');
      });

      $('toggle-preview').addEventListener('click', () => {
        state.previewMode = !state.previewMode;
        $('toggle-preview').style.color = state.previewMode ? 'var(--accent)' : '';
        $('toggle-preview').style.borderColor = state.previewMode ? 'var(--accent)' : '';
        render();
      });

      $('show-regions').addEventListener('change', () => render());

      svg.addEventListener('click', () => {
        state.selectedId = null;
        setStatus('Ready');
        render();
      });

      window.addEventListener('resize', () => {
        fitCanvasShell();
      });
    }

    wire();
    updateGeneratorHint();
    loadWallPresetsFromStorage();
    if (state.wallPresets[DEFAULT_WALL_PRESET_NAME]) {
      $('wall-preset-list').value = DEFAULT_WALL_PRESET_NAME;
      loadWallPreset();
    }
    loadTemplatesFromStorage();
    loadExportPrefix();
    render();
    setStatus('Ready');
  </script>
</body>
</html>
