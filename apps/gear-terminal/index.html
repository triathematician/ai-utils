<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEAR TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121212; --fg: #ffb000; --accent: #ff0000;
  --dim: #7a5500; --muted: #3a2800; --border: #ffb000;
  --success: #00ff41; --warn: #ff6600;
  --font: 'VT323', 'Courier New', monospace;
  --font-size: 20px; --line-h: 1.4;
  --cat-1:#ffb000; --cat-2:#ff4444; --cat-3:#ff8800; --cat-4:#00ff41;
  --cat-5:#00bbff; --cat-6:#aa44ff; --cat-7:#ff44aa; --cat-8:#ffff44;
  --cat-9:#00ffaa; --cat-10:#ffffff;
}
[data-theme="solar"] {
  --bg:#002b36; --fg:#839496; --accent:#b58900;
  --dim:#4a5456; --muted:#073642; --border:#839496;
  --success:#859900; --warn:#cb4b16; --font:'Fira Code',monospace;
  --cat-1:#b58900; --cat-2:#cb4b16; --cat-3:#dc322f; --cat-4:#d33682;
  --cat-5:#6c71c4; --cat-6:#268bd2; --cat-7:#2aa198; --cat-8:#859900;
  --cat-9:#657b83; --cat-10:#93a1a1;
}
[data-theme="monk"] {
  --bg:#f5f5f5; --fg:#2a2a2a; --accent:#000000;
  --dim:#888; --muted:#e0e0e0; --border:#2a2a2a;
  --success:#1a6600; --warn:#aa4400; --font:'Source Code Pro',monospace;
  --cat-1:#2a2a2a; --cat-2:#aa2200; --cat-3:#005588; --cat-4:#336600;
  --cat-5:#884400; --cat-6:#550055; --cat-7:#006666; --cat-8:#7a5000;
  --cat-9:#555500; --cat-10:#003344;
}
[data-theme="space"] {
  --bg:#0a0a1a; --fg:#a0c0ff; --accent:#00ffff;
  --dim:#304060; --muted:#0f0f2a; --border:#304080;
  --success:#00ffaa; --warn:#ff6060; --font:'Fira Code',monospace;
  --cat-1:#00ffff; --cat-2:#ff00aa; --cat-3:#00ff88; --cat-4:#ffff00;
  --cat-5:#ff6060; --cat-6:#7788ff; --cat-7:#aa66ff; --cat-8:#ffffff;
  --cat-9:#00ccff; --cat-10:#ff8800;
}
[data-theme="synth"] {
  --bg:#1a0033; --fg:#ff00ff; --accent:#00ffff;
  --dim:#660066; --muted:#2a0044; --border:#ff00ff;
  --success:#00ff88; --warn:#ffaa00; --font:'Fira Code',monospace;
  --cat-1:#ff00ff; --cat-2:#00ffff; --cat-3:#00ff88; --cat-4:#ffaa00;
  --cat-5:#ff0066; --cat-6:#6600ff; --cat-7:#ff6600; --cat-8:#00aaff;
  --cat-9:#ffff00; --cat-10:#ff44aa;
}
[data-theme="dos"] {
  --bg:#0000aa; --fg:#aaaaaa; --accent:#ffffff;
  --dim:#5555ff; --muted:#0000cc; --border:#aaaaaa;
  --success:#55ff55; --warn:#ffff55; --font:'VT323',monospace;
  --cat-1:#ffffff; --cat-2:#55ffff; --cat-3:#55ff55; --cat-4:#ff5555;
  --cat-5:#ffff55; --cat-6:#ff55ff; --cat-7:#5555ff; --cat-8:#aaaaaa;
  --cat-9:#ffaa55; --cat-10:#55aaaa;
}
[data-theme="notebook"] {
  --bg:#fafaf2; --fg:#1a1a2e; --accent:#c0392b;
  --dim:#8a8a9a; --muted:#eeeede; --border:#90a8d4;
  --success:#2e7d32; --warn:#e65100; --font:'Source Code Pro',monospace;
  --cat-1:#c0392b; --cat-2:#d84315; --cat-3:#f57c00; --cat-4:#2e7d32;
  --cat-5:#1565c0; --cat-6:#6a1b9a; --cat-7:#00838f; --cat-8:#4e342e;
  --cat-9:#37474f; --cat-10:#880e4f;
}
[data-theme="engineering"] {
  --bg:#e8f5e8; --fg:#0d2b0d; --accent:#2e7d32;
  --dim:#5a7a5a; --muted:#d0e8d0; --border:#7ab87a;
  --success:#1b5e20; --warn:#cc6600; --font:'Source Code Pro',monospace;
  --cat-1:#2e7d32; --cat-2:#b71c1c; --cat-3:#e65100; --cat-4:#1b5e20;
  --cat-5:#1565c0; --cat-6:#4a148c; --cat-7:#00695c; --cat-8:#4e342e;
  --cat-9:#37474f; --cat-10:#880e4f;
}
[data-theme="winter"] {
  --bg:#0d1b2a; --fg:#d8eaf4; --accent:#7ec8e3;
  --dim:#5a7f94; --muted:#1a2f40; --border:#3d6b8c;
  --success:#4ecdc4; --warn:#f4a261; --font:'Fira Code',monospace;
  --cat-1:#7ec8e3; --cat-2:#a8d8ea; --cat-3:#cde8f5; --cat-4:#9bb7d4;
  --cat-5:#b8a8d0; --cat-6:#4ecdc4; --cat-7:#8fcfb8; --cat-8:#f4a261;
  --cat-9:#d4c5a9; --cat-10:#a8c0d0;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--font-size);
  line-height: var(--line-h); overflow: hidden;
}
::selection { background: var(--fg); color: var(--bg); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--muted); }
::-webkit-scrollbar-thumb { background: var(--dim); }
#app { display: grid; grid-template-rows: 30vh 60vh 10vh; height: 100vh; width: 100vw; }
#top-row { border-bottom: 1px solid var(--border); padding: 10px 12px; overflow-y: auto; }
#main-row { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
#main-panel { border-right: 1px solid var(--border); padding: 10px 12px; overflow-y: auto; }
#side-panel { padding: 10px 12px; overflow-y: auto; }
.row-header {
  color: var(--accent); font-size: 0.8em; letter-spacing: 2px;
  margin-bottom: 4px; border-bottom: 1px solid var(--muted); padding-bottom: 4px;
}
#console-row {
  background: var(--muted); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 8px;
}
#console-prompt { color: var(--accent); white-space: nowrap; }
#console-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--fg); font-family: var(--font); font-size: var(--font-size);
  caret-color: var(--accent);
}
#console-status { color: var(--dim); font-size: 0.8em; min-width: 160px; text-align: right; white-space: nowrap; }
.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.metric { border: 1px solid var(--muted); padding: 6px 8px; }
.metric-label { color: var(--dim); font-size: 0.72em; letter-spacing: 1px; }
.metric-value { color: var(--accent); font-size: 1.2em; }
.section-title { color: var(--accent); margin: 8px 0 2px; letter-spacing: 1px; font-size: 0.8em; }
.line { padding: 2px 0; border-bottom: 1px solid var(--muted); }
.line:last-child { border-bottom: none; }
.dim { color: var(--dim); font-size: 0.85em; }
.warn { color: var(--warn); }
.ok { color: var(--success); }
#help-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 150;
  align-items: center; justify-content: center;
}
#help-overlay.visible { display: flex; }
.overlay-box {
  background: var(--bg); border: 1px solid var(--border);
  padding: 16px 20px; min-width: 640px; max-width: min(90vw,960px);
  font-family: var(--font); color: var(--fg);
}
#help-title { color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; }
#help-body { white-space: pre; line-height: 1.8; max-height: 60vh; overflow-y: auto; }
#help-close { color: var(--dim); font-size: 0.82em; cursor: pointer; display: block; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="top-row">
    <div class="row-header">◈ GEAR SNAPSHOT</div>
    <div class="summary-grid">
      <div class="metric"><div class="metric-label">TOTAL ITEMS</div><div class="metric-value" id="metric-items">0</div></div>
      <div class="metric"><div class="metric-label">UNIQUE TYPES</div><div class="metric-value" id="metric-types">0</div></div>
      <div class="metric"><div class="metric-label">SERVICE DUE</div><div class="metric-value" id="metric-due">0</div></div>
      <div class="metric"><div class="metric-label">REPAIRS LOGGED</div><div class="metric-value" id="metric-repairs">0</div></div>
    </div>
    <div class="section-title">UPCOMING SERVICE</div>
    <div id="due-list" class="dim">No upcoming service dates.</div>
  </div>
  <div id="main-row">
    <div id="main-panel">
      <div class="row-header">◈ GEAR ITEMS</div>
      <div id="gear-list" class="dim">No gear yet. Add one with /add.</div>
    </div>
    <div id="side-panel">
      <div class="row-header">◈ REPAIR HISTORY</div>
      <div id="repair-list" class="dim">No repairs logged yet. Use /repair.</div>
    </div>
  </div>
  <div id="console-row">
    <span id="console-prompt">GEAR&gt;</span>
    <input type="text" id="console-input" autocomplete="off" spellcheck="false">
    <span id="console-status">READY</span>
  </div>
</div>

<div id="help-overlay">
  <div class="overlay-box">
    <div id="help-title"></div>
    <div id="help-body"></div>
    <span id="help-close">[ESC] CLOSE</span>
  </div>
</div>

<script>
const STORAGE_KEY = 'gear_terminal_db';
const EXPORT_SLUG = 'gear-terminal';
const THEMES = ['legacy','solar','monk','space','synth','dos','notebook','engineering','winter'];
let db = loadDB();

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    parsed.items = Array.isArray(parsed.items) ? parsed.items : [];
    parsed.repairs = Array.isArray(parsed.repairs) ? parsed.repairs : [];
    parsed.backlog = Array.isArray(parsed.backlog) ? parsed.backlog : [];
    parsed.backlogArchive = Array.isArray(parsed.backlogArchive) ? parsed.backlogArchive : [];
    return parsed;
  } catch {
    return { items: [], repairs: [], backlog: [], backlogArchive: [] };
  }
}
function saveDB() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function statusMsg(msg) {
  document.getElementById('console-status').textContent = msg;
  setTimeout(updateStatus, 3000);
}
function updateStatus() {
  document.getElementById('console-status').textContent = `${db.items.length} ITEM${db.items.length === 1 ? '' : 'S'}`;
}
function escHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function downloadBlob(content, filename, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function applyTheme(name) {
  if (!name) {
    const current = db.theme || 'legacy';
    const others = THEMES.filter(t => t !== current);
    name = others[Math.floor(Math.random() * others.length)];
  }
  if (!THEMES.includes(name)) { statusMsg('Unknown theme: ' + name); return; }
  document.documentElement.dataset.theme = name === 'legacy' ? '' : name;
  db.theme = name;
  saveDB();
  statusMsg('Theme: ' + name.toUpperCase());
}

const input = document.getElementById('console-input');
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const cmd = input.value.trim();
    input.value = '';
    if (cmd) handleConsoleCmd(cmd);
  }
});

function splitPipe(raw) {
  return raw.split('|').map(v => v.trim());
}

function normalizeDate(s) {
  if (!s) return '';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
  const d = new Date(s + 'T00:00:00');
  return Number.isNaN(d.getTime()) ? '' : s;
}

function handleConsoleCmd(raw) {
  const parts = raw.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg1 = parts[1] || '';
  const rest = raw.slice(cmd.length).trim();

  if (cmd === '/help') return showHelp();
  if (cmd === '/theme') return applyTheme(arg1);
  if (cmd === '/backlog') { handleBacklog(raw.slice('/backlog'.length).trim()); return; }
  if (cmd === '/export') return cmdExport(arg1);
  if (cmd === '/import') return cmdImport();
  if (cmd === '/list') return cmdList(arg1);
  if (cmd === '/add') return cmdAdd(rest);
  if (cmd === '/delete') return cmdDelete(arg1);
  if (cmd === '/service') return cmdService(rest);
  if (cmd === '/repair') return cmdRepair(rest);
  if (cmd === '/note') return cmdNote(rest);

  statusMsg('Unknown command: ' + cmd + '. Type /help');
}

function showHelp() {
  document.getElementById('help-title').textContent = '◈ GEAR TERMINAL — COMMANDS';
  document.getElementById('help-body').textContent = [
    '── GEAR ENTRIES ───────────────────────────────────────',
    '/add type name                  quick add item',
    '/add type | name | service | notes',
    '/list [all|type]                list gear in overlay',
    '/service [n] [YYYY-MM-DD]       set next service date',
    '/repair [n] [YYYY-MM-DD] [note] log repair/maintenance entry',
    '/note [n] [text]                append note to an item',
    '/delete [n]                     delete item + linked repairs',
    '',
    '── STANDARD ───────────────────────────────────────────',
    '/theme [name]                   switch theme',
    '/backlog [text]                 add item to backlog',
    '/backlog list                   show all backlog items',
    '/backlog done [n]               toggle item #n as done/open',
    '/backlog delete [n]             remove item #n from backlog',
    '/backlog archive                move done items to archive',
    '/backlog archive list           show archived batches',
    '/backlog export                 download backlog as .txt',
    '/export [txt|json]              export gear data',
    '/import                         import gear data from .json',
    '/help                           show this help'
  ].join('\n');
  openOverlay();
}

function openOverlay() {
  const overlay = document.getElementById('help-overlay');
  overlay.classList.add('visible');
  overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('visible'); };
}

function selectedItems() {
  return [...db.items].sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
}

function cmdAdd(rest) {
  if (!rest) { statusMsg('Usage: /add type name  OR  /add type | name | service | notes'); return; }
  let type = '';
  let name = '';
  let nextServiceOn = '';
  let notes = '';
  const pipeParts = splitPipe(rest);
  if (pipeParts.length >= 2) {
    [type, name] = pipeParts;
    nextServiceOn = normalizeDate(pipeParts[2] || '');
    notes = pipeParts[3] || '';
  } else {
    const bits = rest.split(/\s+/);
    type = bits.shift() || '';
    name = bits.join(' ');
  }
  if (!type || !name) { statusMsg('Usage: /add type name'); return; }
  db.items.push({
    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    type: type.toLowerCase(),
    name: name.trim(),
    nextServiceOn,
    notes: notes ? [notes] : [],
    createdAt: new Date().toISOString()
  });
  saveDB();
  render();
  statusMsg(`Added ${type.toLowerCase()}: ${name}`);
}

function getItemByNumber(nRaw) {
  const n = parseInt(nRaw, 10);
  if (Number.isNaN(n) || n < 1) return null;
  const list = selectedItems();
  return { n, item: list[n - 1] || null, list };
}

function cmdDelete(arg1) {
  const lookup = getItemByNumber(arg1);
  if (!lookup || !lookup.item) { statusMsg('Usage: /delete [n]'); return; }
  db.items = db.items.filter(i => i.id !== lookup.item.id);
  db.repairs = db.repairs.filter(r => r.itemId !== lookup.item.id);
  saveDB();
  render();
  statusMsg(`Deleted #${lookup.n}: ${lookup.item.name}`);
}

function cmdService(rest) {
  const parts = rest.split(/\s+/);
  const lookup = getItemByNumber(parts[0]);
  const date = normalizeDate(parts[1] || '');
  if (!lookup || !lookup.item || !date) { statusMsg('Usage: /service [n] [YYYY-MM-DD]'); return; }
  const target = db.items.find(i => i.id === lookup.item.id);
  target.nextServiceOn = date;
  saveDB();
  render();
  statusMsg(`Service date set for #${lookup.n}: ${date}`);
}

function cmdRepair(rest) {
  const parts = rest.split(/\s+/);
  const lookup = getItemByNumber(parts[0]);
  const date = normalizeDate(parts[1] || '');
  const note = parts.slice(2).join(' ').trim();
  if (!lookup || !lookup.item || !date) { statusMsg('Usage: /repair [n] [YYYY-MM-DD] [note]'); return; }
  db.repairs.push({
    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    itemId: lookup.item.id,
    itemName: lookup.item.name,
    date,
    note,
    createdAt: new Date().toISOString()
  });
  saveDB();
  render();
  statusMsg(`Repair logged for #${lookup.n}`);
}

function cmdNote(rest) {
  const parts = rest.split(/\s+/);
  const lookup = getItemByNumber(parts[0]);
  const note = parts.slice(1).join(' ').trim();
  if (!lookup || !lookup.item || !note) { statusMsg('Usage: /note [n] [text]'); return; }
  const target = db.items.find(i => i.id === lookup.item.id);
  if (!Array.isArray(target.notes)) target.notes = [];
  target.notes.push(note);
  saveDB();
  render();
  statusMsg(`Note added to #${lookup.n}`);
}

function cmdList(filter) {
  const list = selectedItems().filter(i => !filter || filter === 'all' || i.type === filter.toLowerCase());
  if (!list.length) { statusMsg('No matching gear found.'); return; }
  document.getElementById('help-title').textContent = 'GEAR LIST';
  document.getElementById('help-body').textContent = list.map((item, idx) => {
    const service = item.nextServiceOn || 'none';
    return `${idx + 1}. [${item.type}] ${item.name}  service:${service}`;
  }).join('\n');
  openOverlay();
}

function render() {
  const items = selectedItems();
  const repairs = [...db.repairs].sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 12);
  const today = todayStr();
  const due = items.filter(i => i.nextServiceOn && i.nextServiceOn <= today).sort((a, b) => a.nextServiceOn.localeCompare(b.nextServiceOn));

  document.getElementById('metric-items').textContent = String(items.length);
  document.getElementById('metric-types').textContent = String(new Set(items.map(i => i.type)).size);
  document.getElementById('metric-due').textContent = String(due.length);
  document.getElementById('metric-repairs').textContent = String(db.repairs.length);

  const dueList = document.getElementById('due-list');
  dueList.innerHTML = due.length
    ? due.slice(0, 5).map(i => `<div class="line"><span class="warn">${escHtml(i.nextServiceOn)}</span> — ${escHtml(i.name)} <span class="dim">(${escHtml(i.type)})</span></div>`).join('')
    : '<span class="ok">No overdue service dates.</span>';

  const gearList = document.getElementById('gear-list');
  gearList.innerHTML = items.length
    ? items.map((i, idx) => {
        const service = i.nextServiceOn ? `<span class="${i.nextServiceOn <= today ? 'warn' : 'ok'}">${escHtml(i.nextServiceOn)}</span>` : '<span class="dim">none</span>';
        const notes = Array.isArray(i.notes) && i.notes.length ? ` · notes:${i.notes.length}` : '';
        return `<div class="line">${idx + 1}. <span class="ok">[${escHtml(i.type)}]</span> ${escHtml(i.name)} <span class="dim">service:${service}${notes}</span></div>`;
      }).join('')
    : '<span class="dim">No gear yet. Add one with /add.</span>';

  const repairList = document.getElementById('repair-list');
  repairList.innerHTML = repairs.length
    ? repairs.map(r => `<div class="line"><span class="ok">${escHtml(r.date)}</span> ${escHtml(r.itemName)} <span class="dim">${escHtml(r.note || 'maintenance')}</span></div>`).join('')
    : '<span class="dim">No repairs logged yet. Use /repair.</span>';

  updateStatus();
}

function exportDataTxt() {
  const lines = ['# GEAR TERMINAL — ' + todayStr(), '', 'ITEMS'];
  selectedItems().forEach((item, idx) => {
    lines.push(`${idx + 1}. [${item.type}] ${item.name}`);
    lines.push(`   next service: ${item.nextServiceOn || 'none'}`);
    if (Array.isArray(item.notes) && item.notes.length) {
      item.notes.forEach(n => lines.push(`   - note: ${n}`));
    }
  });
  lines.push('', 'REPAIRS');
  db.repairs.forEach(r => lines.push(`- ${r.date} | ${r.itemName} | ${r.note || 'maintenance'}`));
  return lines.join('\n') + '\n';
}

function exportDataJson() {
  return {
    schemaVersion: 1,
    exportedAt: new Date().toISOString(),
    theme: db.theme || 'legacy',
    items: db.items,
    repairs: db.repairs
  };
}

function isValidImport(obj) {
  return obj && obj.schemaVersion === 1 && Array.isArray(obj.items) && Array.isArray(obj.repairs);
}

function importData(obj) {
  db.items = obj.items;
  db.repairs = obj.repairs;
  if (typeof obj.theme === 'string' && THEMES.includes(obj.theme)) db.theme = obj.theme;
  db.backlog = Array.isArray(db.backlog) ? db.backlog : [];
  db.backlogArchive = Array.isArray(db.backlogArchive) ? db.backlogArchive : [];
}

function cmdExport(format) {
  const now = todayStr();
  const doTxt = !format || format === 'txt';
  const doJson = !format || format === 'json';
  if (!doTxt && !doJson) { statusMsg('Usage: /export [txt|json]'); return; }
  if (doTxt) downloadBlob(exportDataTxt(), `${EXPORT_SLUG}-${now}.txt`, 'text/plain');
  if (doJson) downloadBlob(JSON.stringify(exportDataJson(), null, 2), `${EXPORT_SLUG}-${now}.json`, 'application/json');
  statusMsg('Exported' + (format ? ' as .' + format : ' txt + json'));
}

function cmdImport() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.json';
  fileInput.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const obj = JSON.parse(evt.target.result);
        if (!isValidImport(obj)) { statusMsg('Invalid import file.'); return; }
        importData(obj);
        saveDB();
        applyTheme(db.theme || 'legacy');
        render();
        statusMsg('Imported: ' + file.name);
      } catch {
        statusMsg('Failed to parse import file.');
      }
    };
    reader.readAsText(file);
  };
  fileInput.click();
}

function showBacklogList() {
  document.getElementById('help-title').textContent = 'BACKLOG';
  const body = document.getElementById('help-body');
  body.style.whiteSpace = 'normal';
  body.innerHTML = db.backlog.map((b, i) => {
    const bracket = b.done ? '[x]' : '[ ]';
    return `<div style="padding:2px 0"><span data-backlog-idx="${i}" style="cursor:pointer;user-select:none;color:var(--accent)">${bracket}</span> ${i + 1}. ${escHtml(b.text)}</div>`;
  }).join('');
  body.querySelectorAll('[data-backlog-idx]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.backlogIdx, 10);
      db.backlog[idx].done = !db.backlog[idx].done;
      saveDB();
      showBacklogList();
    });
  });
  openOverlay();
}

function handleBacklog(arg) {
  if (!arg || arg === 'list') {
    if (!db.backlog.length) { statusMsg('Backlog is empty.'); return; }
    showBacklogList();
    return;
  }
  if (arg === 'archive list') {
    if (!db.backlogArchive.length) { statusMsg('No archived batches.'); return; }
    document.getElementById('help-title').textContent = 'BACKLOG ARCHIVE';
    document.getElementById('help-body').style.whiteSpace = 'pre';
    document.getElementById('help-body').textContent = db.backlogArchive.flatMap(batch => [
      `── ${batch.date} (${batch.items.length} item${batch.items.length === 1 ? '' : 's'}) ──`,
      ...batch.items.map(b => `  [x] ${b.text}`)
    ]).join('\n');
    openOverlay();
    return;
  }
  if (arg === 'archive') {
    const done = db.backlog.filter(b => b.done);
    if (!done.length) { statusMsg('No done items to archive.'); return; }
    db.backlog = db.backlog.filter(b => !b.done);
    db.backlogArchive.push({ date: todayStr(), items: done });
    saveDB();
    statusMsg(`Archived ${done.length} done item${done.length === 1 ? '' : 's'}.`);
    return;
  }
  if (arg === 'export') {
    if (!db.backlog.length) { statusMsg('Backlog is empty.'); return; }
    const txt = '# BACKLOG — ' + todayStr() + '\n\n' + db.backlog.map(b => `- ${b.done ? '[x]' : '[ ]'} ${b.text}`).join('\n') + '\n';
    downloadBlob(txt, `backlog-${todayStr()}.txt`, 'text/plain');
    statusMsg(`Exported ${db.backlog.length} backlog item${db.backlog.length === 1 ? '' : 's'}.`);
    return;
  }
  if (arg.startsWith('delete ') || arg.startsWith('del ')) {
    const n = parseInt(arg.split(' ')[1], 10);
    const item = db.backlog[n - 1];
    if (!item) { statusMsg(`No backlog item #${n}.`); return; }
    db.backlog.splice(n - 1, 1);
    saveDB();
    statusMsg(`Backlog #${n} deleted.`);
    return;
  }
  if (arg.startsWith('done ')) {
    const n = parseInt(arg.split(' ')[1], 10);
    const item = db.backlog[n - 1];
    if (!item) { statusMsg(`No backlog item #${n}.`); return; }
    item.done = !item.done;
    saveDB();
    statusMsg(`Backlog #${n} marked ${item.done ? 'done' : 'open'}.`);
    return;
  }
  db.backlog.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), text: arg, done: false, createdAt: new Date().toISOString() });
  saveDB();
  statusMsg(`Backlog: added "${arg}"`);
}

document.getElementById('help-close').onclick = () => document.getElementById('help-overlay').classList.remove('visible');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('help-overlay').classList.remove('visible');
  if (document.activeElement !== input) input.focus();
});

function init() {
  db = loadDB();
  applyTheme(db.theme || 'legacy');
  render();
  input.focus();
}
window.addEventListener('DOMContentLoaded', init);
</script>
