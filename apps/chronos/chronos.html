<!DOCTYPE html>
<html lang="en" data-theme="space">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Fira+Code:wght@300;400;500&family=Source+Code+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ── THEME VARIABLES ───────────────────────────────────────────────── */
:root {
  --font: 'Fira Code', 'Source Code Pro', monospace;
  --font-size: 14px;
  --line-h: 1.4;
}
[data-theme="legacy"] {
  --bg:#0d0a00;--fg:#ffb000;--accent:#ffd700;--dim:#7a5800;--muted:#1a1400;
  --border:#3d2e00;--success:#80c000;--warn:#ff6000;
  --cat-1:#ffd700;--cat-2:#ff4444;--cat-3:#ff9900;--cat-4:#80c000;--cat-5:#40c8e0;
  --cat-6:#c080ff;--cat-7:#ff80c0;--cat-8:#00e8a0;--cat-9:#e0e040;--cat-10:#ff8040;
  --font:'VT323',monospace;--font-size:18px;
}
[data-theme="solar"] {
  --bg:#002b36;--fg:#839496;--accent:#268bd2;--dim:#586e75;--muted:#073642;
  --border:#0a4050;--success:#859900;--warn:#cb4b16;
  --cat-1:#268bd2;--cat-2:#dc322f;--cat-3:#b58900;--cat-4:#859900;--cat-5:#2aa198;
  --cat-6:#6c71c4;--cat-7:#d33682;--cat-8:#00b4a0;--cat-9:#cb4b16;--cat-10:#859900;
}
[data-theme="monk"] {
  --bg:#f8f4e8;--fg:#2c2c2c;--accent:#1a1a8c;--dim:#888;--muted:#ede8d8;
  --border:#ccc;--success:#2a7a2a;--warn:#c04000;
  --cat-1:#1a1a8c;--cat-2:#c0202020;--cat-3:#b06000;--cat-4:#2a7a2a;--cat-5:#007070;
  --cat-6:#700070;--cat-7:#c03060;--cat-8:#006040;--cat-9:#804000;--cat-10:#404080;
}
[data-theme="space"] {
  --bg:#06060f;--fg:#c8d8f0;--accent:#4fc8ff;--dim:#4a5a70;--muted:#0d1020;
  --border:#1a2540;--success:#40e080;--warn:#ff6040;
  --cat-1:#4fc8ff;--cat-2:#ff4060;--cat-3:#ffb040;--cat-4:#40e080;--cat-5:#40c0c0;
  --cat-6:#c060ff;--cat-7:#ff60a0;--cat-8:#00e8b0;--cat-9:#ffe060;--cat-10:#ff8060;
}
[data-theme="synth"] {
  --bg:#0a0010;--fg:#e0c0ff;--accent:#ff40ff;--dim:#604080;--muted:#140020;
  --border:#300050;--success:#40ff80;--warn:#ff8020;
  --cat-1:#ff40ff;--cat-2:#ff2060;--cat-3:#ffb020;--cat-4:#40ff80;--cat-5:#40e0ff;
  --cat-6:#c040ff;--cat-7:#ff40a0;--cat-8:#00ffb0;--cat-9:#fff040;--cat-10:#ff6040;
}
[data-theme="dos"] {
  --bg:#0000aa;--fg:#aaaaaa;--accent:#ffffff;--dim:#555555;--muted:#000088;
  --border:#5555ff;--success:#55ff55;--warn:#ff5555;
  --cat-1:#ffffff;--cat-2:#ff5555;--cat-3:#ffff55;--cat-4:#55ff55;--cat-5:#55ffff;
  --cat-6:#ff55ff;--cat-7:#ffaaaa;--cat-8:#aaffaa;--cat-9:#aaaaff;--cat-10:#ffaa55;
}
[data-theme="notebook"] {
  --bg:#fafaf2;--fg:#1a1a2e;--accent:#c0392b;--dim:#8a8a9a;--muted:#eeeede;
  --border:#90a8d4;--success:#2e7d32;--warn:#e65100;
  --cat-1:#c0392b;--cat-2:#d84315;--cat-3:#f57c00;--cat-4:#2e7d32;--cat-5:#1565c0;
  --cat-6:#6a1b9a;--cat-7:#00838f;--cat-8:#4e342e;--cat-9:#37474f;--cat-10:#880e4f;
}

/* ── BASE ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--font-size);
  line-height: var(--line-h);
}

/* ── APP SHELL ─────────────────────────────────────────────────────── */
#app {
  display: grid;
  grid-template-rows: 90vh 10vh;
  width: 100vw; height: 100vh;
}

/* ── TIMELINE PANEL ────────────────────────────────────────────────── */
#timeline-panel {
  display: grid;
  grid-template-columns: 1fr;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}

/* ── SWIMLANE AREA ─────────────────────────────────────────────────── */
#swimlane-area {
  position: relative;
  overflow: hidden;
}
#swimlane-header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  height: 28px;
  min-height: 28px;
}
.lane-header-cell {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72em; letter-spacing: 2px;
  color: var(--accent);
  border-right: 1px solid var(--muted);
  padding: 0 4px;
  text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;
  transition: background 0.15s;
}
.lane-header-cell:hover { background: var(--muted); }
.lane-header-cell.hidden-lane { opacity: 0.35; text-decoration: line-through; }
#swimlane-scroll {
  position: absolute;
  top: 28px; left: 0; right: 0; bottom: 0;
  overflow-y: scroll;
  overflow-x: hidden;
}
#swimlane-scroll::-webkit-scrollbar { width: 6px; }
#swimlane-scroll::-webkit-scrollbar-track { background: var(--muted); }
#swimlane-scroll::-webkit-scrollbar-thumb { background: var(--border); }

/* ── TIMELINE CANVAS ───────────────────────────────────────────────── */
#tl-canvas {
  position: relative;
  min-height: 100%;
}

/* ── NODE ELEMENTS ─────────────────────────────────────────────────── */
.tl-node {
  position: absolute;
  cursor: pointer;
  font-size: 0.82em;
  line-height: 1.3;
  white-space: pre;
  z-index: 5;
  transition: opacity 0.15s;
}
.tl-node:hover { z-index: 20; }
.tl-node .node-box {
  background: var(--bg);
  border: 1px solid;
  padding: 2px 6px;
  display: inline-block;
}
.tl-node .node-label {
  font-size: 0.9em;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tl-node .node-time {
  font-size: 0.75em;
  color: var(--dim);
}
.tl-node.selected .node-box {
  background: var(--muted);
}

/* secondary indicator (dot in non-primary lane) */
.tl-indicator {
  position: absolute;
  font-size: 0.9em;
  z-index: 4;
  pointer-events: none;
  opacity: 0.7;
}

/* ── DAG LINES (SVG overlay) ───────────────────────────────────────── */
#dag-svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 3;
  overflow: visible;
}

/* ── TIME GRID LINES ───────────────────────────────────────────────── */
.grid-line {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: var(--muted);
  opacity: 0.5;
  pointer-events: none;
}
.grid-line.major {
  background: var(--border);
  opacity: 0.8;
}

/* ── AXIS COLUMN ───────────────────────────────────────────────────── */
#axis-col {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  top: 0;
  bottom: 0;
  z-index: 2;
  pointer-events: none;
}
#axis-header {
  position: sticky;
  top: 0;
  height: 28px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  font-size: 0.7em;
  color: var(--accent);
  letter-spacing: 2px;
}
.axis-tick {
  position: absolute;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 0.72em;
  color: var(--dim);
  pointer-events: none;
  line-height: 1;
  transform: translateY(-50%);
  white-space: nowrap;
}
.axis-tick.major {
  color: var(--accent);
}
.axis-tick .axis-label {
  display: block;
  margin-bottom: 1px;
}
.axis-tick .axis-line {
  display: block;
  color: var(--border);
  letter-spacing: 0;
}
.axis-tick.major .axis-line {
  color: var(--accent);
  opacity: 0.6;
}
.axis-vline {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 1px;
  background: var(--border);
  top: 0;
  bottom: 0;
  pointer-events: none;
  opacity: 0.4;
}
.axis-now {
  position: absolute;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 0.65em;
  color: var(--accent);
  pointer-events: none;
  transform: translateY(-50%);
  z-index: 5;
  white-space: nowrap;
}

/* ── CONSOLE ROW ───────────────────────────────────────────────────── */
#console-row {
  display: flex; align-items: center;
  background: var(--muted);
  border-top: 1px solid var(--border);
  padding: 0 8px;
  gap: 6px;
  height: 10vh;
}
#console-prompt {
  color: var(--accent);
  font-size: 0.85em;
  letter-spacing: 1px;
  white-space: nowrap;
  flex-shrink: 0;
}
#console-input {
  flex: 1;
  background: transparent;
  border: none; outline: none;
  color: var(--fg);
  font-family: var(--font);
  font-size: 0.9em;
  caret-color: var(--accent);
}
#console-status {
  color: var(--dim);
  font-size: 0.75em;
  letter-spacing: 2px;
  min-width: 160px;
  text-align: right;
  white-space: nowrap;
  flex-shrink: 0;
}
/* ── OVERLAY ───────────────────────────────────────────────────────── */
#help-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); z-index: 150;
  align-items: center; justify-content: center;
}
#help-overlay.active { display: flex; }
.overlay-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 18px 22px;
  min-width: 580px; max-width: min(90vw,820px);
  max-height: 80vh; overflow-y: auto;
  font-family: var(--font); color: var(--fg);
}
.overlay-box::-webkit-scrollbar { width: 4px; }
.overlay-box::-webkit-scrollbar-thumb { background: var(--border); }
#help-title {
  color: var(--accent);
  letter-spacing: 2px;
  font-size: 0.8em;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--muted);
  padding-bottom: 6px;
}
#help-body {
  white-space: pre;
  line-height: 1.85;
  font-size: 0.82em;
}
.overlay-footer {
  color: var(--dim);
  font-size: 0.78em;
  margin-top: 10px;
  border-top: 1px solid var(--muted);
  padding-top: 6px;
  cursor: pointer;
}

/* ── BOOT OVERLAY ──────────────────────────────────────────────────── */
#boot-overlay {
  display: none; position: fixed; inset: 0;
  background: var(--bg); z-index: 200;
  flex-direction: column;
  font-family: var(--font);
}
#boot-overlay.active { display: flex; }
#boot-log {
  flex: 1; overflow-y: auto; padding: 24px 32px;
  font-size: 0.88em; line-height: 2;
}
#boot-log::-webkit-scrollbar { width: 4px; }
#boot-log::-webkit-scrollbar-thumb { background: var(--border); }
#boot-input-row {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 32px;
  border-top: 1px solid var(--border);
  background: var(--muted);
}
#boot-prompt { color: var(--accent); font-size: 0.9em; }
#boot-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--fg); font-family: var(--font); font-size: 0.9em;
  caret-color: var(--accent);
}
.boot-line { display: block; }
.boot-line.sys { color: var(--dim); }
.boot-line.ask { color: var(--accent); font-weight: 600; }
.boot-line.ans { color: var(--fg); }
.boot-line.info { color: var(--success); }
.boot-line.warn { color: var(--warn); }
.boot-line.sep { color: var(--dim); }

/* ── GUIDED ADD OVERLAY ────────────────────────────────────────────── */
#add-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); z-index: 160;
  align-items: center; justify-content: center;
}
#add-overlay.active { display: flex; }
#add-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 20px 24px;
  width: min(90vw, 560px);
  font-family: var(--font);
}
#add-log {
  font-size: 0.82em; line-height: 1.9;
  min-height: 80px; margin-bottom: 10px;
  white-space: pre-wrap;
}
#add-input-row {
  display: flex; align-items: center; gap: 8px;
  border-top: 1px solid var(--muted); padding-top: 8px;
}
#add-prompt { color: var(--accent); font-size: 0.85em; white-space: nowrap; }
#add-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--fg); font-family: var(--font); font-size: 0.9em;
  caret-color: var(--accent);
}

/* ── TOOLTIP ───────────────────────────────────────────────────────── */
#tooltip {
  position: fixed; display: none;
  background: var(--muted);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--font);
  font-size: 0.75em;
  padding: 6px 10px;
  line-height: 1.6;
  pointer-events: none;
  z-index: 300;
  white-space: pre;
  max-width: 320px;
}

/* ── NODE DETAIL PANEL (slides in from right) ──────────────────────── */
#detail-panel {
  position: fixed;
  right: 0; top: 0; bottom: 10vh;
  width: 280px;
  background: var(--bg);
  border-left: 1px solid var(--border);
  z-index: 50;
  padding: 14px;
  font-size: 0.8em;
  transform: translateX(100%);
  transition: transform 0.2s ease;
  overflow-y: auto;
}
#detail-panel.open { transform: translateX(0); }
#detail-panel::-webkit-scrollbar { width: 4px; }
#detail-panel::-webkit-scrollbar-thumb { background: var(--border); }
.detail-header {
  color: var(--accent); letter-spacing: 2px; font-size: 0.8em;
  border-bottom: 1px solid var(--muted); padding-bottom: 5px; margin-bottom: 10px;
}
.detail-field { margin-bottom: 8px; }
.detail-label { color: var(--dim); font-size: 0.85em; letter-spacing: 1px; }
.detail-value { color: var(--fg); margin-top: 2px; word-break: break-all; }
.detail-cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.cat-badge {
  padding: 1px 6px; font-size: 0.82em;
  border: 1px solid; border-radius: 0;
}
.detail-close {
  color: var(--dim); cursor: pointer; font-size: 0.8em;
  margin-top: 12px; display: inline-block;
}
.detail-close:hover { color: var(--warn); }

/* ── EDGE MARKER ───────────────────────────────────────────────────── */
.edge-marker {
  position: sticky;
  left: 0; right: 0;
  padding: 2px 8px;
  font-size: 0.72em;
  color: var(--accent);
  background: var(--muted);
  border: 1px solid var(--border);
  z-index: 8;
  display: inline-block;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<!-- BOOT OVERLAY -->
<div id="boot-overlay">
  <div id="boot-log"></div>
  <div id="boot-input-row">
    <span id="boot-prompt">CHRONOS&gt;</span>
    <input id="boot-input" type="text" autocomplete="off" spellcheck="false">
  </div>
</div>

<!-- GUIDED ADD OVERLAY -->
<div id="add-overlay">
  <div id="add-box">
    <div class="detail-header">◈ NEW EVENT</div>
    <div id="add-log"></div>
    <div id="add-input-row">
      <span id="add-prompt">&gt;</span>
      <input id="add-input" type="text" autocomplete="off" spellcheck="false">
    </div>
  </div>
</div>

<!-- HELP OVERLAY -->
<div id="help-overlay">
  <div class="overlay-box">
    <div id="help-title">◈ CHRONOS — COMMAND REFERENCE</div>
    <div id="help-body"></div>
    <div class="overlay-footer" id="help-close">[ESC] CLOSE</div>
  </div>
</div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<!-- DETAIL PANEL -->
<div id="detail-panel">
  <div class="detail-header">◈ EVENT DETAIL</div>
  <div id="detail-content"></div>
  <span class="detail-close" id="detail-close">[ESC] CLOSE</span>
</div>

<!-- APP -->
<div id="app">
  <div id="timeline-panel">
    <div id="swimlane-area">
      <div id="swimlane-header"></div>
      <div id="swimlane-scroll">
        <div id="tl-canvas">
          <div id="axis-col">
            <div id="axis-header">
              <span id="axis-zoom-label">ZOOM: WEEK</span>
            </div>
          </div>
          <svg id="dag-svg"></svg>
        </div>
      </div>
    </div>
  </div>

  <div id="console-row">
    <span id="console-prompt">CHRONOS&gt;</span>
    <input type="text" id="console-input" autocomplete="off" spellcheck="false" placeholder="type /help for commands">
    <span id="console-status">READY</span>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════
// CHRONOS — Core Logic
// ══════════════════════════════════════════════════════════════════════

const STORAGE_KEY = 'chronos_db';
const CAT_VARS = ['--cat-1','--cat-2','--cat-3','--cat-4','--cat-5',
                  '--cat-6','--cat-7','--cat-8','--cat-9','--cat-10'];

// Zoom levels: 18 steps with ≤5× factor between consecutive levels.
// Ordered coarsest→finest (index 0 = 10YEAR, index 17 = 1MIN) so that
// zoomIn (idx++) moves toward more detail and zoomOut (idx--) moves toward overview.
// mspp = ms represented by PX_PER_ROW pixels at this zoom level.
const ZOOM_LEVELS = [
  { label: '10YEAR', mspp: 1000*60*60*24*365*10 / 60 },
  { label: '3YEAR',  mspp: 1000*60*60*24*365*3  / 60 },
  { label: '1YEAR',  mspp: 1000*60*60*24*365    / 60 },
  { label: '6MONTH', mspp: 1000*60*60*24*182    / 60 },
  { label: '3MONTH', mspp: 1000*60*60*24*91     / 60 },
  { label: '1MONTH', mspp: 1000*60*60*24*30     / 60 },
  { label: '2WEEK',  mspp: 1000*60*60*24*14     / 60 },
  { label: '1WEEK',  mspp: 1000*60*60*24*7      / 60 },
  { label: '3DAY',   mspp: 1000*60*60*24*3      / 60 },
  { label: '1DAY',   mspp: 1000*60*60*24        / 60 },
  { label: '8HR',    mspp: 1000*60*60*8         / 60 },
  { label: '4HR',    mspp: 1000*60*60*4         / 60 },
  { label: '2HR',    mspp: 1000*60*60*2         / 60 },
  { label: '1HR',    mspp: 1000*60*60           / 60 },
  { label: '30MIN',  mspp: 1000*60*30           / 60 },
  { label: '15MIN',  mspp: 1000*60*15           / 60 },
  { label: '5MIN',   mspp: 1000*60*5            / 60 },
  { label: '1MIN',   mspp: 1000*60              / 60 },
];

// ── DB ────────────────────────────────────────────────────────────────
let db = {
  events: [],          // { uid, ts, label, cats, deps, meta }
  hiddenCats: [],
  zoomIdx: 7,          // default: 1WEEK
  viewTopMs: null,     // ms at the top of the current viewport (null = auto-fit)
  theme: 'space',
  backlog: [],
  backlogArchive: [],
};

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      db.events   = saved.events   || [];
      db.hiddenCats = saved.hiddenCats || [];
      db.zoomIdx    = saved.zoomIdx    ?? 3;
      db.viewTopMs  = saved.viewTopMs  ?? null;
      db.theme    = saved.theme    || 'space';
      db.backlog        = saved.backlog        || [];
      db.backlogArchive = saved.backlogArchive || [];
    }
  } catch(e) {}
}

function saveDB() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e) {}
}

// ── UTILS ─────────────────────────────────────────────────────────────
function uid() {
  return Math.random().toString(36).slice(2,8).toUpperCase();
}

function getCSSVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function catColor(catName) {
  const cats = allCategories();
  const idx = cats.indexOf(catName);
  if (idx < 0) return getCSSVar('--fg');
  return getCSSVar(CAT_VARS[idx % CAT_VARS.length]);
}

function allCategories() {
  const seen = new Set();
  db.events.forEach(e => (e.cats||[]).forEach(c => seen.add(c)));
  return Array.from(seen);
}

function visibleCategories() {
  return allCategories().filter(c => !db.hiddenCats.includes(c));
}

function parseTS(str) {
  if (!str) return null;
  // Try relative: "now", "+2d", "-3h" etc.
  const relM = str.match(/^([+-])(\d+)([smhdwMy])$/);
  if (relM) {
    const sign = relM[1] === '+' ? 1 : -1;
    const n = parseInt(relM[2]);
    const unit = relM[3];
    const ms = { s:1000, m:60000, h:3600000, d:86400000,
                 w:604800000, M:2592000000, y:31536000000 }[unit] || 0;
    return Date.now() + sign * n * ms;
  }
  if (str.toLowerCase() === 'now') return Date.now();
  const d = new Date(str);
  return isNaN(d) ? null : d.getTime();
}

// zoom: a ZOOM_LEVELS object; format depends on how much detail is visible.
// mspp=60000 is the 1HR zoom level; mspp=43200000 is the 1MONTH zoom level.
function fmtTS(ms, zoom) {
  const d = new Date(ms);
  const mspp = zoom.mspp;
  if (mspp <= 60000)     return d.toISOString().slice(0,19).replace('T',' '); // 1HR or finer: HH:MM:SS
  if (mspp <= 43200000)  return d.toISOString().slice(0,16).replace('T',' '); // 1MONTH or finer: date+HH:MM
  return d.toISOString().slice(0,10);                                          // coarser: date only
}

// ── STATUS ────────────────────────────────────────────────────────────
let statusTimer = null;
function statusMsg(msg) {
  const el = document.getElementById('console-status');
  el.textContent = msg;
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.textContent = 'READY'; }, 3000);
}

// ── TOOLTIP ───────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTooltip(e, html) {
  tooltip.style.display = 'block';
  tooltip.innerHTML = html;
  moveTooltip(e);
}
function moveTooltip(e) {
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + 330 > window.innerWidth) x = e.clientX - 330;
  if (y + 120 > window.innerHeight) y = e.clientY - 120;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }
document.addEventListener('mousemove', e => {
  if (tooltip.style.display !== 'none') moveTooltip(e);
});

// ══════════════════════════════════════════════════════════════════════
// RENDERING
// ══════════════════════════════════════════════════════════════════════
//
// COORDINATE SYSTEM:
//   canvasTopMs:    ms at Y=0 (top of canvas = most future time shown)
//   canvasBottomMs: ms at Y=totalH (bottom of canvas = oldest time)
//   Y increases downward; ms decreases as Y increases (future at top)
//   db.viewTopMs:   ms at the top of the current viewport

const PX_PER_ROW = 52;          // pixels per logical row
const AXIS_WIDTH = 120;         // CSS width of #axis-col
const AXIS_HALF = AXIS_WIDTH / 2; // half-width used for lane layout
const AXIS_HEADER_H = 28;       // height of #axis-header (matches CSS)
const NODE_MARGIN = 8;          // px gap between lane edge and node
const TARGET_VIEWPORT_FILL = 0.65; // target fraction of viewport for autoFit

let selectedUID = null;

function getZoom() { return ZOOM_LEVELS[db.zoomIdx] || ZOOM_LEVELS[3]; }

function getCanvasBounds() {
  const msPerPx = getZoom().mspp / PX_PER_ROW;
  const PAD_ROWS = 10;
  let topMs, bottomMs;
  if (db.events.length === 0) {
    const now = Date.now();
    topMs    = now + PAD_ROWS * getZoom().mspp;
    bottomMs = now - PAD_ROWS * getZoom().mspp;
  } else {
    const tss = db.events.map(e => e.ts);
    topMs    = Math.max(...tss) + PAD_ROWS * getZoom().mspp;
    bottomMs = Math.min(...tss) - PAD_ROWS * getZoom().mspp;
  }
  const totalH = (topMs - bottomMs) / msPerPx;
  return { topMs, bottomMs, totalH, msPerPx };
}

// ms → pixel Y (future = smaller Y = top of canvas)
function msToY(ms) {
  const { topMs, msPerPx } = getCanvasBounds();
  return (topMs - ms) / msPerPx;
}

// pixel Y → ms
function yToMs(y) {
  const { topMs, msPerPx } = getCanvasBounds();
  return topMs - y * msPerPx;
}

function render() {
  renderSwimlaneHeader();
  renderTimeline();
  renderAxis();
  saveDB();
  // Restore scroll position
  const scroll = document.getElementById('swimlane-scroll');
  if (db.viewTopMs !== null) {
    const y = msToY(db.viewTopMs);
    if (Math.abs(scroll.scrollTop - y) > 2) {
      scroll.scrollTop = Math.max(0, y);
    }
  }
}

// ── SWIMLANE HEADER ───────────────────────────────────────────────────
function renderSwimlaneHeader() {
  const cats = allCategories();
  const header = document.getElementById('swimlane-header');
  header.innerHTML = '';
  if (cats.length === 0) {
    const ph = document.createElement('div');
    ph.className = 'lane-header-cell';
    ph.style.color = 'var(--dim)';
    ph.style.letterSpacing = '2px';
    ph.style.fontSize = '0.7em';
    ph.textContent = '◈ CHRONOS — NO EVENTS — type /help to begin';
    header.appendChild(ph);
    return;
  }
  cats.forEach(cat => {
    const cell = document.createElement('div');
    cell.className = 'lane-header-cell' + (db.hiddenCats.includes(cat) ? ' hidden-lane' : '');
    const color = catColor(cat);
    cell.style.color = color;
    cell.style.borderBottomColor = color;
    cell.textContent = cat.toUpperCase();
    cell.title = '';
    cell.addEventListener('click', () => {
      toggleCat(cat);
    });
    cell.addEventListener('mouseenter', e => {
      const evts = db.events.filter(ev => (ev.cats||[]).includes(cat));
      showTooltip(e, `<b style="color:${color}">${cat}</b>\n${evts.length} event(s)\nClick to toggle visibility`);
    });
    cell.addEventListener('mouseleave', hideTooltip);
    header.appendChild(cell);
  });
}

function toggleCat(cat) {
  if (db.hiddenCats.includes(cat)) {
    db.hiddenCats = db.hiddenCats.filter(c => c !== cat);
    statusMsg(`SHOW: ${cat}`);
  } else {
    db.hiddenCats.push(cat);
    statusMsg(`HIDE: ${cat}`);
  }
  render();
}

// ── TIMELINE ──────────────────────────────────────────────────────────
function renderTimeline() {
  const canvas = document.getElementById('tl-canvas');
  const svg    = document.getElementById('dag-svg');
  const cats   = allCategories();

  // Clear old nodes and grid lines (keep axis-col and svg)
  Array.from(canvas.querySelectorAll('.tl-node,.tl-indicator,.grid-line,.edge-marker')).forEach(el => el.remove());
  svg.innerHTML = '';

  const { topMs, bottomMs, totalH } = getCanvasBounds();
  canvas.style.height = totalH + 'px';
  svg.setAttribute('viewBox', `0 0 ${canvas.offsetWidth} ${totalH}`);
  svg.style.height = totalH + 'px';

  // Grid lines
  const zoom = getZoom();
  const gridMs = gridInterval(zoom);
  const firstGrid = Math.floor(bottomMs / gridMs) * gridMs;
  for (let ms = firstGrid; ms <= topMs + gridMs; ms += gridMs) {
    const y = msToY(ms);
    if (y < 0 || y > totalH) continue;
    const line = document.createElement('div');
    line.className = 'grid-line' + (isGridMajor(ms, zoom) ? ' major' : '');
    line.style.top = y + 'px';
    canvas.appendChild(line);
  }

  if (cats.length === 0) return;

  // Left/right lane layout
  const leftCats  = cats.filter((c, i) => i % 2 === 0);
  const rightCats = cats.filter((c, i) => i % 2 !== 0);

  const canvasW   = canvas.offsetWidth;
  const axisCenter = canvasW / 2;
  // AXIS_HALF is defined as a top-level constant (AXIS_WIDTH / 2)
  const leftW      = axisCenter - AXIS_HALF;
  const rightW     = canvasW - axisCenter - AXIS_HALF;

  const leftLaneW  = leftCats.length  > 0 ? leftW  / leftCats.length  : leftW;
  const rightLaneW = rightCats.length > 0 ? rightW / rightCats.length : rightW;

  const sorted = [...db.events].sort((a, b) => a.ts - b.ts);

  sorted.forEach(evt => {
    const primaryCat = (evt.cats||[])[0];
    const catIdx = cats.indexOf(primaryCat);
    if (catIdx < 0) return;

    const y = msToY(evt.ts);
    const color = catColor(primaryCat);
    const isLeft = catIdx % 2 === 0;

    if (!db.hiddenCats.includes(primaryCat)) {
      const node = document.createElement('div');
      node.className = 'tl-node' + (selectedUID === evt.uid ? ' selected' : '');
      node.dataset.uid = evt.uid;
      node.style.top = y + 'px';

      if (isLeft) {
        const li = leftCats.indexOf(primaryCat);
        const rightEdge = axisCenter - AXIS_HALF - li * leftLaneW;
        const w = leftLaneW - NODE_MARGIN;
        node.style.left  = (rightEdge - w) + 'px';
        node.style.width = w + 'px';
      } else {
        const ri = rightCats.indexOf(primaryCat);
        const leftEdge = axisCenter + AXIS_HALF + ri * rightLaneW;
        node.style.left  = leftEdge + 'px';
        node.style.width = (rightLaneW - NODE_MARGIN) + 'px';
      }

      const box = document.createElement('div');
      box.className = 'node-box';
      box.style.borderColor = color;
      box.style.width = '100%';

      const lbl = document.createElement('div');
      lbl.className = 'node-label';
      lbl.style.color = color;
      lbl.textContent = (isLeft ? `${evt.label} ├` : `┤ ${evt.label}`);

      const ts = document.createElement('div');
      ts.className = 'node-time';
      ts.textContent = fmtTS(evt.ts, zoom);

      box.appendChild(lbl);
      box.appendChild(ts);
      node.appendChild(box);

      node.addEventListener('click', () => openDetail(evt.uid));
      node.addEventListener('mouseenter', e => {
        const meta = evt.meta ? Object.entries(evt.meta).map(([k,v])=>`  ${k}: ${v}`).join('\n') : '';
        const deps = (evt.deps||[]).map(d => {
          const dep = db.events.find(x => x.uid === d);
          return dep ? `  ← ${dep.label} [${dep.uid}]` : `  ← [${d}]`;
        }).join('\n');
        showTooltip(e,
          `<b style="color:${color}">${evt.label}</b>\n` +
          `UID: ${evt.uid}\n` +
          `TIME: ${new Date(evt.ts).toISOString()}\n` +
          `CATS: ${(evt.cats||[]).join(', ')||'—'}\n` +
          (deps ? `DEPS:\n${deps}\n` : '') +
          (meta ? `META:\n${meta}` : '')
        );
      });
      node.addEventListener('mouseleave', hideTooltip);
      canvas.appendChild(node);
    }

    // Secondary indicators
    (evt.cats||[]).slice(1).forEach(sc => {
      if (db.hiddenCats.includes(sc)) return;
      const si = cats.indexOf(sc);
      if (si < 0) return;
      const isLeftSec = si % 2 === 0;
      let indX;
      if (isLeftSec) {
        const li2 = leftCats.indexOf(sc);
        indX = axisCenter - AXIS_HALF - li2 * leftLaneW - leftLaneW / 2;
      } else {
        const ri2 = rightCats.indexOf(sc);
        indX = axisCenter + AXIS_HALF + ri2 * rightLaneW + rightLaneW / 2;
      }
      const ind = document.createElement('div');
      ind.className = 'tl-indicator';
      ind.style.left  = (indX - 6) + 'px';
      ind.style.top   = y + 'px';
      ind.style.color = catColor(sc);
      ind.textContent = '◇';
      canvas.appendChild(ind);
    });
  });

  // DAG lines
  renderDAG(sorted, cats, leftCats, rightCats, axisCenter, AXIS_HALF, leftLaneW, rightLaneW, svg);
}

function renderDAG(sorted, cats, leftCats, rightCats, axisCenter, AXIS_HALF, leftLaneW, rightLaneW, svg) {
  const accentColor = getCSSVar('--accent');

  function eventCenterX(evt) {
    const primaryCat = (evt.cats||[])[0];
    const catIdx = cats.indexOf(primaryCat);
    if (catIdx < 0) return axisCenter;
    const isLeft = catIdx % 2 === 0;
    if (isLeft) {
      const li = leftCats.indexOf(primaryCat);
      const rightEdge = axisCenter - AXIS_HALF - li * leftLaneW;
      return rightEdge - (leftLaneW - NODE_MARGIN) / 2;
    } else {
      const ri = rightCats.indexOf(primaryCat);
      const leftEdge = axisCenter + AXIS_HALF + ri * rightLaneW;
      return leftEdge + (rightLaneW - NODE_MARGIN) / 2;
    }
  }

  db.events.forEach(evt => {
    if (!(evt.deps||[]).length) return;
    const tgtCat = (evt.cats||[])[0];
    if (db.hiddenCats.includes(tgtCat)) return;
    if (cats.indexOf(tgtCat) < 0) return;

    const tgtX = eventCenterX(evt);
    const tgtY = msToY(evt.ts);

    evt.deps.forEach(depUID => {
      const dep = db.events.find(e => e.uid === depUID);
      if (!dep) return;
      const srcCat = (dep.cats||[])[0];
      if (db.hiddenCats.includes(srcCat)) return;
      if (cats.indexOf(srcCat) < 0) return;

      const srcX = eventCenterX(dep);
      const srcY = msToY(dep.ts);

      const midY = (srcY + tgtY) / 2;
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      const d = Math.abs(srcX - tgtX) < NODE_MARGIN
        ? `M ${srcX} ${srcY} L ${tgtX} ${tgtY}`
        : `M ${srcX} ${srcY} L ${srcX} ${midY} L ${tgtX} ${midY} L ${tgtX} ${tgtY}`;

      path.setAttribute('d', d);
      path.setAttribute('stroke', accentColor);
      path.setAttribute('stroke-width', '1');
      path.setAttribute('stroke-dasharray', '4 3');
      path.setAttribute('fill', 'none');
      path.setAttribute('opacity', '0.5');
      svg.appendChild(path);

      const arrow = document.createElementNS('http://www.w3.org/2000/svg','polygon');
      arrow.setAttribute('points', `${tgtX-4},${tgtY-8} ${tgtX+4},${tgtY-8} ${tgtX},${tgtY}`);
      arrow.setAttribute('fill', accentColor);
      arrow.setAttribute('opacity', '0.6');
      svg.appendChild(arrow);
    });
  });
}

// ── AXIS ──────────────────────────────────────────────────────────────
function renderAxis() {
  const axisCol = document.getElementById('axis-col');
  // Clear old ticks/lines/markers (keep the header div)
  Array.from(axisCol.querySelectorAll('.axis-tick,.axis-now,.axis-vline')).forEach(el => el.remove());

  const { topMs, bottomMs, totalH } = getCanvasBounds();

  // Vertical centre line
  const vline = document.createElement('div');
  vline.className = 'axis-vline';
  axisCol.appendChild(vline);

  const zoom = getZoom();
  const gridMs = gridInterval(zoom);
  const firstGrid = Math.floor(bottomMs / gridMs) * gridMs;
  const W = 5; // ASCII chars per side

  for (let ms = firstGrid; ms <= topMs + gridMs; ms += gridMs) {
    const y = msToY(ms);
    if (y < 0 || y > totalH) continue;
    const major = isGridMajor(ms, zoom);

    const tick = document.createElement('div');
    tick.className = 'axis-tick' + (major ? ' major' : '');
    tick.style.top = y + 'px';

    const label = document.createElement('span');
    label.className = 'axis-label';
    label.textContent = rulerLabel(ms, zoom);
    tick.appendChild(label);

    const line = document.createElement('span');
    line.className = 'axis-line';
    const side = '─'.repeat(W);
    line.textContent = major ? `${side}┤ ├${side}` : `──┤ ├──`;
    tick.appendChild(line);

    axisCol.appendChild(tick);
  }

  // TODAY marker
  const nowY = msToY(Date.now());
  if (nowY >= 0 && nowY <= totalH) {
    const nowMarker = document.createElement('div');
    nowMarker.className = 'axis-now';
    nowMarker.style.top = nowY + 'px';
    nowMarker.textContent = '◆ NOW';
    axisCol.appendChild(nowMarker);
  }

  // Update zoom label in axis header
  document.getElementById('axis-zoom-label').textContent = `ZOOM: ${getZoom().label}`;
}

function gridInterval(zoom) {
  // Choose a round grid interval based on zoom
  const mspp = zoom.mspp;
  const targetPx = 80;
  const ms = mspp * targetPx / PX_PER_ROW;
  const candidates = [
    1000, 5000, 15000, 30000,
    60000, 300000, 900000, 1800000,
    3600000, 21600000, 43200000,
    86400000, 604800000, 2592000000,
    7776000000, 31536000000, 315360000000
  ];
  for (let c of candidates) if (c >= ms) return c;
  return candidates[candidates.length-1];
}

function isGridMajor(ms, zoom) {
  const d = new Date(ms);
  const mspp = zoom.mspp;
  // Thresholds below match ZOOM_LEVELS mspp values (1YEAR=525600000, 1MONTH=43200000, etc.).
  // Major ticks mark the next-larger natural boundary above the grid interval.
  if (mspp >= 1000*60*60*24*365/60) return d.getMonth() === 0 && d.getDate() === 1; // ≥1YEAR: Jan 1
  if (mspp >= 1000*60*60*24*30/60)  return d.getDate() === 1;                        // ≥1MONTH: 1st
  if (mspp >= 1000*60*60*24*7/60)   return d.getDay() === 0;                         // ≥1WEEK: Sunday
  if (mspp >= 1000*60*60*24/60)     return d.getHours() === 0;                       // ≥1DAY: midnight
  if (mspp >= 1000*60*60/60)        return d.getMinutes() === 0 && d.getSeconds() === 0; // ≥1HR: hour
  if (mspp >= 1000*60*5/60)         return d.getSeconds() === 0;                     // ≥5MIN: minute
  return d.getSeconds() % 30 === 0;                                                  // 1MIN: 30s
}

function rulerLabel(ms, zoom) {
  const d = new Date(ms);
  const mspp = zoom.mspp;
  if (mspp >= 525600000) return d.getFullYear().toString();                // ≥1YEAR: year
  if (mspp >= 43200000) {                                                  // ≥1MONTH: YYYY-MM
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  if (mspp >= 1440000) {                                                   // ≥1DAY: MM-DD
    const mo = String(d.getMonth()+1).padStart(2,'0');
    const dy = String(d.getDate()).padStart(2,'0');
    return `${mo}-${dy}`;
  }
  if (mspp >= 15000) {                                                     // ≥15MIN: HH:MM
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    return `${hh}:${mm}`;
  }
  const hh = String(d.getHours()).padStart(2,'0');                        // <15MIN: HH:MM:SS
  const mm = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  return `${hh}:${mm}:${ss}`;
}

// ── SCROLL & ZOOM ─────────────────────────────────────────────────────
function setupScrollSync() {
  const scroll = document.getElementById('swimlane-scroll');
  scroll.addEventListener('scroll', () => {
    db.viewTopMs = yToMs(scroll.scrollTop);
    saveDB();
  });

  scroll.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      if (e.deltaY > 0) zoomOut();
      else zoomIn();
    }
  }, { passive: false });
}

function zoomIn() {
  if (db.zoomIdx < ZOOM_LEVELS.length - 1) {
    const scroll = document.getElementById('swimlane-scroll');
    const centerMs = yToMs(scroll.scrollTop + scroll.clientHeight / 2);
    db.zoomIdx++;
    render();
    const newCenterY = msToY(centerMs);
    scroll.scrollTop = Math.max(0, newCenterY - scroll.clientHeight / 2);
    db.viewTopMs = yToMs(scroll.scrollTop);
    statusMsg('ZOOM IN: ' + getZoom().label);
  } else {
    statusMsg('MAX ZOOM');
  }
}

function zoomOut() {
  if (db.zoomIdx > 0) {
    const scroll = document.getElementById('swimlane-scroll');
    const centerMs = yToMs(scroll.scrollTop + scroll.clientHeight / 2);
    db.zoomIdx--;
    render();
    const newCenterY = msToY(centerMs);
    scroll.scrollTop = Math.max(0, newCenterY - scroll.clientHeight / 2);
    db.viewTopMs = yToMs(scroll.scrollTop);
    statusMsg('ZOOM OUT: ' + getZoom().label);
  } else {
    statusMsg('MIN ZOOM');
  }
}

// Scroll so that ms is vertically centred in the viewport.
function scrollToMs(ms) {
  const scroll = document.getElementById('swimlane-scroll');
  const y = msToY(ms) - scroll.clientHeight / 2;
  scroll.scrollTop = Math.max(0, y);
  db.viewTopMs = yToMs(scroll.scrollTop);
  saveDB();
}

function autoFit(cb) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const scroll = document.getElementById('swimlane-scroll');
    const availH = Math.max(scroll.clientHeight, window.innerHeight * 0.88);

    if (db.events.length === 0) {
      db.zoomIdx = 7;   // 1WEEK default for empty timeline
      db.viewTopMs = null;
      render();
      requestAnimationFrame(() => {
        scrollToMs(Date.now());
        if (cb) cb();
      });
      return;
    }

    const tss = db.events.map(e => e.ts);
    const minMs = Math.min(...tss);
    const maxMs = Math.max(...tss);
    const spanMs = (maxMs - minMs) || 2 * 86400000;

    // Find finest zoom level where event span fills ≤65% of viewport height.
    // Iterate from coarsest (index 0) to finest (last index), keeping the
    // last index that still fits.  Break as soon as the content is too tall.
    let best = 0;
    for (let i = 0; i < ZOOM_LEVELS.length; i++) {
      const msPerPx = ZOOM_LEVELS[i].mspp / PX_PER_ROW;
      const pxSpan = spanMs / msPerPx;
      if (pxSpan <= availH * TARGET_VIEWPORT_FILL) {
        best = i;
      } else {
        break;
      }
    }

    db.zoomIdx = best;
    db.viewTopMs = null;
    render();

    requestAnimationFrame(() => {
      scrollToMs(minMs + spanMs / 2);
      if (cb) cb();
      statusMsg('FIT: ' + getZoom().label);
    });
  }));
}

// ══════════════════════════════════════════════════════════════════════
// DETAIL PANEL
// ══════════════════════════════════════════════════════════════════════
function openDetail(evtUID) {
  const evt = db.events.find(e => e.uid === evtUID);
  if (!evt) return;
  selectedUID = evtUID;
  render();

  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');
  const primaryCat = (evt.cats||[])[0];
  const color = primaryCat ? catColor(primaryCat) : getCSSVar('--fg');

  let html = '';
  html += `<div class="detail-field"><div class="detail-label">UID</div><div class="detail-value" style="color:var(--dim)">${evt.uid}</div></div>`;
  html += `<div class="detail-field"><div class="detail-label">LABEL</div><div class="detail-value" style="color:${color}">${evt.label}</div></div>`;
  html += `<div class="detail-field"><div class="detail-label">TIMESTAMP</div><div class="detail-value">${new Date(evt.ts).toISOString()}</div></div>`;

  if ((evt.cats||[]).length) {
    html += `<div class="detail-field"><div class="detail-label">CATEGORIES</div><div class="detail-cats">`;
    evt.cats.forEach(c => {
      const cc = catColor(c);
      html += `<span class="cat-badge" style="color:${cc};border-color:${cc}">${c}</span>`;
    });
    html += `</div></div>`;
  }

  if ((evt.deps||[]).length) {
    html += `<div class="detail-field"><div class="detail-label">DEPENDENCIES</div>`;
    evt.deps.forEach(d => {
      const dep = db.events.find(e => e.uid === d);
      html += `<div class="detail-value" style="font-size:0.9em">← ${dep ? dep.label : '?'} <span style="color:var(--dim)">[${d}]</span></div>`;
    });
    html += `</div>`;
  }

  if (evt.meta && Object.keys(evt.meta).length) {
    html += `<div class="detail-field"><div class="detail-label">METADATA</div>`;
    Object.entries(evt.meta).forEach(([k,v]) => {
      html += `<div class="detail-value" style="font-size:0.88em"><span style="color:var(--dim)">${k}:</span> ${v}</div>`;
    });
    html += `</div>`;
  }

  // Edit/delete buttons
  html += `<div style="margin-top:14px;display:flex;gap:8px;">`;
  html += `<span onclick="deleteEvent('${evt.uid}')" style="cursor:pointer;color:var(--warn);font-size:0.8em;border:1px solid var(--warn);padding:2px 8px">[DEL]</span>`;
  html += `</div>`;

  content.innerHTML = html;

function deleteEvent(evtUID) {
  if (!evtUID) return;

  db.events.forEach(e => { e.deps = (e.deps||[]).filter(d => d !== evtUID); });

  render();
  statusMsg(`DELETED: ${evt.label}`);
}

function handleConsoleCmd(raw) {
  const input = raw.trim();
  if (!input) return;

  // history
  cmdHistory.push(input);
  histIdx = cmdHistory.length;

  const parts = input.split(/\s+/);
  const cmd = parts[0].toLowerCase();

  if (cmd === '/help') {
    document.getElementById('help-body').textContent = HELP_TEXT;
    document.getElementById('help-overlay').classList.add('active');
    return;
  }

  if (cmd === '/add') {
    if (parts.length === 1) {
      openGuidedAdd();
    } else {
      inlineAdd(input);
    }
    return;
  }

  if (cmd === '/link') {
    const [,src,tgt] = parts;
    if (!src || !tgt) { statusMsg('USAGE: /link <src_id> <tgt_id>'); return; }
    cmdLink(src.toUpperCase(), tgt.toUpperCase());
    return;
  }

  if (cmd === '/show') {
    const cat = parts.slice(1).join(' ');
    db.hiddenCats = db.hiddenCats.filter(c => c !== cat);
    render(); statusMsg(`SHOW: ${cat}`); return;
  }

  if (cmd === '/hide') {
    const cat = parts.slice(1).join(' ');
    if (!db.hiddenCats.includes(cat)) db.hiddenCats.push(cat);
    render(); statusMsg(`HIDE: ${cat}`); return;
  }

  if (cmd === '/goto') {
    const arg = parts.slice(1).join(' ');
    const evt = db.events.find(e => e.uid === arg.toUpperCase());
    if (evt) { scrollToMs(evt.ts); statusMsg(`GOTO: ${evt.label}`); return; }
    const ms = parseTS(arg);
    if (ms) { scrollToMs(ms); statusMsg(`GOTO: ${new Date(ms).toISOString().slice(0,10)}`); return; }
    statusMsg('NOT FOUND: ' + arg);
    return;
  }

  if (cmd === '/zoom') {
    const arg = parts[1]?.toUpperCase();
    if (!arg || arg === 'FIT') { autoFit(); return; }
    const idx = ZOOM_LEVELS.findIndex(z => z.label === arg);
    if (idx < 0) {
      statusMsg('LEVELS: FIT ' + ZOOM_LEVELS.map(z=>z.label).join(' '));
      return;
    }
    db.zoomIdx = idx;
    render(); statusMsg('ZOOM: ' + arg);
    return;
  }

  if (cmd === '/fit') { autoFit(); return; }

  if (cmd === '/export') {
    const fmt = parts[1]?.toLowerCase();
    if (fmt === 'json') exportJSON();
    else if (fmt === 'txt') exportTXT();
    else statusMsg('USAGE: /export json|txt');
    return;
  }

  if (cmd === '/delete') {
    const id = parts[1]?.toUpperCase();
    if (!id) { statusMsg('USAGE: /delete <id>'); return; }
    deleteEvent(id);
    return;
  }

  if (cmd === '/list') {
    const sorted = [...db.events].sort((a,b) => a.ts - b.ts);
    const lines = sorted.map(e => {
      const ts = new Date(e.ts).toISOString().slice(0,19);
      const cats = (e.cats||[]).join(',') || '—';
      return `${e.uid}  ${ts}  [${cats}]  ${e.label}`;
    });
    const txt = lines.length ? lines.join('\n') : '(no events)';
    document.getElementById('help-body').textContent = '◈ EVENT LIST\n───────────────────────────────────────────────────────\n' + txt;
    document.getElementById('help-overlay').classList.add('active');
    return;
  }

  if (cmd === '/theme') {
    const name = parts[1];
    const themes = ['legacy','solar','monk','space','synth','dos','notebook'];
    if (!name) {
      const others = themes.filter(t => t !== db.theme);
      const picked = others[Math.floor(Math.random() * others.length)];
      db.theme = picked;
      document.documentElement.setAttribute('data-theme', picked);
      saveDB(); render(); statusMsg('THEME: ' + picked);
      return;
    }
    if (!themes.includes(name)) { statusMsg('THEMES: ' + themes.join(' ')); return; }
    db.theme = name;
    document.documentElement.setAttribute('data-theme', name);
    saveDB(); render(); statusMsg('THEME: ' + name);
    return;
  }

  if (cmd === '/backlog') {
    handleBacklog(raw.slice('/backlog'.length).trim());
    return;
  }

  statusMsg(`Unknown: ${cmd}. /help`);
}

// ── INLINE ADD ────────────────────────────────────────────────────────
function inlineAdd(input) {
  // /add Label -t TIME -c cat1,cat2 -d uid1,uid2 -m key:val,key2:val2
  const flags = {};
  const labelM = input.match(/^\/add\s+(.*?)(?=\s+-[tcmd]|$)/);
  if (!labelM || !labelM[1].trim()) { statusMsg('USAGE: /add <label> -t <time> ...'); return; }
  const label = labelM[1].trim();

  const tM = input.match(/-t\s+(\S+)/);
  const cM = input.match(/-c\s+(\S+)/);
  const dM = input.match(/-d\s+(\S+)/);
  const mM = input.match(/-m\s+(\S+)/);

  const ts = tM ? parseTS(tM[1]) : Date.now();
  if (!ts) { statusMsg('BAD TIME: ' + tM?.[1]); return; }

  const cats = cM ? cM[1].split(',').map(s=>s.trim()).filter(Boolean) : [];
  const deps = dM ? dM[1].split(',').map(s=>s.trim().toUpperCase()).filter(Boolean) : [];
  let meta = {};
  if (mM) {
    mM[1].split(',').forEach(pair => {
      const [k,...v] = pair.split(':');
      if (k) meta[k.trim()] = v.join(':').trim();
    });
  }

  // Validate deps
  for (const d of deps) {
    const dep = db.events.find(e => e.uid === d);
    if (!dep) { statusMsg(`DEP NOT FOUND: ${d}`); return; }
    if (dep.ts > ts) { statusMsg(`DEP FUTURE: ${d}`); return; }
  }

  const evt = { uid: uid(), ts, label, cats, deps, meta };
  db.events.push(evt);
  render();
  statusMsg(`ADDED: ${evt.uid} — ${label}`);
  setTimeout(() => scrollToMs(ts), 50);
}

// ── GUIDED ADD ────────────────────────────────────────────────────────
let guidedState = {};
let guidedStep = '';

const GUIDED_STEPS = ['label','time','cats','deps','confirm'];

function openGuidedAdd() {
  guidedState = { label:'', ts: Date.now(), cats:[], deps:[], meta:{} };
  guidedStep = 'label';
  const log = document.getElementById('add-log');
  log.innerHTML = '';
  addBootLine(log, 'sys', '◈ NEW EVENT — guided mode (ESC to cancel)');
  addBootLine(log, 'sep', '─'.repeat(44));
  addBootLine(log, 'ask', 'Label:');
  document.getElementById('add-prompt').textContent = 'label>';
  document.getElementById('add-overlay').classList.add('active');
  document.getElementById('add-input').value = '';
  document.getElementById('add-input').focus();
}

function addBootLine(container, cls, text) {
  const span = document.createElement('span');
  span.className = 'boot-line ' + cls;
  span.textContent = text + '\n';
  container.appendChild(span);
}

document.getElementById('add-input').addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('add-overlay').classList.remove('active');
    document.getElementById('console-input').focus();
    statusMsg('CANCELLED');
    return;
  }
  if (e.key !== 'Enter') return;
  const val = e.target.value.trim();
  e.target.value = '';
  const log = document.getElementById('add-log');

  if (guidedStep === 'label') {
    if (!val) { addBootLine(log, 'warn', 'Label cannot be empty.'); return; }
    guidedState.label = val;
    addBootLine(log, 'ans', '  ' + val);
    addBootLine(log, 'ask', 'Timestamp (ISO/now/+2d/-3h, Enter=now):');
    document.getElementById('add-prompt').textContent = 'time>';
    guidedStep = 'time';
  } else if (guidedStep === 'time') {
    const ms = val ? parseTS(val) : Date.now();
    if (!ms) { addBootLine(log, 'warn', 'Cannot parse: ' + val); return; }
    guidedState.ts = ms;
    addBootLine(log, 'ans', '  ' + new Date(ms).toISOString());
    addBootLine(log, 'ask', 'Categories (comma-separated, or Enter to skip):');
    document.getElementById('add-prompt').textContent = 'cats>';
    guidedStep = 'cats';
  } else if (guidedStep === 'cats') {
    guidedState.cats = val ? val.split(',').map(s=>s.trim()).filter(Boolean) : [];
    addBootLine(log, 'ans', '  ' + (guidedState.cats.join(', ') || '(none)'));
    addBootLine(log, 'ask', 'Dependency UIDs (comma-separated, or Enter to skip):');
    document.getElementById('add-prompt').textContent = 'deps>';
    guidedStep = 'deps';
  } else if (guidedStep === 'deps') {
    const ids = val ? val.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean) : [];
    let bad = false;
    for (const id of ids) {
      const dep = db.events.find(e => e.uid === id);
      if (!dep) { addBootLine(log, 'warn', `Not found: ${id}`); bad = true; break; }
      if (dep.ts > guidedState.ts) { addBootLine(log, 'warn', `Dep is after target: ${id}`); bad = true; break; }
    }
    if (bad) return;
    guidedState.deps = ids;
    addBootLine(log, 'ans', '  ' + (ids.join(', ') || '(none)'));
    addBootLine(log, 'sep', '─'.repeat(44));
    addBootLine(log, 'info', `  ${guidedState.label}`);
    addBootLine(log, 'sys',  `  ${new Date(guidedState.ts).toISOString()}`);
    if (guidedState.cats.length) addBootLine(log, 'sys', `  cats: ${guidedState.cats.join(', ')}`);
    if (guidedState.deps.length) addBootLine(log, 'sys', `  deps: ${guidedState.deps.join(', ')}`);
    addBootLine(log, 'ask', 'Confirm? (Enter=yes, n=cancel):');
    document.getElementById('add-prompt').textContent = 'ok?>';
    guidedStep = 'confirm';
  } else if (guidedStep === 'confirm') {
    if (val.toLowerCase() === 'n') {
      document.getElementById('add-overlay').classList.remove('active');
      document.getElementById('console-input').focus();
      statusMsg('CANCELLED');
      return;
    }
    const evt = { uid: uid(), ts: guidedState.ts, label: guidedState.label,
                  cats: guidedState.cats, deps: guidedState.deps, meta: {} };
    db.events.push(evt);
    render();
    document.getElementById('add-overlay').classList.remove('active');
    document.getElementById('console-input').focus();
    statusMsg(`ADDED: ${evt.uid} — ${evt.label}`);
    setTimeout(() => scrollToMs(evt.ts), 80);
  }
  log.scrollTop = log.scrollHeight;
});

// ── LINK ──────────────────────────────────────────────────────────────
function cmdLink(srcUID, tgtUID) {
  const src = db.events.find(e => e.uid === srcUID);
  const tgt = db.events.find(e => e.uid === tgtUID);
  if (!src) { statusMsg(`NOT FOUND: ${srcUID}`); return; }
  if (!tgt) { statusMsg(`NOT FOUND: ${tgtUID}`); return; }
  if (src.ts > tgt.ts) { statusMsg(`TEMPORAL ERROR: ${srcUID} is after ${tgtUID}`); return; }
  if ((tgt.deps||[]).includes(srcUID)) { statusMsg('ALREADY LINKED'); return; }
  tgt.deps = [...(tgt.deps||[]), srcUID];
  render();
  statusMsg(`LINKED: ${src.label} → ${tgt.label}`);
}

// BACKLOG

function todayStr() { return new Date().toISOString().slice(0,10); }

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showBacklogList() {
  const body = document.getElementById('help-body');
  body.style.whiteSpace = 'normal';
  body.innerHTML = '<div style="margin-bottom:4px">◈ BACKLOG (' + db.backlog.length + ')</div>'
    + db.backlog.map((b, i) => {
      const bracket = b.done ? '[x]' : '[ ]';
      return `<div style="padding:2px 0"><span data-backlog-idx="${i}" style="cursor:pointer;user-select:none;color:var(--accent)">${bracket}</span> ${i+1}. ${escHtml(b.text)}</div>`;
    }).join('');
  body.querySelectorAll('[data-backlog-idx]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.backlogIdx);
      db.backlog[idx].done = !db.backlog[idx].done;
      saveDB();
      showBacklogList();
    });
  });
  document.getElementById('help-overlay').classList.add('active');
}

function handleBacklog(arg) {
  if (!arg || arg === 'list') {
    if (!db.backlog.length) { statusMsg('Backlog is empty.'); return; }
    showBacklogList();
    return;
  }
  if (arg === 'archive list') {
    if (!db.backlogArchive.length) { statusMsg('No archived batches.'); return; }
    const lines = db.backlogArchive.flatMap(batch => [
      `── ${batch.date} (${batch.items.length} item${batch.items.length===1?'':'s'}) ──`,
      ...batch.items.map(b => `  [x] ${b.text}`)
    ]);
    document.getElementById('help-body').style.whiteSpace = 'pre';
    document.getElementById('help-body').textContent = '◈ BACKLOG ARCHIVE\n───────────────────────────────────────────────────────\n' + lines.join('\n');
    document.getElementById('help-overlay').classList.add('active');
    return;
  }
  if (arg === 'archive') {
    const done = db.backlog.filter(b => b.done);
    if (!done.length) { statusMsg('No done items to archive.'); return; }
    db.backlog = db.backlog.filter(b => !b.done);
    db.backlogArchive.push({ date: todayStr(), items: done });
    saveDB();
    statusMsg(`Archived ${done.length} done item${done.length===1?'':'s'}.`);
    return;
  }
  if (arg === 'export') {
    exportBacklog(); return;
  }
  if (arg.startsWith('delete ') || arg.startsWith('del ')) {
    const n = parseInt(arg.split(' ')[1]);
    const item = db.backlog[n-1];
    if (!item) { statusMsg(`No backlog item #${n}.`); return; }
    db.backlog.splice(n-1, 1);
    saveDB();
    statusMsg(`Backlog #${n} deleted: "${item.text}"`);
    return;
  }
  if (arg.startsWith('done ')) {
    const n = parseInt(arg.split(' ')[1]);
    const item = db.backlog[n-1];
    if (!item) { statusMsg(`No backlog item #${n}.`); return; }
    item.done = !item.done;
    saveDB();
    statusMsg(`Backlog #${n} marked ${item.done ? 'done' : 'open'}: "${item.text}"`);
    return;
  }
  db.backlog.push({
    id: Date.now()+'_'+Math.random().toString(36).slice(2,6),
    text: arg,
    done: false,
    createdAt: new Date().toISOString()
  });
  saveDB();
  statusMsg(`Backlog: added "${arg}" (${db.backlog.length} item${db.backlog.length===1?'':'s'})`);
}

function exportBacklog() {
  if (!db.backlog.length) { statusMsg('Backlog is empty.'); return; }
  const now = todayStr();
  const txt = '# CHRONOS BACKLOG — ' + now + '\n\n'
    + db.backlog.map(b => `- ${b.done?'[x]':'[ ]'} ${b.text}`).join('\n') + '\n';
  download(`chronos-backlog-${now}.txt`, txt, 'text/plain');
  statusMsg(`Exported ${db.backlog.length} backlog item${db.backlog.length===1?'':'s'}.`);
}

// EXPORT
// ══════════════════════════════════════════════════════════════════════
function exportJSON() {
  const data = JSON.stringify({ events: db.events, exportedAt: new Date().toISOString() }, null, 2);
  download('chronos-export.json', data, 'application/json');
  statusMsg('EXPORTED: JSON');
}

function exportTXT() {
  const zoom = getZoom();
  const cats = allCategories();
  if (!cats.length) { statusMsg('NO DATA'); return; }

  const sorted = [...db.events].sort((a,b) => a.ts - b.ts);
  const laneW = 22;
  const header = cats.map(c => c.toUpperCase().padEnd(laneW)).join('│');
  const sep = cats.map(() => '─'.repeat(laneW)).join('┼');
  let lines = ['CHRONOS EXPORT — ' + new Date().toISOString(), '─'.repeat(header.length), header, sep];

  sorted.forEach(evt => {
    const row = cats.map((cat, i) => {
      const isPrimary = (evt.cats||[])[0] === cat;
      const isSecondary = (evt.cats||[]).slice(1).includes(cat);
      if (isPrimary) return `┤${evt.label.slice(0,laneW-3)}`.padEnd(laneW);
      if (isSecondary) return '◇'.padEnd(laneW);
      return ' '.repeat(laneW);
    }).join('│');
    const ts = fmtTS(evt.ts, zoom).padStart(20);
    lines.push(`${ts} ${row}`);
  });

  download('chronos-export.txt', lines.join('\n'), 'text/plain');
  statusMsg('EXPORTED: TXT');
}

function download(filename, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

  }
});

document.getElementById('help-close').addEventListener('click', () => {
  document.getElementById('help-overlay').classList.remove('active');
});
document.getElementById('help-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('help-overlay'))
    document.getElementById('help-overlay').classList.remove('active');
});

// ══════════════════════════════════════════════════════════════════════
// RESIZE
// ══════════════════════════════════════════════════════════════════════
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});

// ══════════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════════
loadDB();
document.documentElement.setAttribute('data-theme', db.theme);

if (db.events.length === 0) {
  startBoot();
} else {
  // Always autoFit on load — rAF×2 inside guarantees clientHeight is live.
  // db.viewTopMs will be set correctly by scrollToMs inside autoFit.
  db.viewTopMs = null;
  render();
  autoFit();
  document.getElementById('console-input').focus();
}

setupScrollSync();
</script>
</body>
</html>
