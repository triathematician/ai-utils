<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP NAME</title>

<!-- ═══ DEPENDENCIES — copy these verbatim. See docs/soft-utility.md. ═══ -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" crossorigin></script>

<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                },
            },
        },
    }
</script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* Ensure Tailwind's font-mono uses JetBrains Mono */
    .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace !important;
    }
</style>
</head>

<body class="bg-[#f8f9fa] text-[#1a1a1a] antialiased">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── APP IDENTITY ────────────────────────────────────────────────────────
   Set APP_NAME once. It drives the export filename and localStorage keys.
   Use lowercase-hyphenated format to avoid collisions with other apps.   */
const APP_NAME = 'appname';   // TODO: rename

/* ─── STORAGE KEYS ────────────────────────────────────────────────────────
   Derived from APP_NAME — no need to rename these separately.            */
const STORAGE_KEY_ITEMS = `${APP_NAME}-items`;
// const STORAGE_KEY_SETTINGS = `${APP_NAME}-settings`;

/* ─── ICON COMPONENT ──────────────────────────────────────────────────────
   Use this for every Lucide icon. Never use raw <i data-lucide> in JSX —
   the React render cycle conflicts with Lucide's DOM scanning.           */
const Icon = ({ name, size = 20, className = "" }) => {
    const iconRef = useRef(null);
    useEffect(() => {
        if (iconRef.current && window.lucide) {
            const el = document.createElement('i');
            el.setAttribute('data-lucide', name);
            iconRef.current.innerHTML = '';
            iconRef.current.appendChild(el);
            window.lucide.createIcons({
                attrs: {
                    'stroke-width': 2,
                    stroke: 'currentColor',
                    width: size,
                    height: size,
                    class: className,
                },
            });
        }
    }, [name, size, className]);
    return (
        <span
            ref={iconRef}
            className={`inline-flex items-center justify-center ${className}`}
            style={{ width: size, height: size }}
        />
    );
};

/* ─── MAIN APP ────────────────────────────────────────────────────────── */
function App() {
    // ── State ──────────────────────────────────────────────────────────
    const [items, setItems]           = useState([]);
    const [isAdding, setIsAdding]     = useState(false);
    const [searchTerm, setSearchTerm] = useState('');

    // Form state for the Add modal
    const [newTitle, setNewTitle] = useState('');
    const [newNote, setNewNote]   = useState('');

    const fileInputRef = useRef(null);

    // ── Load from localStorage on mount ────────────────────────────────
    useEffect(() => {
        const saved = localStorage.getItem(STORAGE_KEY_ITEMS);
        if (saved) setItems(JSON.parse(saved));
    }, []);

    // ── Persist to localStorage on every change ─────────────────────────
    useEffect(() => {
        localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));
    }, [items]);

    // ── Add item ────────────────────────────────────────────────────────
    const addItem = (e) => {
        e.preventDefault();
        const item = {
            id:    Date.now().toString(),
            title: newTitle,
            note:  newNote,
            date:  new Date().toISOString().split('T')[0],
        };
        setItems([item, ...items]);
        setIsAdding(false);
        setNewTitle('');
        setNewNote('');
    };

    // ── Delete item ─────────────────────────────────────────────────────
    const deleteItem = (id) => {
        if (confirm('Delete this item?')) {
            setItems(items.filter(i => i.id !== id));
        }
    };

    // ── Export / Import ─────────────────────────────────────────────────
    const exportData = () => {
        const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = `${APP_NAME}-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
    };

    const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const json = JSON.parse(ev.target.result);
            if (Array.isArray(json)) setItems(json);
        };
        reader.readAsText(file);
    };

    // ── Filtered view ────────────────────────────────────────────────────
    const filteredItems = items.filter(i =>
        i.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
        i.note.toLowerCase().includes(searchTerm.toLowerCase())
    );

    return (
        <div className="min-h-screen p-4 md:p-8">
            <div className="max-w-3xl mx-auto">

                {/* ── Header ──────────────────────────────────────────── */}
                <header className="flex justify-between items-center mb-10">
                    <div>
                        <h1 className="text-4xl font-light tracking-tight">App Name</h1>
                        <p className="text-sm text-gray-500 mt-1 font-medium opacity-60">Subtitle</p>
                    </div>
                    <div className="flex gap-1">
                        <button
                            onClick={() => fileInputRef.current.click()}
                            className="p-2.5 rounded-full hover:bg-white hover:shadow-sm text-gray-400 hover:text-gray-900"
                        >
                            <Icon name="upload" size={22} />
                        </button>
                        <button
                            onClick={exportData}
                            className="p-2.5 rounded-full hover:bg-white hover:shadow-sm text-gray-400 hover:text-gray-900"
                        >
                            <Icon name="download" size={22} />
                        </button>
                        <input
                            type="file"
                            ref={fileInputRef}
                            onChange={handleImport}
                            className="hidden"
                            accept=".json"
                        />
                    </div>
                </header>

                {/* ── Optional summary / reminder strip ───────────────── */}
                {/* Example: show alerts or status cards before the main list */}

                {/* ── Search + CTA ─────────────────────────────────────── */}
                <div className="flex flex-col md:flex-row gap-3 mb-12">
                    <div className="relative flex-1">
                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <Icon name="search" size={18} />
                        </span>
                        <input
                            type="text"
                            placeholder="Search..."
                            value={searchTerm}
                            onChange={e => setSearchTerm(e.target.value)}
                            className="w-full pl-11 pr-4 py-3 bg-white rounded-2xl shadow-sm border border-gray-100 outline-none"
                        />
                    </div>
                    <button
                        onClick={() => setIsAdding(true)}
                        className="bg-[#1a1a1a] text-white px-6 py-3 rounded-2xl shadow-lg hover:bg-gray-800 active:scale-[0.98] transition-all flex items-center justify-center gap-2 font-bold whitespace-nowrap"
                    >
                        <Icon name="plus" size={20} /> Add Item
                    </button>
                </div>

                {/* ── Item list ─────────────────────────────────────────── */}
                <div className="space-y-3">
                    <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1 mb-4">
                        Items
                    </h2>

                    {filteredItems.length === 0 ? (
                        <div className="w-full text-center py-20 bg-white rounded-[32px] border border-dashed border-gray-200 text-gray-400">
                            No items found
                        </div>
                    ) : (
                        filteredItems.map(item => (
                            <div
                                key={item.id}
                                className="group flex items-center gap-4 bg-white px-5 py-1.5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-all w-full"
                            >
                                {/* Optional icon badge:
                                <div className="p-1.5 rounded-xl bg-blue-100 text-blue-700">
                                    <Icon name="circle" size={18} />
                                </div> */}
                                <div className="flex-1 flex items-center justify-between min-w-0">
                                    <div className="flex items-center gap-4 min-w-0">
                                        <span className="font-bold text-sm">{item.title}</span>
                                        {item.note && (
                                            <span className="text-xs text-gray-500 truncate max-w-[400px] italic border-l border-gray-200 pl-4 hidden sm:block">
                                                {item.note}
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <span className="text-xs font-mono bg-gray-50 px-3 py-0.5 rounded-lg text-gray-400">
                                            {/* 'YYYY-MM-DD' strings are ambiguous in Safari; replace - with /
                                                so new Date() treats them as local time, not UTC midnight */}
                                            {new Date(item.date.replace(/-/g, '/')).toLocaleDateString(undefined, {
                                                year: 'numeric', month: 'short', day: 'numeric',
                                            })}
                                        </span>
                                        {/* Delete: hidden by default, visible on card hover */}
                                        <button
                                            onClick={() => deleteItem(item.id)}
                                            className="p-1.5 text-gray-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                                        >
                                            <Icon name="trash-2" size={16} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))
                    )}
                </div>

                {/* ── Add Modal ─────────────────────────────────────────── */}
                {isAdding && (
                    <div className="fixed inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-10 relative">
                            <button
                                onClick={() => setIsAdding(false)}
                                className="absolute top-6 right-6 p-2 text-gray-400 hover:text-gray-900"
                            >
                                <Icon name="x" size={24} />
                            </button>
                            <h2 className="text-3xl font-light mb-8">New Item</h2>
                            <form onSubmit={addItem} className="space-y-6">
                                <input
                                    type="text"
                                    placeholder="Title"
                                    required
                                    value={newTitle}
                                    onChange={e => setNewTitle(e.target.value)}
                                    className="w-full p-4 bg-gray-50 rounded-2xl outline-none font-medium"
                                />
                                <textarea
                                    placeholder="Notes..."
                                    value={newNote}
                                    onChange={e => setNewNote(e.target.value)}
                                    className="w-full p-4 bg-gray-50 rounded-2xl outline-none min-h-[120px] resize-none font-medium"
                                />
                                <button
                                    type="submit"
                                    className="w-full py-4 bg-black text-white rounded-2xl font-bold text-lg"
                                >
                                    Save Item
                                </button>
                            </form>
                        </div>
                    </div>
                )}

            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
