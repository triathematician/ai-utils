<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-UTILS LAUNCHER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121212; --fg: #ffb000; --accent: #ff0000;
  --dim: #7a5500; --muted: #3a2800; --border: #ffb000;
  --success: #00ff41; --warn: #ff6600;
  --font: 'VT323', 'Courier New', monospace;
  --font-size: 20px; --line-h: 1.4;
}
[data-theme="solar"] {
  --bg:#002b36; --fg:#839496; --accent:#b58900;
  --dim:#4a5456; --muted:#073642; --border:#839496;
  --success:#859900; --warn:#cb4b16; --font:'Fira Code',monospace;
}
[data-theme="monk"] {
  --bg:#f5f5f5; --fg:#2a2a2a; --accent:#000000;
  --dim:#888; --muted:#e0e0e0; --border:#2a2a2a;
  --success:#1a6600; --warn:#aa4400; --font:'Source Code Pro',monospace;
}
[data-theme="space"] {
  --bg:#0a0a1a; --fg:#a0c0ff; --accent:#00ffff;
  --dim:#304060; --muted:#0f0f2a; --border:#304080;
  --success:#00ffaa; --warn:#ff6060; --font:'Fira Code',monospace;
}
[data-theme="synth"] {
  --bg:#1a0033; --fg:#ff00ff; --accent:#00ffff;
  --dim:#660066; --muted:#2a0044; --border:#ff00ff;
  --success:#00ff88; --warn:#ffaa00; --font:'Fira Code',monospace;
}
[data-theme="dos"] {
  --bg:#0000aa; --fg:#aaaaaa; --accent:#ffffff;
  --dim:#5555ff; --muted:#0000cc; --border:#aaaaaa;
  --success:#55ff55; --warn:#ffff55; --font:'VT323',monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--font-size);
  line-height: var(--line-h); overflow: hidden;
  cursor: default; user-select: none;
}
::selection { background: var(--fg); color: var(--bg); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--muted); }
::-webkit-scrollbar-thumb { background: var(--dim); }

#app {
  display: grid;
  grid-template-rows: 1fr 50px;
  height: 100vh; width: 100vw;
}

#boot-log {
  padding: 12px 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.log-sys   { color: var(--dim); }
.log-ok    { color: var(--success); }
.log-ready { color: var(--accent); }

.app-line {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.app-num    { color: var(--dim); min-width: 2ch; }
.app-name   { color: var(--accent); font-weight: bold; }
.app-desc   { color: var(--fg); flex: 1; }
.app-cat    { color: var(--dim); font-size: 0.82em; border: 1px solid var(--dim); padding: 0 4px; white-space: nowrap; }
.app-date   { color: var(--dim); font-size: 0.82em; white-space: nowrap; }
.app-launch {
  color: var(--success);
  padding: 0 6px; cursor: pointer; white-space: nowrap; font-size: 0.9em;
}
.app-launch:hover { background: var(--success); color: var(--bg); }

#console-row {
  background: var(--muted); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 8px;
}
#console-prompt { color: var(--accent); white-space: nowrap; }
#console-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--fg); font-family: var(--font); font-size: var(--font-size);
  caret-color: var(--accent);
}
#console-input:disabled { opacity: 0.4; }
#console-status {
  color: var(--dim); font-size: 0.8em; min-width: 140px;
  text-align: right; white-space: nowrap;
}

#help-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 150;
  align-items: center; justify-content: center;
}
#help-overlay.visible { display: flex; }
.overlay-box {
  background: var(--bg); border: 1px solid var(--border);
  padding: 16px 20px; min-width: 640px; max-width: min(90vw,960px);
  font-family: var(--font); color: var(--fg);
}
#help-title { color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; }
#help-body  { line-height: 1.8; max-height: 60vh; overflow-y: auto; }
#help-close { color: var(--dim); font-size: 0.82em; cursor: pointer; display: block; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="boot-log"></div>
  <div id="console-row">
    <span id="console-prompt">AI-UTILS&gt;</span>
    <input type="text" id="console-input" autocomplete="off" spellcheck="false" disabled>
    <span id="console-status">BOOTING...</span>
  </div>
</div>

<!-- ═══ HELP / BACKLOG OVERLAY ═══ -->
<div id="help-overlay">
  <div class="overlay-box">
    <div id="help-title"></div>
    <div id="help-body"></div>
    <span id="help-close">[ESC] CLOSE</span>
  </div>
</div>

<script>
const APPS = [
  { name: 'ATLAS', desc: 'Travel tracker — states, national parks, countries', category: 'one-off', path: 'apps/atlas/atlas.html', date: '2026-04-01' },
  { name: 'FOCUS TERMINAL',      desc: 'Personal productivity terminal — tasks, backlog, focus sessions', category: 'terminal-web', path: 'apps/focus-terminal/focus-terminal.html',       date: '2026-03-29' },
  { name: 'LIFE TRACKER',        desc: 'Portable appointment and life event tracker',                     category: 'soft-utility', path: 'apps/appt-tracker/appt-tracker.html',           date: '2026-03-28' },
  { name: 'PORTFOLIO SIGNAL DESK', desc: 'Portfolio monitoring and signal dashboard',                     category: 'signal-grid',  path: 'apps/portfolio-manager/portfolio-manager.html', date: '2026-03-25' },
  { name: 'DISPLAY WALL DESIGNER', desc: 'Create and preview video wall configurations',                  category: 'design-canvas', path: 'apps/display-wall/display-wall.html',          date: '2026-03-23' },
  { name: 'CHRONOS',             desc: 'Timeline and event tracking with zoom levels and dependencies',   category: 'terminal-web', path: 'apps/chronos/chronos.html',                     date: '2026-03-29' },
  { name: 'STAFF TERMINAL',      desc: 'Staff development tracker — milestones, LDP goals, notes, and Q&A walkthroughs', category: 'terminal-web', path: 'apps/staff-terminal/staff-terminal.html', date: '2026-03-30' },
  { name: 'COMPASS',             desc: 'Strategic planning terminal — goal groups, strategies, OKRs, RAG status, and pulse tracking', category: 'terminal-web', path: 'apps/compass/compass.html', date: '2026-03-30' },
  { name: 'SKILL PATHWAYS',      desc: 'Plan-first flow chart tool — blueprint rail map for skill and project pathways', category: 'design-canvas', path: 'apps/skill-pathways/skill-pathways.html', date: '2026-04-02' },
  { name: 'VAULT',               desc: 'Monthly budget tracker — income, expenses, investments with category rollups and analysis', category: 'terminal-web', path: 'apps/budget-terminal/budget-terminal.html', date: '2026-04-04' }
];

APPS.sort((a, b) => a.date.localeCompare(b.date));

const THEMES = ['legacy','solar','monk','space','synth','dos'];
const STORAGE_KEY = 'ai_utils_launcher';

function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function savePrefs(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

function applyTheme(name) {
  if (!name) {
    const p = loadPrefs();
    const current = p.theme || 'legacy';
    const others = THEMES.filter(t => t !== current);
    name = others[Math.floor(Math.random() * others.length)];
  }
  if (!THEMES.includes(name)) return statusMsg('Unknown theme: ' + name);
  document.documentElement.dataset.theme = (name === 'legacy') ? '' : name;
  const p = loadPrefs(); p.theme = name; savePrefs(p);
  statusMsg('Theme: ' + name.toUpperCase());
}

function statusMsg(msg) {
  document.getElementById('console-status').textContent = msg;
  setTimeout(() => document.getElementById('console-status').textContent = 'READY', 3000);
}

function launchApp(indexOrName) {
  let app;
  const n = parseInt(indexOrName);
  if (!isNaN(n) && n >= 1 && n <= APPS.length) {
    app = APPS[n - 1];
  } else {
    const q = String(indexOrName).toLowerCase();
    app = APPS.find(a => a.name.toLowerCase().includes(q));
  }
  if (!app) return statusMsg('App not found: ' + indexOrName);
  window.open(app.path, '_blank');
  statusMsg('Launching: ' + app.name);
}

const input = document.getElementById('console-input');

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const cmd = input.value.trim();
    input.value = '';
    if (cmd) handleCmd(cmd);
  }
});

function handleCmd(raw) {
  const parts = raw.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');
  if (cmd === '/help')    return showHelp();
  if (cmd === '/list')    return printList();
  if (cmd === '/theme')   return applyTheme(arg);
  if (cmd === '/launch')  return launchApp(arg);
  if (cmd === '/backlog') { handleBacklog(raw.slice('/backlog'.length).trim()); return; }
  statusMsg('Unknown: ' + cmd + '. Type /help');
}

function showHelp() {
  appendLine('/help             show this help', 'log-sys');
  appendLine('/list             reprint app list', 'log-sys');
  appendLine('/launch <n|name>  open app in new window', 'log-sys');
  appendLine('/theme [name]     legacy | solar | monk | space | synth | dos  (random if omitted)', 'log-sys');
  appendLine('/backlog [text]         add item to backlog', 'log-sys');
  appendLine('/backlog list           show all backlog items', 'log-sys');
  appendLine('/backlog done [n]       toggle item #n as done/open', 'log-sys');
  appendLine('/backlog delete [n]     remove item #n from backlog', 'log-sys');
  appendLine('/backlog archive        move done items to archive', 'log-sys');
  appendLine('/backlog archive list   show archived batches', 'log-sys');
  appendLine('/backlog export         download backlog as .txt', 'log-sys');
  scrollLog();
}

function printList() {
  APPS.forEach((app, i) => appendAppLine(app, i + 1));
  scrollLog();
}

const log = document.getElementById('boot-log');

function appendLine(text, cls) {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  log.appendChild(div);
  return div;
}

function appendAppLine(app, num) {
  const div = document.createElement('div');
  div.className = 'app-line';
  div.innerHTML =
    `<span class="app-num">[${num}]</span>` +
    `<span class="app-name">${app.name}</span>` +
    `<span class="app-desc">${app.desc}</span>` +
    `<span class="app-cat">${app.category}</span>` +
    `<span class="app-date">${app.date}</span>` +
    `<span class="app-launch" onclick="launchApp(${num})">[ LAUNCH ]</span>`;
  log.appendChild(div);
}

function scrollLog() { log.scrollTop = log.scrollHeight; }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function todayStr() { return new Date().toISOString().slice(0,10); }

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function downloadBlob(content, filename, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function showBacklogList() {
  const p = loadPrefs();
  const backlog = p.backlog || [];
  document.getElementById('help-title').textContent = 'BACKLOG';
  const body = document.getElementById('help-body');
  body.style.whiteSpace = 'normal';
  body.innerHTML = backlog.map((b, i) => {
    const bracket = b.done ? '[x]' : '[ ]';
    return `<div style="padding:2px 0"><span data-backlog-idx="${i}" style="cursor:pointer;user-select:none;color:var(--accent)">${bracket}</span> ${i+1}. ${escHtml(b.text)}</div>`;
  }).join('');
  body.querySelectorAll('[data-backlog-idx]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.backlogIdx);
      const p2 = loadPrefs();
      const item = (p2.backlog || [])[idx];
      if (item) item.done = !item.done;
      savePrefs(p2);
      showBacklogList();
    });
  });
  const overlay = document.getElementById('help-overlay');
  overlay.classList.add('visible');
}

function handleBacklog(arg) {
  const p = loadPrefs();
  if (!p.backlog) p.backlog = [];
  if (!p.backlogArchive) p.backlogArchive = [];

  if (!arg || arg === 'list') {
    if (!p.backlog.length) { statusMsg('Backlog is empty.'); return; }
    showBacklogList();
    return;
  }
  if (arg === 'archive list') {
    if (!p.backlogArchive.length) { statusMsg('No archived batches.'); return; }
    const lines = p.backlogArchive.flatMap(batch => [
      `── ${batch.date} (${batch.items.length} item${batch.items.length===1?'':'s'}) ──`,
      ...batch.items.map(b => `  [x] ${b.text}`)
    ]);
    document.getElementById('help-title').textContent = 'BACKLOG ARCHIVE';
    document.getElementById('help-body').style.whiteSpace = 'pre';
    document.getElementById('help-body').textContent = lines.join('\n');
    document.getElementById('help-overlay').classList.add('visible');
    return;
  }
  if (arg === 'archive') {
    const done = p.backlog.filter(b => b.done);
    if (!done.length) { statusMsg('No done items to archive.'); return; }
    p.backlog = p.backlog.filter(b => !b.done);
    p.backlogArchive.push({ date: todayStr(), items: done });
    savePrefs(p);
    statusMsg(`Archived ${done.length} done item${done.length===1?'':'s'}.`);
    return;
  }
  if (arg === 'export') {
    exportBacklog(); return;
  }
  if (arg.startsWith('delete ') || arg.startsWith('del ')) {
    const n = parseInt(arg.split(' ')[1]);
    const item = p.backlog[n-1];
    if (!item) { statusMsg(`No backlog item #${n}.`); return; }
    p.backlog.splice(n-1, 1);
    savePrefs(p);
    statusMsg(`Backlog #${n} deleted: "${item.text}"`);
    return;
  }
  if (arg.startsWith('done ')) {
    const n = parseInt(arg.split(' ')[1]);
    const item = p.backlog[n-1];
    if (!item) { statusMsg(`No backlog item #${n}.`); return; }
    item.done = !item.done;
    savePrefs(p);
    statusMsg(`Backlog #${n} marked ${item.done ? 'done' : 'open'}: "${item.text}"`);
    return;
  }
  p.backlog.push({
    id: Date.now()+'_'+Math.random().toString(36).slice(2,6),
    text: arg,
    done: false,
    createdAt: new Date().toISOString()
  });
  savePrefs(p);
  statusMsg(`Backlog: added "${arg}" (${p.backlog.length} item${p.backlog.length===1?'':'s'})`);
}

function exportBacklog() {
  const p = loadPrefs();
  const backlog = p.backlog || [];
  if (!backlog.length) { statusMsg('Backlog is empty.'); return; }
  const now = todayStr();
  const txt = '# AI-UTILS BACKLOG — ' + now + '\n\n'
    + backlog.map(b => `- ${b.done?'[x]':'[ ]'} ${b.text}`).join('\n') + '\n';
  downloadBlob(txt, `ai-utils-backlog-${now}.txt`, 'text/plain');
  statusMsg(`Exported ${backlog.length} backlog item${backlog.length===1?'':'s'}.`);
}

document.getElementById('help-close').onclick = () =>
  document.getElementById('help-overlay').classList.remove('visible');
document.getElementById('help-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('help-overlay'))
    document.getElementById('help-overlay').classList.remove('visible');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('help-overlay').classList.remove('visible');
});

async function runBoot() {
  appendLine('AI-UTILS LAUNCHER v1.0', 'log-ready');
  await delay(120);
  appendLine('INITIALIZING...', 'log-sys');
  await delay(200);
  appendLine('SCANNING MODULES...', 'log-sys');
  await delay(800);
  appendLine('', null);
  appendLine('...', 'log-sys');
  await delay(800);
  appendLine('...', 'log-sys');
  await delay(800);
  appendLine(APPS.length + ' MODULES DETECTED:', 'log-ok');

  for (let i = 0; i < APPS.length; i++) {
    await delay(180);
    appendAppLine(APPS[i], i + 1);
    scrollLog();
  }

  await delay(300);
  appendLine('', null);
  appendLine('ALL MODULES ONLINE. Type /help for commands.', 'log-ready');
  scrollLog();

  document.getElementById('console-status').textContent = 'READY';
  input.disabled = false;
  input.focus();
}

document.addEventListener('keydown', () => {
  if (!input.disabled && document.activeElement !== input) input.focus();
});

window.addEventListener('DOMContentLoaded', () => {
  const prefs = loadPrefs();
  applyTheme(prefs.theme || 'legacy');
  runBoot();
});
</script>
</body>
</html>
